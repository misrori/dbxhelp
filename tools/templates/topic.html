<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · dbxhelp</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root { --accent: #FF3621; --navy: #1B3139; --blue: #2272B4; --bg: #F9F7F4; --text: #1F2328; --muted: #6B7280; --border: #E5E7EB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--navy); color: #fff; }
  header a.home { color: #fff; text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  header .title { color: #CBD5E1; font-size: 0.95em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .toggle { display: inline-flex; background: rgba(255,255,255,0.12); border-radius: 999px; padding: 3px; }
  .toggle button { border: 0; background: transparent; color: #E2E8F0; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.9em; }
  .toggle button.active { background: #fff; color: var(--navy); font-weight: 600; }
  header .link { color: #E2E8F0; font-size: 0.85em; text-decoration: none; border: 1px solid rgba(255,255,255,0.3); padding: 5px 10px; border-radius: 6px; }
  header .link:hover { background: rgba(255,255,255,0.1); }

  /* ---------- shared markdown styling ---------- */
  .md h1 { font-size: 2em; color: var(--navy); margin: 0 0 0.5em; }
  .md h2 { color: var(--navy); border-bottom: 2px solid var(--border); padding-bottom: 0.3em; margin-top: 1.8em; }
  .md h3 { color: var(--navy); }
  .md a { color: var(--blue); }
  .md code { background: #EEF2F6; padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
  .md pre { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow: auto; }
  .md pre code { background: none; padding: 0; font-size: 0.88em; line-height: 1.5; }
  .md blockquote { margin: 1em 0; padding: 10px 16px; border-left: 4px solid var(--blue); background: #E3F2FD; border-radius: 4px; color: #1F2937; }
  .md blockquote p { margin: 0.3em 0; }
  .md table { border-collapse: collapse; width: 100%; margin: 1em 0; background: #fff; font-size: 0.95em; }
  .md th, .md td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  .md th { background: #F1F5F9; }
  .md li { margin: 0.25em 0; line-height: 1.55; }
  .md p { line-height: 1.6; }

  /* ---------- document mode ---------- */
  #doc { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
  #doc .md { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 36px 44px; }

  /* ---------- presentation mode ---------- */
  #slides { display: none; height: calc(100vh - 52px); padding: 18px; }
  body.present #doc { display: none; }
  body.present #slides { display: flex; flex-direction: column; align-items: center; }
  .stage { flex: 1; width: 100%; max-width: 1280px; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .slide { width: 100%; height: 100%; max-height: 760px; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 6px solid var(--accent); padding: 40px 56px; overflow: auto; font-size: 1.22em; }
  .slide.title-slide { display: flex; flex-direction: column; justify-content: center; background: linear-gradient(135deg, var(--navy), #24495A); color: #fff; }
  .slide.title-slide h1 { color: #fff; font-size: 2.3em; }
  .slide.title-slide blockquote { background: rgba(255,255,255,0.1); border-left-color: var(--accent); color: #fff; }
  .slide.title-slide code { background: rgba(255,255,255,0.15); color: #fff; }
  .slide.title-slide strong { color: #FFD7CF; }
  .slide h2 { margin-top: 0; font-size: 1.6em; border-bottom-color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 14px; padding-top: 12px; color: var(--muted); font-size: 0.9em; }
  .controls button { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 1em; }
  .controls button:hover { border-color: var(--blue); }
  .progress { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--accent); transition: width 0.2s; }
  body:not(.present) .progress { display: none; }
  :fullscreen #slides { height: 100vh; }
  @media (max-width: 700px) { .slide { padding: 24px; font-size: 1em; } #doc .md { padding: 20px; } header .title { display: none; } }
  @media print { header, .controls, .progress { display: none; } #doc .md { border: 0; } }
</style>
</head>
<body>
<header>
  <a class="home" href="{{HOME}}" title="All topics"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FF3621"><path d="M12 2 2 7.5l10 5.5 10-5.5L12 2Zm0 13.2L4.2 11 2 12.2 12 17.7l10-5.5-2.2-1.2L12 15.2Zm0 4.6-7.8-4.3L2 16.7 12 22l10-5.3-2.2-1.2L12 19.8Z"/></svg>dbxhelp</a>
  <span class="title">{{MODULE}} › {{TITLE}}</span>
  <div class="toggle" role="tablist">
    <button id="btnDoc" class="active" title="Document view (D)">📄 Document</button>
    <button id="btnSlides" title="Presentation view (P)">🎞️ Presentation</button>
  </div>
  <a class="link" href="{{MD_FILE}}" download>⬇ .md</a>
  <a class="link" href="{{GITHUB_URL}}" target="_blank">GitHub</a>
</header>

<main id="doc"><article class="md" id="docBody"></article></main>

<section id="slides">
  <div class="stage"><div class="slide md" id="slide"></div></div>
  <div class="controls">
    <button id="prev" title="Previous (←)">←</button>
    <span id="counter"></span>
    <button id="next" title="Next (→ / Space)">→</button>
    <button id="fs" title="Fullscreen (F)">⛶</button>
    <span>← → navigate · F fullscreen · D document</span>
  </div>
</section>
<div class="progress" id="progress"></div>

<script type="text/markdown" id="source">
{{MARKDOWN}}
</script>
<script>
{{QUIZ_JS}}
var QUIZ = {{QUIZ_JSON}};
</script>
<script>
(function () {
  var md = document.getElementById('source').textContent.replace(/<\\\/script/gi, '</script').trim();
  marked.setOptions({ gfm: true, breaks: false });
  function render(text) {
    var div = document.createElement('div');
    div.innerHTML = marked.parse(text);
    div.querySelectorAll('pre code').forEach(function (el) { try { hljs.highlightElement(el); } catch (e) {} });
    div.querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; });
    return div.innerHTML;
  }

  // Document view: the whole markdown file
  var docBody = document.getElementById('docBody');
  docBody.innerHTML = render(md);
  if (QUIZ && QUIZ.length) {
    docBody.insertAdjacentHTML('beforeend', '<h2>Check yourself</h2><div id="quizDoc"></div>');
    dbxQuiz('quizDoc', QUIZ);
  }

  // Presentation view: split on "## " headings (outside fenced code blocks)
  var slides = [], cur = [], fence = false;
  md.split('\n').forEach(function (line) {
    if (/^\s*```/.test(line)) fence = !fence;
    if (!fence && /^## /.test(line) && cur.length) { slides.push(cur.join('\n')); cur = []; }
    cur.push(line);
  });
  if (cur.length) slides.push(cur.join('\n'));
  var html = slides.map(render), idx = 0;
  if (QUIZ && QUIZ.length) { slides.push('quiz'); html.push('<h2>Check yourself</h2><div class="quiz-slot"></div>'); }

  var slideEl = document.getElementById('slide'), counter = document.getElementById('counter'), progress = document.getElementById('progress');
  function show(n) {
    idx = Math.max(0, Math.min(slides.length - 1, n));
    slideEl.innerHTML = html[idx];
    slideEl.classList.toggle('title-slide', idx === 0);
    slideEl.scrollTop = 0;
    var slot = slideEl.querySelector('.quiz-slot');
    if (slot) dbxQuiz(slot, QUIZ);
    counter.textContent = (idx + 1) + ' / ' + slides.length;
    progress.style.width = ((idx + 1) / slides.length * 100) + '%';
    history.replaceState(null, '', '#slides/' + (idx + 1));
  }
  function mode(m) {
    var present = m === 'slides';
    document.body.classList.toggle('present', present);
    document.getElementById('btnSlides').classList.toggle('active', present);
    document.getElementById('btnDoc').classList.toggle('active', !present);
    if (present) show(idx); else history.replaceState(null, '', '#doc');
  }
  document.getElementById('btnDoc').onclick = function () { mode('doc'); };
  document.getElementById('btnSlides').onclick = function () { mode('slides'); };
  document.getElementById('prev').onclick = function () { show(idx - 1); };
  document.getElementById('next').onclick = function () { show(idx + 1); };
  document.getElementById('fs').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen(); else document.getElementById('slides').requestFullscreen();
  };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var present = document.body.classList.contains('present');
    if (e.key === 'p' || e.key === 'P') return mode('slides');
    if (e.key === 'd' || e.key === 'D') return mode('doc');
    if (!present) return;
    if (['ArrowRight', 'PageDown', ' '].indexOf(e.key) >= 0) { e.preventDefault(); show(idx + 1); }
    else if (['ArrowLeft', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); show(idx - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
  });

  var m = location.hash.match(/^#slides(?:\/(\d+))?/);
  if (m) { idx = (parseInt(m[1] || '1', 10) || 1) - 1; mode('slides'); }
})();
</script>
</body>
</html>
