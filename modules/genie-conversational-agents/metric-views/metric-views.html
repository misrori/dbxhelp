<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric Views · dbxhelp</title>
<style>
.dbx{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--teal:#00A3A1;--purple:#7C4DFF;--amber:#FFAB00;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.6;max-width:1100px}
.dbx *{box-sizing:border-box}
.dbx>*{animation:dbxRise .55s cubic-bezier(.2,.7,.2,1) both}
.dbx>*:nth-child(2){animation-delay:.06s}.dbx>*:nth-child(3){animation-delay:.12s}.dbx>*:nth-child(4){animation-delay:.18s}.dbx>*:nth-child(5){animation-delay:.24s}.dbx>*:nth-child(6){animation-delay:.3s}.dbx>*:nth-child(n+7){animation-delay:.36s}
@keyframes dbxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dbxGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes dbxFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@keyframes dbxLine{from{width:0}to{width:100%}}
@keyframes dbxPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,54,33,.25)}50%{box-shadow:0 0 0 8px rgba(255,54,33,0)}}
.dbx .hero{position:relative;overflow:hidden;border-radius:18px;padding:38px 40px 34px;margin:4px 0 18px;color:#fff;background:linear-gradient(120deg,#1B3139,#22425a,#2a2f6b,#1B3139);background-size:300% 300%;animation:dbxGrad 14s ease infinite,dbxRise .6s both}
.dbx .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:dbxFloat 9s ease-in-out infinite}
.dbx .b1{width:220px;height:220px;background:#FF3621;right:-40px;top:-60px}
.dbx .b2{width:180px;height:180px;background:#7C4DFF;right:160px;bottom:-90px;animation-delay:-3s}
.dbx .b3{width:140px;height:140px;background:#00A3A1;left:-40px;bottom:-50px;animation-delay:-6s}
.dbx .hero-in{position:relative}
.dbx .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#FFC4BA;font-weight:700}
.dbx .hero h1{font-size:34px;line-height:1.15;margin:8px 0 14px;color:#fff;font-weight:800}
.dbx .kicker-inline{display:inline-block;font-size:.5em;vertical-align:middle;background:var(--accent);padding:4px 10px;border-radius:999px;margin-right:10px;letter-spacing:.08em;text-transform:uppercase}
.dbx .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dbx .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px;color:#fff}
.dbx .chip strong{color:#fff}
.dbx .sub{color:#E2E8F0;font-size:16px;margin:0;max-width:820px}
.dbx .sub strong,.dbx .sub b{color:#FFD7CF}
.dbx .sub code{background:rgba(255,255,255,.16);color:#fff}
.dbx .idea{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFF4F1,#FFF);border:1px solid #FFD0C7;border-left:5px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;animation:dbxRise .55s both,dbxPulse 3s ease-in-out 1s 2}
.dbx .idea-icon{font-size:26px;line-height:1}
.dbx .idea b{color:#C62D1A}
.dbx .sec-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;position:relative;padding-bottom:10px}
.dbx .sec-head:after{content:"";position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));animation:dbxLine .9s ease-out both}
.dbx .sec-num{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7a59);padding:5px 10px;border-radius:9px;letter-spacing:.05em}
.dbx .sec-icon{font-size:26px;line-height:1}
.dbx .sec-head h2{margin:0;font-size:25px;color:var(--navy);font-weight:800;border:0}
.dbx h3{color:var(--navy);margin:18px 0 8px}
.dbx p{margin:8px 0}
.dbx a{color:var(--blue)}
.dbx code{background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(27,49,57,.06);margin:12px 0;background:#fff}
.dbx table{border-collapse:collapse;width:100%;font-size:14px}
.dbx th{background:linear-gradient(135deg,#1B3139,#2B4F63);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
.dbx td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.dbx tr:nth-child(even) td{background:#F8FAFC}
.dbx tr:hover td{background:#FFF4F1}
.dbx td:first-child{font-weight:600;color:var(--navy)}
.dbx ul,.dbx ol{padding-left:22px;margin:8px 0}
.dbx li{margin:5px 0}
.dbx li::marker{color:var(--accent)}
.dbx li.bad,.dbx li.good{list-style:none;margin:8px 0 8px -22px;padding:10px 14px;border-radius:10px}
.dbx li.bad{background:#FFF1F0;border:1px solid #FFCDC7}
.dbx li.good{background:#ECFDF3;border:1px solid #B7EBC9}
.dbx blockquote.callout{margin:14px 0;padding:12px 16px 12px 46px;border-radius:12px;background:linear-gradient(135deg,#E8F1FF,#F5F9FF);border:1px solid #C7DBFF;position:relative;color:#1E3A5F}
.dbx blockquote.callout:before{content:"ℹ️";position:absolute;left:14px;top:11px;font-size:18px}
.dbx blockquote.callout p{margin:4px 0}
.dbx .code{border-radius:12px;overflow:hidden;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.18);background:#0D1117}
.dbx .code-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161B22;border-bottom:1px solid #30363D}
.dbx .code-bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57;display:inline-block}
.dbx .code-bar i:nth-child(2){background:#FEBC2E}.dbx .code-bar i:nth-child(3){background:#28C840}
.dbx .lang{margin-left:8px;color:#8B949E;font-size:11px;letter-spacing:.1em;font-weight:700}
.dbx .run{margin-left:auto;color:#3FB950;font-size:11px;font-weight:700}
.dbx .copy{display:none}
.dbx .code pre{margin:0;padding:14px 16px;color:#E6EDF3;font-size:13px;line-height:1.55;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:transparent}
.dbx pre.diagram{background:linear-gradient(135deg,#F8FAFC,#EEF2FF);border:1px dashed #A5B4FC;border-radius:12px;padding:14px 16px;font-size:13px;color:#312E81;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tryit{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ECFDF3,#F0FDFA);border:1px solid #A7F3D0;border-radius:12px;padding:12px 16px;margin:12px 0}
.dbx .tryit b{color:#047857}
.dbx .present{display:flex;gap:16px;align-items:center;border-radius:14px;padding:16px 20px;background:linear-gradient(120deg,#2a2f6b,#7C4DFF);color:#fff;box-shadow:0 10px 30px rgba(124,77,255,.3)}
.dbx .present b{font-size:17px}
.dbx .present span{color:#E9E5FF}
.dbx .present .big{font-size:34px}
.dbx .footer{margin-top:10px;padding:14px 18px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);color:var(--muted);font-size:13px}
:root{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--purple:#7C4DFF;--teal:#00A3A1;--bg:#F4F2EE;--muted:#6B7280;--line:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1F2937;overflow:hidden}
body.embedded{height:760px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--navy);color:#fff;flex:none;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}
.crumb{color:#94A3B8;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#CBD5E1;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.88em;font-family:inherit}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.hbtn{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E2E8F0;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85em;font-family:inherit}
.hbtn:hover{background:rgba(255,255,255,.1)}
#bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));width:0;transition:width .35s ease;flex:none}
#slides{flex:1;display:flex;flex-direction:column;min-height:0;padding:18px 22px 10px;position:relative}
.stage{flex:1;position:relative;min-height:0;perspective:1400px}
.slide{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(27,49,57,.14);overflow:auto;padding:34px 52px 40px}
.slide.enter-r{animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-l{animation:inL .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px) rotateY(-6deg)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) rotateY(6deg)}to{opacity:1;transform:none}}
.slide .dbx{max-width:none;font-size:18px}
.slide .dbx .sec-head h2{font-size:32px}
.slide .dbx table{font-size:16px}
.slide .dbx .code pre{font-size:14.5px}
.slide .dbx>*{animation:dbxRise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
.slide.title{padding:0;overflow:hidden;background:transparent;box-shadow:0 18px 50px rgba(27,49,57,.25)}
.slide.title .dbx{height:100%;display:flex;flex-direction:column;position:relative}
.slide.title .hero{flex:1;margin:0;border-radius:20px;display:flex;align-items:center;padding:60px 70px 150px}
.slide.title .hero h1{font-size:54px}
.slide.title .sub{font-size:20px}
.slide.title .b1{width:420px;height:420px}.slide.title .b2{width:340px;height:340px}.slide.title .b3{width:300px;height:300px}
.slide.title .idea{position:absolute;left:70px;right:70px;bottom:40px;font-size:18px;background:rgba(255,255,255,.96)}
.slide.title .dbx>:not(.hero):not(.idea){display:none}
.controls{display:flex;align-items:center;gap:12px;padding-top:12px;flex:none}
.controls .nav{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:16px}
.controls .nav:hover{border-color:var(--accent);color:var(--accent)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#CBD5E1;cursor:pointer;padding:0;transition:all .25s}
.dots button.on{background:var(--accent);width:28px;border-radius:6px}
.count{color:var(--muted);font-size:.85em;min-width:60px;text-align:right}
.hint{color:#94A3B8;font-size:.78em;white-space:nowrap}
#overview{position:absolute;inset:0;background:rgba(244,242,238,.97);z-index:4;display:none;overflow:auto;padding:26px}
#overview.on{display:block;animation:dbxRise .3s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:all .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .n{font-size:.75em;color:var(--muted);font-weight:700}
.card .i{font-size:28px;margin:6px 0}
.card .t{font-weight:700;color:var(--navy)}
#doc{flex:1;display:none;min-height:0}
body.docmode #slides{display:none}
body.docmode #doc{display:flex}
#toc{width:270px;flex:none;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:#fff}
#toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;color:#334155;text-decoration:none;font-size:.9em;margin:2px 0}
#toc a:hover{background:#F1F5F9}
#toc a.on{background:#FFF1EE;color:#C62D1A;font-weight:700}
#docScroll{flex:1;overflow:auto;padding:26px 34px 80px}
.dsec{background:#fff;border-radius:18px;padding:26px 32px;margin:0 auto 18px;max-width:1000px;box-shadow:0 4px 18px rgba(27,49,57,.06);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.dsec.seen{opacity:1;transform:none}
.dsec.herosec{padding:0;background:transparent;box-shadow:none}
.dsec .dbx>*{animation:none}
.quiz{max-width:820px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.dbx .code .copy{display:inline-block;margin-left:auto;border:1px solid #30363D;background:#21262D;color:#C9D1D9;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
.dbx .code .run+.copy{margin-left:10px}
@media (max-width:760px){.slide{padding:22px}.slide.title .hero{padding:30px 30px 160px}.slide.title .hero h1{font-size:32px}.slide.title .idea{left:16px;right:16px}#toc{display:none}.crumb{display:none}.hint{display:none}}
@media print{header,.controls,#bar,#toc{display:none}body{overflow:visible}#doc{display:block}#slides{display:none}.dsec{opacity:1;transform:none;box-shadow:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FF3621"><path d="M12 2 2 7.5l10 5.5 10-5.5L12 2Zm0 13.2L4.2 11 2 12.2 12 17.7l10-5.5-2.2-1.2L12 15.2Zm0 4.6-7.8-4.3L2 16.7 12 22l10-5.3-2.2-1.2L12 19.8Z"/></svg>dbxhelp</div>
  <div class="crumb">Building Reliable Conversational Agents with Genie › Metric Views</div>
  <div class="seg"><button id="bSlides" class="on">🎞️ Slides</button><button id="bDoc">📄 Document</button></div>
  <button class="hbtn" id="bOver" title="Overview (O)">▦</button>
  <button class="hbtn" id="bFull" title="Fullscreen (F)">⛶</button>
</header>
<div id="bar"></div>
<section id="slides">
  <div class="stage" id="stage"></div>
  <div class="controls"><button class="nav" id="prev" title="Previous (←)">←</button><div class="dots" id="dots"></div><span class="hint">← → navigate · O overview · F fullscreen · D document</span><span class="count" id="count"></span><button class="nav" id="next" title="Next (→)">→</button></div>
  <div id="overview"><div class="grid" id="grid"></div></div>
</section>
<section id="doc"><nav id="toc"></nav><div id="docScroll"></div></section>
</div>
<script>
function dbxQuiz(root, questions, onDone) {
  if (typeof root === 'string') root = document.getElementById(root);
  var i = 0, score = 0, picked = null, shown = false, done = false;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code style="background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px">$1</code>'); }
  function btn(label, primary) { return '<button style="margin-top:16px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-weight:700;background:' + (primary ? 'linear-gradient(135deg,#FF3621,#7C4DFF)' : '#E5E7EB') + ';color:' + (primary ? '#fff' : '#6B7280') + ';font-size:0.95em;box-shadow:' + (primary ? '0 6px 18px rgba(124,77,255,.3)' : 'none') + '">' + label + '</button>'; }
  var box = 'padding:22px 24px;border-radius:16px;background:#fff;border:1px solid #E5E7EB;box-shadow:0 8px 28px rgba(27,49,57,.08);animation:dbxQ .4s ease both';
  var style = '<style>@keyframes dbxQ{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>';
  function bar() {
    var h = '<div style="display:flex;gap:6px;margin-bottom:14px">';
    for (var k = 0; k < questions.length; k++) h += '<div style="flex:1;height:6px;border-radius:6px;background:' + (k < i ? 'linear-gradient(90deg,#FF3621,#7C4DFF)' : k === i ? '#C4B5FD' : '#E5E7EB') + '"></div>';
    return h + '</div>';
  }
  function render() {
    if (i >= questions.length) {
      var pct = Math.round(score / questions.length * 100), msg = pct === 100 ? 'Perfect! 🎉' : pct >= 60 ? 'Nice work! 💪' : 'Worth another look 📖';
      root.innerHTML = style + '<div style="' + box + ';text-align:center"><div style="font-size:48px">' + (pct === 100 ? '🏆' : pct >= 60 ? '🌟' : '🔁') + '</div><div style="font-size:1.6em;font-weight:800;color:#1B3139">' + score + ' / ' + questions.length + '</div><div style="color:#6B7280;margin-top:4px">' + msg + '</div>' + btn('Retake', true) + '</div>';
      root.querySelector('button').onclick = function () { i = 0; score = 0; picked = null; shown = false; done = false; render(); };
      if (!done && onDone) { done = true; onDone(score, questions.length); }
      return;
    }
    var Q = questions[i], h = style + '<div style="' + box + '">' + bar();
    h += '<div style="color:#7C4DFF;font-size:0.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Question ' + (i + 1) + ' of ' + questions.length + '</div>';
    h += '<div style="font-weight:700;color:#1B3139;margin-bottom:14px;line-height:1.5;font-size:1.05em">' + esc(Q.q) + '</div>';
    Q.o.forEach(function (t, k) {
      var bg = '#fff', bd = '#E5E7EB', mark = String.fromCharCode(65 + k);
      if (shown && k === Q.c) { bg = '#ECFDF3'; bd = '#22C55E'; mark = '✓'; }
      else if (shown && k === picked) { bg = '#FFF1F0'; bd = '#EF4444'; mark = '✗'; }
      else if (!shown && k === picked) { bg = '#F5F3FF'; bd = '#7C4DFF'; }
      h += '<div data-k="' + k + '" style="display:flex;gap:12px;align-items:center;padding:11px 14px;margin:8px 0;border:2px solid ' + bd + ';background:' + bg + ';border-radius:12px;cursor:' + (shown ? 'default' : 'pointer') + ';color:#1F2937;transition:all .15s">' +
        '<span style="flex:none;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;background:' + (bd === '#E5E7EB' ? '#F1F5F9' : bd) + ';color:' + (bd === '#E5E7EB' ? '#64748B' : '#fff') + '">' + mark + '</span><span>' + esc(t) + '</span></div>';
    });
    if (shown) {
      var ok = picked === Q.c;
      h += '<div style="margin-top:14px;padding:14px 16px;border-radius:12px;background:' + (ok ? '#ECFDF3' : '#FFF7ED') + ';border:1px solid ' + (ok ? '#A7F3D0' : '#FED7AA') + ';color:#1F2937;animation:dbxQ .3s both"><strong>' + (ok ? '✅ Correct.' : '💡 Not quite.') + '</strong> ' + esc(Q.e) + '</div>' + btn(i + 1 < questions.length ? 'Next →' : 'See score', true);
    } else {
      h += btn('Submit', picked !== null);
    }
    root.innerHTML = h + '</div>';
    if (!shown) root.querySelectorAll('[data-k]').forEach(function (el) { el.onclick = function () { picked = +el.getAttribute('data-k'); render(); }; });
    root.querySelector('button').onclick = function () {
      if (!shown) { if (picked === null) return; if (picked === Q.c) score++; shown = true; }
      else { i++; picked = null; shown = false; }
      render();
    };
  }
  render();
}
var SLIDES = [{"title": "Metric Views — the semantic layer behind reliable Genie answers", "icon": "🚀", "html": "<div class=\"hero\"><div class=\"blob b1\"><\/div><div class=\"blob b2\"><\/div><div class=\"blob b3\"><\/div><div class=\"hero-in\"><div class=\"kicker\">Building Reliable Conversational Agents with Genie<\/div><h1>Metric Views — the semantic layer behind reliable Genie answers<\/h1><div class=\"chips\"><\/div><p class=\"sub\"><strong>Supplement for:<\/strong> <em>Building Reliable Conversational Agents with Genie<\/em> <strong>Goal:<\/strong> understand what a Unity Catalog metric view is, why Genie gets more reliable with it, and what's new in AI/BI Dashboards (local metric views, export to metric view).<\/p><\/div><\/div><p><strong>In one sentence:<\/strong> a metric view lets you define a business metric <em>once<\/em> (for example \"net revenue ÷ completed orders\") in Unity Catalog. Any tool, including Genie, dashboards, SQL, alerts and external BI, can then slice it by <em>any<\/em> dimension, and it always computes correctly.<\/p>"}, {"title": "Why this matters for Genie", "icon": "🧞", "html": "<div class=\"sec-head\"><span class=\"sec-num\">01<\/span><span class=\"sec-icon\">🧞<\/span><h2>Why this matters for Genie<\/h2><\/div><p>When Genie only sees raw tables, it has to <strong>guess<\/strong> your business logic each time someone asks a question:<\/p>\n<ul>\n<li><em>\"What is revenue?\"<\/em> Gross or net? Including cancelled orders? Including test orders?<\/li>\n<li><em>\"Average order value\"<\/em> means <code>SUM(revenue) / COUNT(orders)<\/code>, not <code>AVG(price)<\/code>.<\/li>\n<li><em>\"Active customers\"<\/em> is a <code>COUNT(DISTINCT …)<\/code>, which <strong>cannot be summed<\/strong> across months.<\/li>\n<\/ul>\n<p>Each guess is a chance for <strong>two users asking the same question to get two different numbers<\/strong>.<\/p>\n<p>A metric view moves that logic out of the LLM and into a <strong>governed, versioned definition<\/strong>:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Without metric view<\/th>\n<th>With metric view<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Genie writes the aggregation SQL itself<\/td>\n<td>Genie picks a measure: <code>MEASURE(net_revenue)<\/code><\/td>\n<\/tr>\n<tr>\n<td>Business rules live in instructions / examples<\/td>\n<td>Business rules live in Unity Catalog (one place)<\/td>\n<\/tr>\n<tr>\n<td>Same KPI can differ between Genie, dashboards and Excel<\/td>\n<td>Same definition everywhere<\/td>\n<\/tr>\n<tr>\n<td>Hard to review<\/td>\n<td>Reviewable YAML, permissions, lineage<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "What is a metric view?", "icon": "📏", "html": "<div class=\"sec-head\"><span class=\"sec-num\">02<\/span><span class=\"sec-icon\">📏<\/span><h2>What is a metric view?<\/h2><\/div><p>A <strong>metric view<\/strong> is a Unity Catalog object, defined in YAML, that separates:<\/p>\n<ul>\n<li><strong>Source:<\/strong> a table, view, SQL query, or another metric view (optionally with <strong>joins<\/strong> in a star or snowflake schema)<\/li>\n<li><strong>Filter:<\/strong> a condition applied to <em>every<\/em> query (e.g. <code>status &lt;&gt; 'TEST'<\/code>)<\/li>\n<li><strong>Fields (dimensions):<\/strong> the attributes you group and filter by (<code>region<\/code>, <code>order_month<\/code>, …)<\/li>\n<li><strong>Measures:<\/strong> aggregate expressions (<code>SUM(...)<\/code>, <code>COUNT(DISTINCT ...)<\/code>, ratios, window measures)<\/li>\n<\/ul>\n<p>The key difference from a normal view:<\/p>\n<ul>\n<li>A <strong>standard view<\/strong> fixes the aggregation <em>and<\/em> the grouping when you create it.<\/li>\n<li>A <strong>metric view<\/strong> fixes only the <strong>definition<\/strong> of the measure. The <strong>grouping is chosen at query time<\/strong>, and the engine generates the correct SQL for that grain.<\/li>\n<\/ul>\n<blockquote class=\"callout\">\n<p>Metric views are the core of the <strong>Unity Catalog semantics layer<\/strong> (docs: <em>UC Semantics → Metric views<\/em>).<\/p>\n<\/blockquote>"}, {"title": "The classic trap: average of averages", "icon": "⚠️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">03<\/span><span class=\"sec-icon\">⚠️<\/span><h2>The classic trap: average of averages<\/h2><\/div><p>Imagine a standard view pre-aggregated per <strong>category × month<\/strong>:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">VIEW<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">v_sales_by_category_month<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span>\n<span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">product_category,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_month,<\/span>\n<span style=\"color: #6E7681\">       <\/span><span style=\"color: #FF7B72\">SUM<\/span><span style=\"color: #E6EDF3\">(net_revenue)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">/<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">COUNT<\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #FF7B72; font-weight: bold\">*<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">avg_order_value,<\/span>\n<span style=\"color: #6E7681\">       <\/span><span style=\"color: #FF7B72\">COUNT<\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #FF7B72\">DISTINCT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">customer_id)<\/span><span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">unique_customers<\/span>\n<span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">orders<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">GROUP<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">BY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ALL<\/span><span style=\"color: #E6EDF3\">;<\/span><\/pre><\/div>\n<p>Now someone (or Genie) asks <em>\"What was the average order value and number of customers in 2025?\"<\/em><\/p>\n<ul>\n<li><code>AVG(avg_order_value)<\/code> → <strong>wrong<\/strong> (averages of averages ignore the order volume behind each value)<\/li>\n<li><code>SUM(unique_customers)<\/code> → <strong>wrong<\/strong> (the same customer is counted in many months and categories)<\/li>\n<\/ul>\n<p>With a metric view, <code>MEASURE(avg_order_value)<\/code> and <code>MEASURE(unique_customers)<\/code> are <strong>re-computed from the detail rows at whatever grain you ask for<\/strong>: year, category, region, or nothing at all.<\/p>\n<blockquote class=\"callout\">\n<p>The hands-on demo notebook reproduces this with real numbers.<\/p>\n<\/blockquote>"}, {"title": "Anatomy of a metric view (YAML)", "icon": "📏", "html": "<div class=\"sec-head\"><span class=\"sec-num\">04<\/span><span class=\"sec-icon\">📏<\/span><h2>Anatomy of a metric view (YAML)<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #7EE787\">version<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">1.1<\/span>\n<span style=\"color: #7EE787\">comment<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">Sales KPIs for the retail demo<\/span>\n<span style=\"color: #7EE787\">source<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">main.retail.fact_orders<\/span>\n<span style=\"color: #7EE787\">filter<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">source.status &lt;&gt; 'TEST'<\/span><span style=\"color: #6E7681\">          <\/span><span style=\"color: #8B949E; font-style: italic\"># applied to every query<\/span>\n\n<span style=\"color: #7EE787\">joins<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\">                                    <\/span><span style=\"color: #8B949E; font-style: italic\"># star schema, LEFT OUTER, many-to-one by default<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">customer<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">source<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">main.retail.dim_customer<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #A5D6FF\">'on'<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">source.customer_id = customer.customer_id<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">product<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">source<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">main.retail.dim_product<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #A5D6FF\">'on'<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">source.product_id = product.product_id<\/span>\n\n<span style=\"color: #7EE787\">fields<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\">                                   <\/span><span style=\"color: #8B949E; font-style: italic\"># a.k.a. dimensions<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">order_month<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">DATE_TRUNC('MONTH', source.order_date)<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">region<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">customer.region<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">synonyms<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">[<\/span><span style=\"color: #A5D6FF\">'market'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'territory'<\/span><span style=\"color: #E6EDF3\">]<\/span>\n\n<span style=\"color: #7EE787\">measures<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">completed_orders<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">COUNT(1) FILTER (WHERE source.status = 'COMPLETED')<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">net_revenue<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">SUM(source.quantity * product.unit_price * (1 - source.discount)) FILTER (WHERE source.status = 'COMPLETED')<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">format<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">{<\/span><span style=\"color: #7EE787\">type<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #79C0FF\">currency<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #7EE787\"> currency_code<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #79C0FF\">USD<\/span><span style=\"color: #E6EDF3\">}<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">avg_order_value<\/span><span style=\"color: #6E7681\">                 <\/span><span style=\"color: #8B949E; font-style: italic\"># composed from other measures<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">MEASURE(net_revenue) / MEASURE(completed_orders)<\/span><\/pre><\/div>\n<p>Tips:<\/p>\n<ul>\n<li>Quote the <code>'on'<\/code> key, because plain YAML can parse <code>on<\/code> as a boolean.<\/li>\n<li><code>fields<\/code> and <code>dimensions<\/code> are synonyms (the UI editor writes <code>dimensions<\/code>).<\/li>\n<li>Measures may reference earlier fields and measures, and use <code>MEASURE()<\/code> to reference a measure.<\/li>\n<\/ul>"}, {"title": "Creating a metric view", "icon": "📏", "html": "<div class=\"sec-head\"><span class=\"sec-num\">05<\/span><span class=\"sec-icon\">📏<\/span><h2>Creating a metric view<\/h2><\/div><p>Three ways to create one:<\/p>\n<ol>\n<li><strong>SQL DDL<\/strong>: <code>CREATE OR REPLACE VIEW … WITH METRICS LANGUAGE YAML AS $$ … $$<\/code><\/li>\n<li><strong>Catalog Explorer UI<\/strong>: open a table → <strong>Create → Metric view<\/strong>. The visual editor offers joins, filters, fields, measures, <em>Preview<\/em>, and a <code>&lt;&gt;<\/code> YAML tab.<\/li>\n<li><strong>Genie Code<\/strong>: describe the metric view in natural language, or import Tableau / Power BI definitions.<\/li>\n<\/ol>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">OR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">REPLACE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">VIEW<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">sales_metrics<\/span>\n<span style=\"color: #FF7B72\">WITH<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">METRICS<\/span>\n<span style=\"color: #FF7B72\">LANGUAGE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">YAML<\/span>\n<span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #F85149\">$$<\/span>\n<span style=\"color: #FF7B72\">version<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">1<\/span><span style=\"color: #E6EDF3\">.<\/span><span style=\"color: #A5D6FF\">1<\/span>\n<span style=\"color: #FF7B72\">source<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">main.retail.fact_orders<\/span>\n<span style=\"color: #E6EDF3\">fields:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72; font-weight: bold\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">name:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_month<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #E6EDF3\">expr:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">DATE_TRUNC(<\/span><span style=\"color: #A5D6FF\">'MONTH'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_date)<\/span>\n<span style=\"color: #E6EDF3\">measures:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72; font-weight: bold\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">name:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_count<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #E6EDF3\">expr:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">COUNT<\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">1<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #F85149\">$$<\/span><span style=\"color: #E6EDF3\">;<\/span><\/pre><\/div>\n<p><strong>Privileges needed:<\/strong> <code>SELECT<\/code> on the sources, <code>USE CATALOG<\/code>, plus <code>USE SCHEMA<\/code> and <code>CREATE TABLE<\/code> on the target schema, and access to a SQL warehouse or compute on a supported runtime.<\/p>"}, {"title": "Querying with MEASURE()", "icon": "📏", "html": "<div class=\"sec-head\"><span class=\"sec-num\">06<\/span><span class=\"sec-icon\">📏<\/span><h2>Querying with MEASURE()<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">region,<\/span>\n<span style=\"color: #6E7681\">       <\/span><span style=\"color: #E6EDF3\">order_month,<\/span>\n<span style=\"color: #6E7681\">       <\/span><span style=\"color: #E6EDF3\">MEASURE(net_revenue)<\/span><span style=\"color: #6E7681\">      <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">net_revenue,<\/span>\n<span style=\"color: #6E7681\">       <\/span><span style=\"color: #E6EDF3\">MEASURE(avg_order_value)<\/span><span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">aov<\/span>\n<span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">sales_metrics<\/span>\n<span style=\"color: #FF7B72\">WHERE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">product_category<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'Electronics'<\/span>\n<span style=\"color: #FF7B72\">GROUP<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">BY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ALL<\/span>\n<span style=\"color: #FF7B72\">ORDER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">BY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_month;<\/span><\/pre><\/div>\n<p>Rules to remember:<\/p>\n<ul>\n<li>Every measure <strong>must<\/strong> be wrapped in <code>MEASURE()<\/code> (on DBR 18.1+, <code>agg()<\/code> works as well).<\/li>\n<li><strong>No <code>SELECT *<\/code><\/strong>: list fields explicitly.<\/li>\n<li><strong>No direct joins<\/strong> with other tables. Aggregate in a CTE first, then join the CTE.<\/li>\n<li><code>DESCRIBE TABLE EXTENDED sales_metrics AS JSON<\/code> shows the full YAML (<em>View Text<\/em>) and per-column metadata.<\/li>\n<li>In AI/BI dashboards, <code>MEASURE()<\/code> is applied automatically.<\/li>\n<\/ul>"}, {"title": "Agent metadata: teach Genie your vocabulary", "icon": "🏷️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">07<\/span><span class=\"sec-icon\">🏷️<\/span><h2>Agent metadata: teach Genie your vocabulary<\/h2><\/div><p>YAML spec <strong>1.1<\/strong> (DBR 17.3+) adds metadata that downstream tools understand:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Property<\/th>\n<th>What it does<\/th>\n<th>Who uses it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>comment<\/code><\/td>\n<td>Business description of the view / field / measure<\/td>\n<td>Genie, Catalog, BI tools<\/td>\n<\/tr>\n<tr>\n<td><code>display_name<\/code><\/td>\n<td>Human-friendly label (≤ 255 chars)<\/td>\n<td>Dashboards, BI tools<\/td>\n<\/tr>\n<tr>\n<td><code>synonyms<\/code><\/td>\n<td>Up to 10 alternative names<\/td>\n<td><strong>Genie imports them automatically<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>format<\/code><\/td>\n<td><code>number<\/code>, <code>currency<\/code>, <code>percentage<\/code>, <code>byte<\/code>, <code>date<\/code>, <code>date_time<\/code><\/td>\n<td>Dashboards (auto-applied)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #7EE787\">measures<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">net_revenue<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">SUM(source.amount)<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">comment<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">Revenue after discounts, completed orders only<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">display_name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">Net Revenue<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">synonyms<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">[<\/span><span style=\"color: #A5D6FF\">'revenue'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'sales'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'turnover'<\/span><span style=\"color: #E6EDF3\">]<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">format<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">type<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">currency<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">currency_code<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">EUR<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">decimal_places<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">{<\/span><span style=\"color: #7EE787\">type<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #79C0FF\">exact<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #7EE787\"> places<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #79C0FF\">2<\/span><span style=\"color: #E6EDF3\">}<\/span><\/pre><\/div>\n<blockquote class=\"callout\">\n<p>YAML <code>#<\/code> comments are removed when the definition is saved. Use <code>comment:<\/code> for anything you want to keep.<\/p>\n<\/blockquote>"}, {"title": "Composability and window measures", "icon": "📏", "html": "<div class=\"sec-head\"><span class=\"sec-num\">08<\/span><span class=\"sec-icon\">📏<\/span><h2>Composability and window measures<\/h2><\/div><p><strong>Composability:<\/strong> build measures on measures:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">revenue_per_customer<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">MEASURE(net_revenue) / MEASURE(unique_customers)<\/span><\/pre><\/div>\n<p><strong>Window measures<\/strong> cover trailing, cumulative, and period-over-period values:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">revenue_trailing_7d<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">expr<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">SUM(source.amount)<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">window<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">order<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">order_date<\/span><span style=\"color: #6E7681\">        <\/span><span style=\"color: #8B949E; font-style: italic\"># a field of the metric view<\/span>\n<span style=\"color: #6E7681\">        <\/span><span style=\"color: #7EE787\">range<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">trailing 7 day<\/span><span style=\"color: #6E7681\">    <\/span><span style=\"color: #8B949E; font-style: italic\"># current | cumulative | trailing n unit | leading n unit | all<\/span>\n<span style=\"color: #6E7681\">        <\/span><span style=\"color: #7EE787\">semiadditive<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">last<\/span><\/pre><\/div>\n<ul>\n<li><code>trailing<\/code> / <code>leading<\/code> are <strong>exclusive<\/strong> of the current row by default. <code>inclusive<\/code> needs DBR 18.1+ and spec 1.1.<\/li>\n<li><code>offset: -12 month<\/code> gives \"same period last year\" (DBR 18.1+, spec 1.1).<\/li>\n<\/ul>"}, {"title": "Advanced features (good to know)", "icon": "🚀", "html": "<div class=\"sec-head\"><span class=\"sec-num\">09<\/span><span class=\"sec-icon\">🚀<\/span><h2>Advanced features (good to know)<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>What<\/th>\n<th>Min. runtime<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Snowflake joins<\/strong><\/td>\n<td>Nested <code>joins<\/code> (e.g. <code>customer.nation.n_name<\/code>)<\/td>\n<td>DBR 17.3<\/td>\n<\/tr>\n<tr>\n<td><strong>Materialization<\/strong><\/td>\n<td>Pre-computed aggregates with automatic query rewrite, <code>schedule: every 6 hours<\/code><\/td>\n<td>DBR 17.3<\/td>\n<\/tr>\n<tr>\n<td><strong>Parameters<\/strong><\/td>\n<td><code>sales_metrics(discount =&gt; 0.2)<\/code>, queried as a table-valued function<\/td>\n<td>DBR 18.2<\/td>\n<\/tr>\n<tr>\n<td><strong>Wildcards<\/strong><\/td>\n<td><code>- expr: source.* EXCEPT (comment)<\/code><\/td>\n<td>DBR 18.2<\/td>\n<\/tr>\n<tr>\n<td><strong>One-to-many joins<\/strong><\/td>\n<td><code>cardinality: one_to_many<\/code><\/td>\n<td>DBR 18.1<\/td>\n<\/tr>\n<tr>\n<td><strong>Relationships<\/strong> (Beta)<\/td>\n<td>Declare how metric views relate, so agents pick the right join path<\/td>\n<td>DBR 19<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>SQL warehouses and serverless compute update automatically, so they normally have the newest features.<\/p>"}, {"title": "What's new: metric views in AI/BI Dashboards", "icon": "📊", "html": "<div class=\"sec-head\"><span class=\"sec-num\">10<\/span><span class=\"sec-icon\">📊<\/span><h2>What's new: metric views in AI/BI Dashboards<\/h2><\/div><p>There are three ways to use metric views in a dashboard (<strong>Data<\/strong> tab → <strong>Add data<\/strong>):<\/p>\n<ol>\n<li><strong>Unity Catalog metric view as a dataset.<\/strong> You get every dimension and measure. You <strong>can't<\/strong> change the dataset query (no filters or column pruning), but you <strong>can<\/strong> add custom calculations.<\/li>\n<li><strong>SQL dataset that references a metric view.<\/strong> Use this when you need filters or reshaping. Measures go through <code>MEASURE()<\/code>. Parameters can be passed, e.g. <code>sales_metrics(discount =&gt; :discount)<\/code> linked to a filter widget.<\/li>\n<li><strong>Local metric view (dashboard metric view).<\/strong> Define dimensions, measures and joins <strong>scoped to the dashboard<\/strong>, without publishing anything to Unity Catalog. Picking a table or view as the source opens the local metric view editor.<\/li>\n<\/ol>\n<p><strong>Export as a metric view (Public Preview):<\/strong> dataset kebab menu → <em>Create Metric View<\/em> → pick catalog and schema → optionally edit the YAML → <strong>Save<\/strong>. Measures and dimensions defined on the dataset are carried over. This <strong>promotes<\/strong> a dashboard-only definition into a governed UC metric view that Genie can use as well.<\/p>"}, {"title": "UC metric view vs local metric view vs custom calculation", "icon": "📏", "html": "<div class=\"sec-head\"><span class=\"sec-num\">11<\/span><span class=\"sec-icon\">📏<\/span><h2>UC metric view vs local metric view vs custom calculation<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>UC metric view<\/strong><\/th>\n<th><strong>Dashboard local metric view<\/strong><\/th>\n<th><strong>Custom calculation<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lives in<\/td>\n<td>Unity Catalog<\/td>\n<td>One dashboard<\/td>\n<td>One dashboard dataset<\/td>\n<\/tr>\n<tr>\n<td>Reusable by Genie, SQL, BI, alerts<\/td>\n<td>✅<\/td>\n<td>❌ (until exported)<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>Governed (permissions, lineage, tags)<\/td>\n<td>✅<\/td>\n<td>Dashboard permissions<\/td>\n<td>Dashboard permissions<\/td>\n<\/tr>\n<tr>\n<td>Who creates it<\/td>\n<td>Data / analytics engineers<\/td>\n<td>Dashboard author<\/td>\n<td>Dashboard author<\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>Company-wide KPIs<\/td>\n<td>Prototyping, dashboard-specific logic<\/td>\n<td>Quick one-off metric or LOD expression<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Typical lifecycle:<\/strong> prototype as a <em>local metric view<\/em> → validate with stakeholders → <strong>Export as metric view<\/strong> → add to a <strong>Genie Agent<\/strong>.<\/p>"}, {"title": "Metric views + Genie Agents", "icon": "🧞", "html": "<div class=\"sec-head\"><span class=\"sec-num\">12<\/span><span class=\"sec-icon\">🧞<\/span><h2>Metric views + Genie Agents<\/h2><\/div><blockquote class=\"callout\">\n<p><strong>Naming:<\/strong> <em>Genie Agents were formerly known as Genie Spaces.<\/em> The course may still say \"Genie space\".<\/p>\n<\/blockquote>\n<ul>\n<li>Add a metric view to a Genie Agent exactly like a table: <strong>up to 50 tables, views or metric views<\/strong> per agent.<\/li>\n<li>The Genie Agent needs a <strong>pro or serverless SQL warehouse<\/strong>.<\/li>\n<li>Genie generates <code>MEASURE(...)<\/code> queries, and <strong>synonyms are imported automatically<\/strong>.<\/li>\n<li>The reverse direction exists too: a <strong>Genie Agent's context can be exported as a metric view<\/strong> (kebab menu → <em>Export to metric view<\/em>). This turns tuned instructions and SQL expressions into a governed definition.<\/li>\n<\/ul>\n<p><strong>Recommended pattern for reliable agents:<\/strong><\/p>\n<ol>\n<li>Model the KPIs in a metric view (comments, synonyms, formats).<\/li>\n<li>Give the Genie Agent the <strong>metric view<\/strong> (and only the raw tables it really needs).<\/li>\n<li>Keep instructions short, focused on <em>business context<\/em>, not on SQL formulas.<\/li>\n<li>Add <strong>benchmarks<\/strong> with questions whose expected SQL uses <code>MEASURE()<\/code>.<\/li>\n<\/ol>"}, {"title": "Requirements and limitations", "icon": "📋", "html": "<div class=\"sec-head\"><span class=\"sec-num\">13<\/span><span class=\"sec-icon\">📋<\/span><h2>Requirements and limitations<\/h2><\/div><ul>\n<li><strong>Unity Catalog<\/strong> is required. Metric views were introduced in <strong>DBR 16.4<\/strong>. Agent metadata (spec 1.1) needs <strong>DBR 17.3+<\/strong>.<\/li>\n<li>Works on <strong>SQL warehouses<\/strong> and <strong>serverless compute<\/strong>, which always run a recent version.<\/li>\n<li>Querying: <code>MEASURE()<\/code> is mandatory, <code>SELECT *<\/code> is not allowed, and direct joins are not allowed (use a CTE).<\/li>\n<li>Joined tables can't contain <code>MAP<\/code> columns.<\/li>\n<li>Star joins are <code>LEFT OUTER<\/code>. With <code>many_to_one<\/code>, a many-to-many match uses the <strong>first<\/strong> matching row, so model your keys carefully.<\/li>\n<li><code>rely.at_most_one_match: true<\/code> is an optimization that is <strong>not validated<\/strong>. A wrong value causes wrong <code>SUM<\/code>/<code>COUNT<\/code>.<\/li>\n<li>Materialization can't be combined with parameters.<\/li>\n<\/ul>"}, {"title": "Best practices", "icon": "🏆", "html": "<div class=\"sec-head\"><span class=\"sec-num\">14<\/span><span class=\"sec-icon\">🏆<\/span><h2>Best practices<\/h2><\/div><ul>\n<li><strong>Name for humans and LLMs:<\/strong> <code>net_revenue<\/code>, not <code>m_rev_2<\/code>, plus <code>display_name<\/code> and <code>synonyms<\/code>.<\/li>\n<li><strong>Put business rules in the definition:<\/strong> global <code>filter<\/code> for exclusions (test data), <code>FILTER (WHERE …)<\/code> for measure-level rules.<\/li>\n<li><strong>Prefer ratio measures composed from base measures.<\/strong> Never pre-aggregate ratios.<\/li>\n<li><strong>Declare PK/FK constraints with <code>RELY<\/code><\/strong> on source tables. Genie and the optimizer both benefit.<\/li>\n<li><strong>Comment everything:<\/strong> comments are the cheapest accuracy boost for Genie.<\/li>\n<li><strong>One metric view per business process<\/strong> (sales, support tickets, inventory), not one giant view.<\/li>\n<li><strong>Version control:<\/strong> keep the YAML in Git and deploy with SQL / Databricks Asset Bundles.<\/li>\n<\/ul>"}, {"title": "Trainer notes: questions learners ask", "icon": "🎓", "html": "<div class=\"sec-head\"><span class=\"sec-num\">15<\/span><span class=\"sec-icon\">🎓<\/span><h2>Trainer notes: questions learners ask<\/h2><\/div><ul>\n<li><strong>\"Isn't this just a view?\"<\/strong> No. A view fixes the GROUP BY, while a metric view lets the query decide it and still computes non-additive measures correctly.<\/li>\n<li><strong>\"Do I still need Genie instructions?\"<\/strong> Yes, but fewer. Use them for business context and terminology, and put formulas in the metric view.<\/li>\n<li><strong>\"Can Power BI or Tableau use it?\"<\/strong> Yes: Tableau and Sigma through custom SQL or BI compatibility mode, Power BI through semantic models (Private Preview) or custom SQL. Excel and Google Sheets are supported too.<\/li>\n<li><strong>\"Performance?\"<\/strong> Materialization can pre-compute aggregations, and queries are rewritten automatically.<\/li>\n<li><strong>\"Local vs UC metric view?\"<\/strong> Local is a dashboard-only sandbox. UC is the governed, shared definition.<\/li>\n<\/ul>"}, {"title": "Further reading", "icon": "📚", "html": "<div class=\"sec-head\"><span class=\"sec-num\">16<\/span><span class=\"sec-icon\">📚<\/span><h2>Further reading<\/h2><\/div><ul>\n<li>Metric views overview: <a target=\"_blank\" href=\"https://docs.databricks.com/aws/en/metric-views/\">https://docs.databricks.com/aws/en/metric-views/<\/a><\/li>\n<li>YAML reference: <a target=\"_blank\" href=\"https://docs.databricks.com/aws/en/uc-semantics/metric-views/yaml-reference\">https://docs.databricks.com/aws/en/uc-semantics/metric-views/yaml-reference<\/a><\/li>\n<li>Query metric views: <a target=\"_blank\" href=\"https://docs.databricks.com/aws/en/uc-semantics/metric-views/query\">https://docs.databricks.com/aws/en/uc-semantics/metric-views/query<\/a><\/li>\n<li>Agent metadata: <a target=\"_blank\" href=\"https://docs.databricks.com/aws/en/uc-semantics/agent-metadata\">https://docs.databricks.com/aws/en/uc-semantics/agent-metadata<\/a><\/li>\n<li>Feature availability: <a target=\"_blank\" href=\"https://docs.databricks.com/aws/en/uc-semantics/metric-views/feature-availability\">https://docs.databricks.com/aws/en/uc-semantics/metric-views/feature-availability<\/a><\/li>\n<li>Dashboard datasets (local metric views, export): <a target=\"_blank\" href=\"https://docs.databricks.com/aws/en/dashboards/manage/data-modeling/datasets\">https://docs.databricks.com/aws/en/dashboards/manage/data-modeling/datasets<\/a><\/li>\n<li>Genie Agents setup: <a target=\"_blank\" href=\"https://docs.databricks.com/aws/en/genie-agents/set-up\">https://docs.databricks.com/aws/en/genie-agents/set-up<\/a><\/li>\n<\/ul>"}];
var QUIZ = [{"q": "What is the main difference between a standard view and a metric view?", "o": ["A metric view is always materialized", "A metric view fixes the measure definition, while the grouping is chosen at query time", "A metric view can only be queried from dashboards", "A metric view does not support joins"], "c": 1, "e": "A standard view fixes both aggregation and GROUP BY. A metric view stores only the definitions, and the engine computes the measure correctly at whatever grain the query asks for."}, {"q": "A view stores unique_customers per month. Why is SUM(unique_customers) over a year wrong?", "o": ["SUM is not allowed on views", "Distinct counts are not additive: the same customer is counted in many months", "Because of NULL values", "It is correct"], "c": 1, "e": "COUNT(DISTINCT) is non-additive. A metric view recomputes it from detail rows for the requested grain."}, {"q": "Which query against a metric view is valid?", "o": ["`SELECT * FROM sales_metrics`", "`SELECT region, SUM(net_revenue) FROM sales_metrics GROUP BY region`", "`SELECT region, MEASURE(net_revenue) FROM sales_metrics GROUP BY region`", "`SELECT m.*, c.name FROM sales_metrics m JOIN customers c ON ...`"], "c": 2, "e": "Measures must be wrapped in MEASURE(). SELECT * and direct joins are not allowed (use a CTE for joins)."}, {"q": "Which agent metadata property does Genie import automatically to match user wording to fields and measures?", "o": ["format", "synonyms", "display_name", "materialization"], "c": 1, "e": "Synonyms (up to 10 per field or measure) are imported by Genie automatically. Formats and display names are mainly used by dashboards and BI tools."}, {"q": "You prototyped KPIs as a local metric view in an AI/BI dashboard. How do you make them available to a Genie Agent?", "o": ["Copy the dashboard", "Use 'Export as a metric view' to create a Unity Catalog metric view", "Genie can read local metric views directly", "It is not possible"], "c": 1, "e": "Local metric views are scoped to one dashboard. Exporting creates a governed UC metric view that Genie, SQL and BI tools can use."}];
(function () {
  if (window.self !== window.top) document.body.classList.add('embedded');
  if (QUIZ && QUIZ.length) SLIDES.push({ title: 'Check yourself', icon: '🎯', quiz: true,
    html: '<div class="sec-head"><span class="sec-num">' + String(SLIDES.length).padStart(2, '0') + '</span><span class="sec-icon">🎯</span><h2>Check yourself</h2></div><div class="quiz"></div>' });
  var idx = 0, stage = document.getElementById('stage'), dots = document.getElementById('dots');
  var $ = function (id) { return document.getElementById(id); };

  function wireCopy(root) {
    root.querySelectorAll('.code').forEach(function (c) {
      var b = c.querySelector('.copy'); if (!b) return;
      b.onclick = function () {
        var t = c.querySelector('pre').innerText;
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'copied ✓'; setTimeout(function () { b.textContent = 'copy'; }, 1400); }, function () {});
      };
    });
  }
  function confetti() {
    var e = ['🎉', '✨', '🎊', '⭐', '🧡', '💜'];
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('div'); s.className = 'confetti'; s.textContent = e[i % e.length];
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .8 + 's'; document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 3600);
    }
  }
  function mountQuiz(el) { dbxQuiz(el, QUIZ, function (score, total) { if (score === total) confetti(); }); }

  SLIDES.forEach(function (s, i) {
    var d = document.createElement('button'); d.title = (i + 1) + '. ' + s.title; d.onclick = function () { go(i); }; dots.appendChild(d);
    var c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<div class="n">' + String(i + 1).padStart(2, '0') + '</div><div class="i">' + s.icon + '</div><div class="t">' + s.title + '</div>';
    c.onclick = function () { overview(false); go(i); }; $('grid').appendChild(c);
  });
  function go(n, dir) {
    var prev = idx; idx = Math.max(0, Math.min(SLIDES.length - 1, n));
    var s = SLIDES[idx], el = document.createElement('div');
    el.className = 'slide ' + (idx === 0 ? 'title ' : '') + ((dir || (idx >= prev ? 1 : -1)) > 0 ? 'enter-r' : 'enter-l');
    el.innerHTML = '<div class="dbx">' + s.html + '</div>';
    Array.prototype.forEach.call(el.firstChild.children, function (ch, k) { ch.style.setProperty('--i', k); });
    stage.innerHTML = ''; stage.appendChild(el); wireCopy(el);
    if (s.quiz) mountQuiz(el.querySelector('.quiz'));
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === idx); });
    $('count').textContent = (idx + 1) + ' / ' + SLIDES.length;
    $('bar').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
    try { history.replaceState(null, '', '#slide-' + (idx + 1)); } catch (e) {}
  }
  function overview(on) { var o = $('overview'); o.classList.toggle('on', on === undefined ? !o.classList.contains('on') : on); }
  $('prev').onclick = function () { go(idx - 1, -1); };
  $('next').onclick = function () { go(idx + 1, 1); };
  $('bOver').onclick = function () { mode('slides'); overview(); };
  $('bFull').onclick = function () {
    var r = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (r.requestFullscreen) r.requestFullscreen().catch(function () {});
  };
  var tx = null;
  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) { if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1)); tx = null; });

  var docBuilt = false;
  function buildDoc() {
    if (docBuilt) return; docBuilt = true;
    var toc = $('toc'), sc = $('docScroll');
    SLIDES.forEach(function (s, i) {
      var sec = document.createElement('div'); sec.className = 'dsec' + (i === 0 ? ' herosec' : ''); sec.id = 'sec-' + i;
      sec.innerHTML = '<div class="dbx">' + s.html + '</div>'; sc.appendChild(sec); wireCopy(sec);
      if (s.quiz) mountQuiz(sec.querySelector('.quiz'));
      var a = document.createElement('a'); a.href = '#sec-' + i; a.innerHTML = '<span>' + s.icon + '</span><span>' + (i === 0 ? 'Overview' : s.title) + '</span>';
      a.onclick = function (e) { e.preventDefault(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; toc.appendChild(a);
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) en.target.classList.add('seen'); }); }, { root: sc, threshold: .05 });
      sc.querySelectorAll('.dsec').forEach(function (s) { io.observe(s); });
    } else sc.querySelectorAll('.dsec').forEach(function (s) { s.classList.add('seen'); });
    sc.addEventListener('scroll', function () {
      var cur = 0;
      sc.querySelectorAll('.dsec').forEach(function (s, i) { if (s.offsetTop - sc.scrollTop < 140) cur = i; });
      toc.querySelectorAll('a').forEach(function (a, i) { a.classList.toggle('on', i === cur); });
      $('bar').style.width = (sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight) * 100) + '%';
    });
  }
  function mode(m) {
    var doc = m === 'doc'; document.body.classList.toggle('docmode', doc);
    $('bDoc').classList.toggle('on', doc); $('bSlides').classList.toggle('on', !doc);
    if (doc) { buildDoc(); $('docScroll').dispatchEvent(new Event('scroll')); } else go(idx, 1);
  }
  $('bDoc').onclick = function () { mode('doc'); };
  $('bSlides').onclick = function () { mode('slides'); };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key, doc = document.body.classList.contains('docmode');
    if (k === 'd' || k === 'D') return mode('doc');
    if (k === 'p' || k === 'P') return mode('slides');
    if (doc) return;
    if (k === 'o' || k === 'O') return overview();
    if (k === 'Escape') return overview(false);
    if (k === 'f' || k === 'F') return $('bFull').click();
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(idx + 1, 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(idx - 1, -1); }
    else if (k === 'Home') go(0, -1); else if (k === 'End') go(SLIDES.length - 1, 1);
  });
  var m = location.hash.match(/^#slide-(\d+)/); if (m) idx = parseInt(m[1], 10) - 1;
  if (location.hash === '#doc') mode('doc'); else go(idx, 1);
})();
</script>
