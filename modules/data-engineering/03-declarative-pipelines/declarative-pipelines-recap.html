<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap 3: Build Data Pipelines with Lakeflow Spark Declarative Pipelines · dbxhelp</title>
<style>
.dbx{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--teal:#00A3A1;--purple:#7C4DFF;--amber:#FFAB00;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.6;max-width:1100px}
.dbx *{box-sizing:border-box}
.dbx>*{animation:dbxRise .55s cubic-bezier(.2,.7,.2,1) both}
.dbx>*:nth-child(2){animation-delay:.06s}.dbx>*:nth-child(3){animation-delay:.12s}.dbx>*:nth-child(4){animation-delay:.18s}.dbx>*:nth-child(5){animation-delay:.24s}.dbx>*:nth-child(6){animation-delay:.3s}.dbx>*:nth-child(n+7){animation-delay:.36s}
@keyframes dbxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dbxGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes dbxFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@keyframes dbxLine{from{width:0}to{width:100%}}
@keyframes dbxPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,54,33,.25)}50%{box-shadow:0 0 0 8px rgba(255,54,33,0)}}
.dbx .hero{position:relative;overflow:hidden;border-radius:18px;padding:38px 40px 34px;margin:4px 0 18px;color:#fff;background:linear-gradient(120deg,#1B3139,#22425a,#2a2f6b,#1B3139);background-size:300% 300%;animation:dbxGrad 14s ease infinite,dbxRise .6s both}
.dbx .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:dbxFloat 9s ease-in-out infinite}
.dbx .b1{width:220px;height:220px;background:#FF3621;right:-40px;top:-60px}
.dbx .b2{width:180px;height:180px;background:#7C4DFF;right:160px;bottom:-90px;animation-delay:-3s}
.dbx .b3{width:140px;height:140px;background:#00A3A1;left:-40px;bottom:-50px;animation-delay:-6s}
.dbx .hero-in{position:relative}
.dbx .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#FFC4BA;font-weight:700}
.dbx .hero h1{font-size:34px;line-height:1.15;margin:8px 0 14px;color:#fff;font-weight:800}
.dbx .kicker-inline{display:inline-block;font-size:.5em;vertical-align:middle;background:var(--accent);padding:4px 10px;border-radius:999px;margin-right:10px;letter-spacing:.08em;text-transform:uppercase}
.dbx .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dbx .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px;color:#fff}
.dbx .chip strong{color:#fff}
.dbx .sub{color:#E2E8F0;font-size:16px;margin:0;max-width:820px}
.dbx .sub strong,.dbx .sub b{color:#FFD7CF}
.dbx .sub code{background:rgba(255,255,255,.16);color:#fff}
.dbx .idea{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFF4F1,#FFF);border:1px solid #FFD0C7;border-left:5px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;animation:dbxRise .55s both,dbxPulse 3s ease-in-out 1s 2}
.dbx .idea-icon{font-size:26px;line-height:1}
.dbx .idea b{color:#C62D1A}
.dbx .sec-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;position:relative;padding-bottom:10px}
.dbx .sec-head:after{content:"";position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));animation:dbxLine .9s ease-out both}
.dbx .sec-num{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7a59);padding:5px 10px;border-radius:9px;letter-spacing:.05em}
.dbx .sec-icon{font-size:26px;line-height:1}
.dbx .sec-head h2{margin:0;font-size:25px;color:var(--navy);font-weight:800;border:0}
.dbx h3{color:var(--navy);margin:18px 0 8px}
.dbx p{margin:8px 0}
.dbx a{color:var(--blue)}
.dbx code{background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(27,49,57,.06);margin:12px 0;background:#fff}
.dbx table{border-collapse:collapse;width:100%;font-size:14px}
.dbx th{background:linear-gradient(135deg,#1B3139,#2B4F63);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
.dbx td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.dbx tr:nth-child(even) td{background:#F8FAFC}
.dbx tr:hover td{background:#FFF4F1}
.dbx td:first-child{font-weight:600;color:var(--navy)}
.dbx ul,.dbx ol{padding-left:22px;margin:8px 0}
.dbx li{margin:5px 0}
.dbx li::marker{color:var(--accent)}
.dbx li.bad,.dbx li.good{list-style:none;margin:8px 0 8px -22px;padding:10px 14px;border-radius:10px}
.dbx li.bad{background:#FFF1F0;border:1px solid #FFCDC7}
.dbx li.good{background:#ECFDF3;border:1px solid #B7EBC9}
.dbx blockquote.callout{margin:14px 0;padding:12px 16px 12px 46px;border-radius:12px;background:linear-gradient(135deg,#E8F1FF,#F5F9FF);border:1px solid #C7DBFF;position:relative;color:#1E3A5F}
.dbx blockquote.callout:before{content:"ℹ️";position:absolute;left:14px;top:11px;font-size:18px}
.dbx blockquote.callout p{margin:4px 0}
.dbx .code{border-radius:12px;overflow:hidden;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.18);background:#0D1117}
.dbx .code-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161B22;border-bottom:1px solid #30363D}
.dbx .code-bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57;display:inline-block}
.dbx .code-bar i:nth-child(2){background:#FEBC2E}.dbx .code-bar i:nth-child(3){background:#28C840}
.dbx .lang{margin-left:8px;color:#8B949E;font-size:11px;letter-spacing:.1em;font-weight:700}
.dbx .run{margin-left:auto;color:#3FB950;font-size:11px;font-weight:700}
.dbx .copy{display:none}
.dbx .code pre{margin:0;padding:14px 16px;color:#E6EDF3;font-size:13px;line-height:1.55;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:transparent}
.dbx pre.diagram{background:linear-gradient(135deg,#F8FAFC,#EEF2FF);border:1px dashed #A5B4FC;border-radius:12px;padding:14px 16px;font-size:13px;color:#312E81;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tryit{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ECFDF3,#F0FDFA);border:1px solid #A7F3D0;border-radius:12px;padding:12px 16px;margin:12px 0}
.dbx .tryit b{color:#047857}
.dbx .present{display:flex;gap:16px;align-items:center;border-radius:14px;padding:16px 20px;background:linear-gradient(120deg,#2a2f6b,#7C4DFF);color:#fff;box-shadow:0 10px 30px rgba(124,77,255,.3)}
.dbx .present b{font-size:17px}
.dbx .present span{color:#E9E5FF}
.dbx .present .big{font-size:34px}
.dbx .footer{margin-top:10px;padding:14px 18px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);color:var(--muted);font-size:13px}
:root{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--purple:#7C4DFF;--teal:#00A3A1;--bg:#F4F2EE;--muted:#6B7280;--line:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1F2937;overflow:hidden}
body.embedded{height:760px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--navy);color:#fff;flex:none;z-index:5}

.crumb{color:#94A3B8;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}

.hbtn:hover{background:rgba(255,255,255,.1)}

.stage{flex:1;position:relative;min-height:0;perspective:1400px}
.slide{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(27,49,57,.14);overflow:auto;padding:34px 52px 40px}
.slide.enter-r{animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-l{animation:inL .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px) rotateY(-6deg)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) rotateY(6deg)}to{opacity:1;transform:none}}
.slide .dbx{max-width:none;font-size:18px}
.slide .dbx .sec-head h2{font-size:32px}
.slide .dbx table{font-size:16px}
.slide .dbx .code pre{font-size:14.5px}
.slide .dbx>*{animation:dbxRise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
.slide.title{padding:0;overflow:hidden;background:transparent;box-shadow:0 18px 50px rgba(27,49,57,.25)}
.slide.title .dbx{height:100%;display:flex;flex-direction:column;position:relative}
.slide.title .hero{flex:1;margin:0;border-radius:20px;display:flex;align-items:center;padding:60px 70px 150px}
.slide.title .hero h1{font-size:54px}
.slide.title .sub{font-size:20px}
.slide.title .b1{width:420px;height:420px}.slide.title .b2{width:340px;height:340px}.slide.title .b3{width:300px;height:300px}
.slide.title .idea{position:absolute;left:70px;right:70px;bottom:40px;font-size:18px;background:rgba(255,255,255,.96)}
.slide.title .dbx>:not(.hero):not(.idea){display:none}
.controls{display:flex;align-items:center;gap:12px;padding-top:12px;flex:none}
.controls .nav{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:16px}
.controls .nav:hover{border-color:var(--accent);color:var(--accent)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#CBD5E1;cursor:pointer;padding:0;transition:all .25s}
.dots button.on{background:var(--accent);width:28px;border-radius:6px}
.count{color:var(--muted);font-size:.85em;min-width:60px;text-align:right}
.hint{color:#94A3B8;font-size:.78em;white-space:nowrap}
#overview{position:absolute;inset:0;background:rgba(244,242,238,.97);z-index:4;display:none;overflow:auto;padding:26px}
#overview.on{display:block;animation:dbxRise .3s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:all .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .n{font-size:.75em;color:var(--muted);font-weight:700}
.card .i{font-size:28px;margin:6px 0}
.card .t{font-weight:700;color:var(--navy)}
#doc{flex:1;display:none;min-height:0}
body.docmode #slides{display:none}
body.docmode #doc{display:flex}
#toc{width:270px;flex:none;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:#fff}
#toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;color:#334155;text-decoration:none;font-size:.9em;margin:2px 0}
#toc a:hover{background:#F1F5F9}
#toc a.on{background:#FFF1EE;color:#C62D1A;font-weight:700}
#docScroll{flex:1;overflow:auto;padding:26px 34px 80px}
.dsec{background:#fff;border-radius:18px;padding:26px 32px;margin:0 auto 18px;max-width:1000px;box-shadow:0 4px 18px rgba(27,49,57,.06);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.dsec.seen{opacity:1;transform:none}
.dsec.herosec{padding:0;background:transparent;box-shadow:none}
.dsec .dbx>*{animation:none}
.quiz{max-width:820px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.dbx .code .copy{display:inline-block;margin-left:auto;border:1px solid #30363D;background:#21262D;color:#C9D1D9;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
.dbx .code .run+.copy{margin-left:10px}
@media (max-width:760px){.slide{padding:22px}.slide.title .hero{padding:30px 30px 160px}.slide.title .hero h1{font-size:32px}.slide.title .idea{left:16px;right:16px}#toc{display:none}.crumb{display:none}.hint{display:none}}
@media print{header,.controls,#bar,#toc{display:none}body{overflow:visible}#doc{display:block}#slides{display:none}.dsec{opacity:1;transform:none;box-shadow:none}}
</style>

<script>
function dbxQuiz(root, questions, onDone) {
  if (typeof root === 'string') root = document.getElementById(root);
  var i = 0, score = 0, picked = null, shown = false, done = false;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code style="background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px">$1</code>'); }
  function btn(label, primary) { return '<button style="margin-top:16px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-weight:700;background:' + (primary ? 'linear-gradient(135deg,#FF3621,#7C4DFF)' : '#E5E7EB') + ';color:' + (primary ? '#fff' : '#6B7280') + ';font-size:0.95em;box-shadow:' + (primary ? '0 6px 18px rgba(124,77,255,.3)' : 'none') + '">' + label + '</button>'; }
  var box = 'padding:22px 24px;border-radius:16px;background:#fff;border:1px solid #E5E7EB;box-shadow:0 8px 28px rgba(27,49,57,.08);animation:dbxQ .4s ease both';
  var style = '<style>@keyframes dbxQ{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>';
  function bar() {
    var h = '<div style="display:flex;gap:6px;margin-bottom:14px">';
    for (var k = 0; k < questions.length; k++) h += '<div style="flex:1;height:6px;border-radius:6px;background:' + (k < i ? 'linear-gradient(90deg,#FF3621,#7C4DFF)' : k === i ? '#C4B5FD' : '#E5E7EB') + '"></div>';
    return h + '</div>';
  }
  function render() {
    if (i >= questions.length) {
      var pct = Math.round(score / questions.length * 100), msg = pct === 100 ? 'Perfect! 🎉' : pct >= 60 ? 'Nice work! 💪' : 'Worth another look 📖';
      root.innerHTML = style + '<div style="' + box + ';text-align:center"><div style="font-size:48px">' + (pct === 100 ? '🏆' : pct >= 60 ? '🌟' : '🔁') + '</div><div style="font-size:1.6em;font-weight:800;color:#1B3139">' + score + ' / ' + questions.length + '</div><div style="color:#6B7280;margin-top:4px">' + msg + '</div>' + btn('Retake', true) + '</div>';
      root.querySelector('button').onclick = function () { i = 0; score = 0; picked = null; shown = false; done = false; render(); };
      if (!done && onDone) { done = true; onDone(score, questions.length); }
      return;
    }
    var Q = questions[i], h = style + '<div style="' + box + '">' + bar();
    h += '<div style="color:#7C4DFF;font-size:0.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Question ' + (i + 1) + ' of ' + questions.length + '</div>';
    h += '<div style="font-weight:700;color:#1B3139;margin-bottom:14px;line-height:1.5;font-size:1.05em">' + esc(Q.q) + '</div>';
    Q.o.forEach(function (t, k) {
      var bg = '#fff', bd = '#E5E7EB', mark = String.fromCharCode(65 + k);
      if (shown && k === Q.c) { bg = '#ECFDF3'; bd = '#22C55E'; mark = '✓'; }
      else if (shown && k === picked) { bg = '#FFF1F0'; bd = '#EF4444'; mark = '✗'; }
      else if (!shown && k === picked) { bg = '#F5F3FF'; bd = '#7C4DFF'; }
      h += '<div data-k="' + k + '" style="display:flex;gap:12px;align-items:center;padding:11px 14px;margin:8px 0;border:2px solid ' + bd + ';background:' + bg + ';border-radius:12px;cursor:' + (shown ? 'default' : 'pointer') + ';color:#1F2937;transition:all .15s">' +
        '<span style="flex:none;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;background:' + (bd === '#E5E7EB' ? '#F1F5F9' : bd) + ';color:' + (bd === '#E5E7EB' ? '#64748B' : '#fff') + '">' + mark + '</span><span>' + esc(t) + '</span></div>';
    });
    if (shown) {
      var ok = picked === Q.c;
      h += '<div style="margin-top:14px;padding:14px 16px;border-radius:12px;background:' + (ok ? '#ECFDF3' : '#FFF7ED') + ';border:1px solid ' + (ok ? '#A7F3D0' : '#FED7AA') + ';color:#1F2937;animation:dbxQ .3s both"><strong>' + (ok ? '✅ Correct.' : '💡 Not quite.') + '</strong> ' + esc(Q.e) + '</div>' + btn(i + 1 < questions.length ? 'Next →' : 'See score', true);
    } else {
      h += btn('Submit', picked !== null);
    }
    root.innerHTML = h + '</div>';
    if (!shown) root.querySelectorAll('[data-k]').forEach(function (el) { el.onclick = function () { picked = +el.getAttribute('data-k'); render(); }; });
    root.querySelector('button').onclick = function () {
      if (!shown) { if (picked === null) return; if (picked === Q.c) score++; shown = true; }
      else { i++; picked = null; shown = false; }
      render();
    };
  }
  render();
}
var SLIDES = [{"title": "Recap: Build Data Pipelines with Lakeflow Spark Declarative Pipelines", "icon": "🚀", "html": "<div class=\"hero\"><div class=\"blob b1\"><\/div><div class=\"blob b2\"><\/div><div class=\"blob b3\"><\/div><div class=\"hero-in\"><div class=\"kicker\">Data Engineering with Databricks<\/div><h1><span class=\"kicker-inline\">Recap<\/span>Build Data Pipelines with Lakeflow Spark Declarative Pipelines<\/h1><div class=\"chips\"><span class=\"chip\">Course 3 of 4<\/span><span class=\"chip\">⏱ ~9 minutes<\/span><\/div><p class=\"sub\">Building a <strong>bronze → silver → gold<\/strong> pipeline <em>declaratively<\/em>: you describe the tables, and the pipeline handles the order, incremental processing, checkpoints, retries and data quality. (Formerly <em>Delta Live Tables / DLT<\/em>.)<\/p><\/div><\/div><div class=\"idea\"><span class=\"idea-icon\">💡<\/span><div><b>The one idea to remember:<\/b> use <strong>streaming tables<\/strong> for ingestion and row-level transforms, and <strong>materialized views<\/strong> for aggregates and joins that must stay correct. Add <strong>expectations<\/strong> to every layer you care about.<\/div><\/div>"}, {"title": "What we covered", "icon": "🗺️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">01<\/span><span class=\"sec-icon\">🗺️<\/span><h2>What we covered<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Key takeaway<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Why declarative pipelines<\/td>\n<td>Define <em>what<\/em> the tables are, not <em>how<\/em> to run them. Dependencies are resolved automatically<\/td>\n<\/tr>\n<tr>\n<td>Dataset types<\/td>\n<td><strong>Streaming tables<\/strong>, <strong>materialized views<\/strong>, temporary views, and <strong>flows<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Developing a pipeline<\/td>\n<td><strong>Lakeflow Pipelines Editor<\/strong>, pipeline settings, dry run, and the pipeline graph<\/td>\n<\/tr>\n<tr>\n<td>Medallion with Auto Loader<\/td>\n<td><code>STREAM read_files()<\/code> into bronze, cleaned silver, aggregated gold<\/td>\n<\/tr>\n<tr>\n<td>Data quality<\/td>\n<td><strong>Expectations<\/strong>: warn, drop or fail<\/td>\n<\/tr>\n<tr>\n<td>Running in production<\/td>\n<td>Triggered vs continuous, development vs production mode, scheduling with a job<\/td>\n<\/tr>\n<tr>\n<td>Monitoring<\/td>\n<td>Pipeline graph, data quality metrics, and the <strong>event log<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Change data capture<\/td>\n<td><strong>AUTO CDC INTO<\/strong> (formerly APPLY CHANGES) for <strong>SCD Type 1 and 2<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Dataset types", "icon": "🧱", "html": "<div class=\"sec-head\"><span class=\"sec-num\">02<\/span><span class=\"sec-icon\">🧱<\/span><h2>Dataset types<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Object<\/th>\n<th>Semantics<\/th>\n<th>Typical layer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Streaming table (ST)<\/strong><\/td>\n<td>Incremental and append-oriented: each source row is processed <strong>once<\/strong><\/td>\n<td>Bronze ingestion, silver cleansing, CDC targets<\/td>\n<\/tr>\n<tr>\n<td><strong>Materialized view (MV)<\/strong><\/td>\n<td>Query result that is kept <strong>correct<\/strong> on every refresh. It is refreshed incrementally when possible and reflects updates and deletes<\/td>\n<td>Gold aggregates, joins with changing dimensions<\/td>\n<\/tr>\n<tr>\n<td><strong>Temporary view<\/strong><\/td>\n<td>Not persisted, visible only inside the pipeline<\/td>\n<td>Intermediate logic<\/td>\n<\/tr>\n<tr>\n<td><strong>Flow<\/strong><\/td>\n<td>A query that writes into a target. Several <strong>append flows<\/strong> can feed one ST<\/td>\n<td>Fan-in from many sources, backfills<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>STREAM(...)<\/code> / <code>spark.readStream<\/code> gives a <strong>streaming<\/strong> read, so the result is a streaming table. A plain <code>FROM<\/code> / <code>spark.read<\/code> gives a <strong>batch<\/strong> read, so the result is a materialized view.<\/p>"}, {"title": "A medallion pipeline in SQL", "icon": "🏗️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">03<\/span><span class=\"sec-icon\">🏗️<\/span><h2>A medallion pipeline in SQL<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\">-- Bronze: incremental file ingestion with Auto Loader<\/span>\n<span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">OR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">REFRESH<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STREAMING<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">orders_bronze<\/span>\n<span style=\"color: #FF7B72\">COMMENT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'Raw orders'<\/span>\n<span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">*<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">_metadata.file_name<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">source_file,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">current_timestamp<\/span><span style=\"color: #E6EDF3\">()<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">ingested_at<\/span>\n<span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STREAM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">read_files(<\/span><span style=\"color: #A5D6FF\">'/Volumes/shop/raw/orders/'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">format<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">=&gt;<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'json'<\/span><span style=\"color: #E6EDF3\">);<\/span>\n\n<span style=\"color: #8B949E; font-style: italic\">-- Silver: clean + data quality<\/span>\n<span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">OR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">REFRESH<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STREAMING<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">orders_silver<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72\">CONSTRAINT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">valid_id<\/span><span style=\"color: #6E7681\">     <\/span><span style=\"color: #E6EDF3\">EXPECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(order_id<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">IS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">NOT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">NULL<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">VIOLATION<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">DROP<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ROW<\/span><span style=\"color: #E6EDF3\">,<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72\">CONSTRAINT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">positive_amt<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">EXPECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(amount<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">&gt;<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">0<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\">           <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">VIOLATION<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">FAIL<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">UPDATE<\/span><span style=\"color: #E6EDF3\">,<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #FF7B72\">CONSTRAINT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">has_email<\/span><span style=\"color: #6E7681\">    <\/span><span style=\"color: #E6EDF3\">EXPECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(email<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">IS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">NOT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">NULL<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\">                      <\/span><span style=\"color: #8B949E; font-style: italic\">-- warn only<\/span>\n<span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_id,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">lower<\/span><span style=\"color: #E6EDF3\">(email)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">email,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">CAST<\/span><span style=\"color: #E6EDF3\">(amount<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">DECIMAL(<\/span><span style=\"color: #A5D6FF\">10<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #A5D6FF\">2<\/span><span style=\"color: #E6EDF3\">))<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">amount,<\/span>\n<span style=\"color: #6E7681\">          <\/span><span style=\"color: #FF7B72\">CAST<\/span><span style=\"color: #E6EDF3\">(order_ts<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TIMESTAMP<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_ts<\/span>\n<span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STREAM(orders_bronze);<\/span>\n\n<span style=\"color: #8B949E; font-style: italic\">-- Gold: aggregate for BI<\/span>\n<span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">OR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">REFRESH<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">MATERIALIZED<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">VIEW<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">daily_revenue<\/span>\n<span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">date(order_ts)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">order_date,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">sum<\/span><span style=\"color: #E6EDF3\">(amount)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">revenue,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">count<\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #FF7B72; font-weight: bold\">*<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">orders<\/span>\n<span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">orders_silver<\/span>\n<span style=\"color: #FF7B72\">GROUP<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">BY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ALL<\/span><span style=\"color: #E6EDF3\">;<\/span><\/pre><\/div>\n<p>Tables reference each other by name, and the pipeline builds the <strong>dependency graph<\/strong> from those references. You never write \"run bronze first\".<\/p>"}, {"title": "The same in Python", "icon": "🐍", "html": "<div class=\"sec-head\"><span class=\"sec-num\">04<\/span><span class=\"sec-icon\">🐍<\/span><h2>The same in Python<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">pipelines<\/span> <span style=\"color: #FF7B72\">as<\/span> <span style=\"color: #E6EDF3\">dp<\/span>        <span style=\"color: #8B949E; font-style: italic\"># older code: import dlt<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark.sql<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">functions<\/span> <span style=\"color: #FF7B72\">as<\/span> <span style=\"color: #E6EDF3\">F<\/span>\n\n<span style=\"color: #D2A8FF; font-weight: bold\">@dp<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">table(comment<\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #A5D6FF\">\"Raw orders\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">orders_bronze<\/span><span style=\"color: #E6EDF3\">():<\/span>\n    <span style=\"color: #FF7B72\">return<\/span> <span style=\"color: #E6EDF3\">(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">readStream<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">format(<\/span><span style=\"color: #A5D6FF\">\"cloudFiles\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n            <span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">option(<\/span><span style=\"color: #A5D6FF\">\"cloudFiles.format\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"json\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n            <span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">load(<\/span><span style=\"color: #A5D6FF\">\"/Volumes/shop/raw/orders/\"<\/span><span style=\"color: #E6EDF3\">))<\/span>\n\n<span style=\"color: #D2A8FF; font-weight: bold\">@dp<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">table<\/span>\n<span style=\"color: #D2A8FF; font-weight: bold\">@dp<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">expect_or_drop(<\/span><span style=\"color: #A5D6FF\">\"valid_id\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"order_id IS NOT NULL\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #D2A8FF; font-weight: bold\">@dp<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">expect_or_fail(<\/span><span style=\"color: #A5D6FF\">\"positive_amt\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"amount &gt; 0\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">orders_silver<\/span><span style=\"color: #E6EDF3\">():<\/span>\n    <span style=\"color: #FF7B72\">return<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">readStream<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">table(<\/span><span style=\"color: #A5D6FF\">\"orders_bronze\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">withColumn(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lower(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">))<\/span>\n\n<span style=\"color: #D2A8FF; font-weight: bold\">@dp<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">materialized_view<\/span>\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">daily_revenue<\/span><span style=\"color: #E6EDF3\">():<\/span>\n    <span style=\"color: #FF7B72\">return<\/span> <span style=\"color: #E6EDF3\">(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">read<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">table(<\/span><span style=\"color: #A5D6FF\">\"orders_silver\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n            <span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">groupBy(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">to_date(<\/span><span style=\"color: #A5D6FF\">\"order_ts\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">alias(<\/span><span style=\"color: #A5D6FF\">\"order_date\"<\/span><span style=\"color: #E6EDF3\">))<\/span>\n            <span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">agg(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sum(<\/span><span style=\"color: #A5D6FF\">\"amount\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">alias(<\/span><span style=\"color: #A5D6FF\">\"revenue\"<\/span><span style=\"color: #E6EDF3\">)))<\/span><\/pre><\/div>\n<p>SQL and Python files can be mixed in the same pipeline.<\/p>"}, {"title": "Data quality with expectations", "icon": "✅", "html": "<div class=\"sec-head\"><span class=\"sec-num\">05<\/span><span class=\"sec-icon\">✅<\/span><h2>Data quality with expectations<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Expectation<\/th>\n<th>Invalid rows<\/th>\n<th>Pipeline<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>EXPECT (...)<\/code> / <code>@dp.expect<\/code> (default: <strong>warn<\/strong>)<\/td>\n<td>Kept<\/td>\n<td>Continues. Violations are counted<\/td>\n<\/tr>\n<tr>\n<td><code>ON VIOLATION DROP ROW<\/code> / <code>@dp.expect_or_drop<\/code><\/td>\n<td><strong>Dropped<\/strong><\/td>\n<td>Continues. Violations are counted<\/td>\n<\/tr>\n<tr>\n<td><code>ON VIOLATION FAIL UPDATE<\/code> / <code>@dp.expect_or_fail<\/code><\/td>\n<td>—<\/td>\n<td>The update <strong>fails<\/strong>. Nothing is committed for that flow<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Violation metrics show up in the pipeline UI and in the <strong>event log<\/strong>.<\/li>\n<li><code>expect_all<\/code>, <code>expect_all_or_drop<\/code> and <code>expect_all_or_fail<\/code> take a dictionary of rules.<\/li>\n<li><strong>Quarantine pattern:<\/strong> don't just drop bad rows. Write them to a separate table with the inverted rule, so you can inspect them.<\/li>\n<\/ul>"}, {"title": "Developing and running a pipeline", "icon": "🏗️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">06<\/span><span class=\"sec-icon\">🏗️<\/span><h2>Developing and running a pipeline<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Options<\/th>\n<th>Guidance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Editor<\/strong><\/td>\n<td>Lakeflow Pipelines Editor (multi-file, graph, data preview)<\/td>\n<td>Use <strong>dry run<\/strong> to validate code and the graph without processing data<\/td>\n<\/tr>\n<tr>\n<td><strong>Destination<\/strong><\/td>\n<td>Default catalog and schema in Unity Catalog<\/td>\n<td>Tables are published as UC objects<\/td>\n<\/tr>\n<tr>\n<td><strong>Compute<\/strong><\/td>\n<td><strong>Serverless<\/strong> (recommended) or classic<\/td>\n<td>Serverless gives fast start and incremental MV refresh<\/td>\n<\/tr>\n<tr>\n<td><strong>Pipeline mode<\/strong><\/td>\n<td><strong>Triggered<\/strong>: process available data, then stop. <strong>Continuous<\/strong>: always running<\/td>\n<td>Triggered with a schedule for hourly or daily SLAs, continuous for low latency<\/td>\n<\/tr>\n<tr>\n<td><strong>Run type<\/strong><\/td>\n<td>Development: reuses compute, no retries. Production: retries and restarts<\/td>\n<td>Production for scheduled runs<\/td>\n<\/tr>\n<tr>\n<td><strong>Refresh<\/strong><\/td>\n<td>Normal update, refresh selected tables, <strong>full refresh<\/strong><\/td>\n<td>Full refresh recomputes from scratch. Careful with sources that no longer hold old data<\/td>\n<\/tr>\n<tr>\n<td><strong>Configuration<\/strong><\/td>\n<td>Key-value parameters (e.g. <code>source_path<\/code>)<\/td>\n<td>Avoid hard-coded paths. Read them in code with <code>spark.conf.get(\"source_path\")<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Schedule the pipeline with its own schedule, or as a <strong>pipeline task in a Lakeflow Job<\/strong> (course 2).<\/p>"}, {"title": "Monitoring: the event log", "icon": "📈", "html": "<div class=\"sec-head\"><span class=\"sec-num\">07<\/span><span class=\"sec-icon\">📈<\/span><h2>Monitoring: the event log<\/h2><\/div><ul>\n<li><strong>Pipeline graph:<\/strong> status, row counts and timing per dataset.<\/li>\n<li><strong>Data quality tab:<\/strong> expectation pass and fail counts per table.<\/li>\n<li><strong>Event log:<\/strong> a Delta table with every update, flow progress, data quality metric and error.<\/li>\n<\/ul>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">timestamp<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">event_type,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">message<\/span>\n<span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">event_log(<\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #E6EDF3\">(orders_silver))<\/span><span style=\"color: #6E7681\">     <\/span><span style=\"color: #8B949E; font-style: italic\">-- or event_log('&lt;pipeline-id&gt;')<\/span>\n<span style=\"color: #FF7B72\">WHERE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">event_type<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">IN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">'flow_progress'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'update_progress'<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #FF7B72\">ORDER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">BY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">timestamp<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">DESC<\/span><span style=\"color: #E6EDF3\">;<\/span><\/pre><\/div>"}, {"title": "Change data capture with AUTO CDC", "icon": "🔁", "html": "<div class=\"sec-head\"><span class=\"sec-num\">08<\/span><span class=\"sec-icon\">🔁<\/span><h2>Change data capture with AUTO CDC<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">OR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">REFRESH<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STREAMING<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">customers_silver;<\/span>\n\n<span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">FLOW<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">customers_cdc<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">AUTO<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">CDC<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">INTO<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">customers_silver<\/span>\n<span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STREAM(customers_cdc_bronze)<\/span>\n<span style=\"color: #E6EDF3\">KEYS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(customer_id)<\/span>\n<span style=\"color: #E6EDF3\">APPLY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">DELETE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">WHEN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">operation<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'DELETE'<\/span>\n<span style=\"color: #E6EDF3\">SEQUENCE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">BY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">event_ts<\/span><span style=\"color: #6E7681\">                 <\/span><span style=\"color: #8B949E; font-style: italic\">-- decides which change wins (handles out-of-order data)<\/span>\n<span style=\"color: #E6EDF3\">COLUMNS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">*<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">EXCEPT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #FF7B72\">operation<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">event_ts)<\/span>\n<span style=\"color: #E6EDF3\">STORED<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">SCD<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TYPE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">2<\/span><span style=\"color: #E6EDF3\">;<\/span><span style=\"color: #6E7681\">                <\/span><span style=\"color: #8B949E; font-style: italic\">-- or SCD TYPE 1<\/span><\/pre><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>SCD Type 1<\/th>\n<th>SCD Type 2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Target holds<\/td>\n<td>Latest state, one row per key<\/td>\n<td>One row <strong>per version<\/strong><\/td>\n<\/tr>\n<tr>\n<td>History<\/td>\n<td>Overwritten<\/td>\n<td>Kept in <strong><code>__START_AT<\/code> / <code>__END_AT<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td>Current rows<\/td>\n<td>All rows<\/td>\n<td><code>WHERE __END_AT IS NULL<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>AUTO CDC replaces hand-written <code>MERGE<\/code> logic for ordering, deduplication, deletes and SCD2 versioning. Use <strong>AUTO CDC FROM SNAPSHOT<\/strong> when the source only delivers full snapshots.<\/p>"}, {"title": "Common mistakes", "icon": "⚠️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">09<\/span><span class=\"sec-icon\">⚠️<\/span><h2>Common mistakes<\/h2><\/div><ul>\n<li class=\"bad\">❌ A <strong>streaming table<\/strong> for a gold aggregate that must reflect late corrections. Use an <strong>MV<\/strong>.<\/li>\n<li class=\"bad\">❌ A <strong>materialized view<\/strong> for raw, high-volume append ingestion. Use an <strong>ST<\/strong>.<\/li>\n<li class=\"bad\">❌ <code>EXPECT<\/code> without an action, expecting it to remove rows. The default only <strong>warns<\/strong>.<\/li>\n<li class=\"bad\">❌ <strong>Continuous<\/strong> mode for a daily report. Use <strong>triggered<\/strong> mode with a schedule.<\/li>\n<li class=\"bad\">❌ A full refresh of a bronze ST whose source (e.g. Kafka) no longer holds old events. That data is lost.<\/li>\n<li class=\"bad\">❌ Hand-written MERGE for out-of-order CDC. <strong>AUTO CDC + <code>SEQUENCE BY<\/code><\/strong> handles it.<\/li>\n<\/ul>\n<p><strong>Next course:<\/strong> <em>DevOps Essentials for Data Engineering<\/em>, which takes this code into a tested, versioned deployment.<\/p>"}];
var QUIZ = [{"q": "A gold table aggregates revenue per day, and upstream orders can be corrected or deleted days later. Which dataset type keeps the result correct?", "o": ["Streaming table", "Materialized view", "Temporary view", "Append flow"], "c": 1, "e": "A materialized view is kept correct on every refresh, including updates and deletes in its sources. A streaming table processes each input row only once."}, {"q": "Rows with a NULL order_id must be removed from the silver table, but the pipeline must keep running. Which expectation do you use?", "o": ["`EXPECT (order_id IS NOT NULL)`", "`EXPECT (order_id IS NOT NULL) ON VIOLATION DROP ROW`", "`EXPECT (order_id IS NOT NULL) ON VIOLATION FAIL UPDATE`", "A CHECK constraint on the table"], "c": 1, "e": "DROP ROW removes invalid rows and records the count. Plain EXPECT only warns, and FAIL UPDATE stops the update."}, {"q": "Which statement makes a streaming read in a SQL pipeline definition?", "o": ["`FROM orders_bronze`", "`FROM STREAM(orders_bronze)`", "`FROM LIVE.orders_bronze`", "`FROM TABLE(orders_bronze)`"], "c": 1, "e": "`STREAM(...)` (or `STREAM read_files(...)`) gives an incremental, streaming read, producing a streaming table. A plain FROM is a batch read."}, {"q": "A change feed contains inserts, updates and deletes that may arrive out of order. The business needs the full history of customer addresses. What do you use?", "o": ["MERGE INTO in a foreachBatch", "AUTO CDC with SEQUENCE BY ... STORED AS SCD TYPE 2", "AUTO CDC STORED AS SCD TYPE 1", "A materialized view with ROW_NUMBER()"], "c": 1, "e": "AUTO CDC uses the sequence column to order changes correctly. SCD Type 2 keeps every version with __START_AT and __END_AT."}, {"q": "A pipeline feeds a dashboard that is refreshed once per day. Which pipeline mode is the most cost-effective?", "o": ["Continuous", "Triggered, scheduled daily", "Continuous with development mode", "Triggered, with a full refresh every run"], "c": 1, "e": "Triggered mode processes the available data and then stops. Continuous mode keeps compute running all the time, and full refresh reprocesses everything."}];

    html: '<div class="sec-head"><span class="sec-num">' + String(SLIDES.length).padStart(2, '0') + '</span><span class="sec-icon">🎯</span><h2>Check yourself</h2></div><div class="quiz"></div>' });
  var idx = 0, stage = document.getElementById('stage'), dots = document.getElementById('dots');

        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'copied ✓'; setTimeout(function () { b.textContent = 'copy'; }, 1400); }, function () {});
      };

  }
  function confetti() {
    var e = ['🎉', '✨', '🎊', '⭐', '🧡', '💜'];
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('div'); s.className = 'confetti'; s.textContent = e[i % e.length];
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .8 + 's'; document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 3600);
    }
  }
  function mountQuiz(el) { dbxQuiz(el, QUIZ, function (score, total) { if (score === total) confetti(); }); }

  SLIDES.forEach(function (s, i) {

    c.onclick = function () { overview(false); go(i); }; $('grid').appendChild(c);
  });
  function go(n, dir) {
    var prev = idx; idx = Math.max(0, Math.min(SLIDES.length - 1, n));
    var s = SLIDES[idx], el = document.createElement('div');
    el.className = 'slide ' + (idx === 0 ? 'title ' : '') + ((dir || (idx >= prev ? 1 : -1)) > 0 ? 'enter-r' : 'enter-l');
    el.innerHTML = '<div class="dbx">' + s.html + '</div>';
    Array.prototype.forEach.call(el.firstChild.children, function (ch, k) { ch.style.setProperty('--i', k); });
    stage.innerHTML = ''; stage.appendChild(el); wireCopy(el);
    if (s.quiz) mountQuiz(el.querySelector('.quiz'));
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === idx); });
    $('count').textContent = (idx + 1) + ' / ' + SLIDES.length;

    try { history.replaceState(null, '', '#slide-' + (idx + 1)); } catch (e) {}
  }

  $('prev').onclick = function () { go(idx - 1, -1); };

  $('bOver').onclick = function () { mode('slides'); overview(); };

    var r = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (r.requestFullscreen) r.requestFullscreen().catch(function () {});
  };
  var tx = null;
  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) { if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1)); tx = null; });

  var docBuilt = false;
  function buildDoc() {
    if (docBuilt) return; docBuilt = true;
    var toc = $('toc'), sc = $('docScroll');
    SLIDES.forEach(function (s, i) {
      var sec = document.createElement('div'); sec.className = 'dsec' + (i === 0 ? ' herosec' : ''); sec.id = 'sec-' + i;
      sec.innerHTML = '<div class="dbx">' + s.html + '</div>'; sc.appendChild(sec); wireCopy(sec);
      if (s.quiz) mountQuiz(sec.querySelector('.quiz'));
      var a = document.createElement('a'); a.href = '#sec-' + i; a.innerHTML = '<span>' + s.icon + '</span><span>' + (i === 0 ? 'Overview' : s.title) + '</span>';
      a.onclick = function (e) { e.preventDefault(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; toc.appendChild(a);
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) en.target.classList.add('seen'); }); }, { root: sc, threshold: .05 });
      sc.querySelectorAll('.dsec').forEach(function (s) { io.observe(s); });
    } else sc.querySelectorAll('.dsec').forEach(function (s) { s.classList.add('seen'); });
    sc.addEventListener('scroll', function () {
      var cur = 0;
      sc.querySelectorAll('.dsec').forEach(function (s, i) { if (s.offsetTop - sc.scrollTop < 140) cur = i; });
      toc.querySelectorAll('a').forEach(function (a, i) { a.classList.toggle('on', i === cur); });
      $('bar').style.width = (sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight) * 100) + '%';

  }

  $('bSlides').onclick = function () { mode('slides'); };

    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (k === 'p' || k === 'P') return mode('slides');

    if (k === 'o' || k === 'O') return overview();
    if (k === 'Escape') return overview(false);
    if (k === 'f' || k === 'F') return $('bFull').click();

    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(idx - 1, -1); }
    else if (k === 'Home') go(0, -1); else if (k === 'End') go(SLIDES.length - 1, 1);
  });

  if (location.hash === '#doc') mode('doc'); else go(idx, 1);
})();
