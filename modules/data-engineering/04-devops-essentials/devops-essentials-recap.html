<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap 4: DevOps Essentials for Data Engineering · dbxhelp</title>
<style>
.dbx{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--teal:#00A3A1;--purple:#7C4DFF;--amber:#FFAB00;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.6;max-width:1100px}
.dbx *{box-sizing:border-box}
.dbx>*{animation:dbxRise .55s cubic-bezier(.2,.7,.2,1) both}
.dbx>*:nth-child(2){animation-delay:.06s}.dbx>*:nth-child(3){animation-delay:.12s}.dbx>*:nth-child(4){animation-delay:.18s}.dbx>*:nth-child(5){animation-delay:.24s}.dbx>*:nth-child(6){animation-delay:.3s}.dbx>*:nth-child(n+7){animation-delay:.36s}
@keyframes dbxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dbxGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes dbxFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@keyframes dbxLine{from{width:0}to{width:100%}}
@keyframes dbxPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,54,33,.25)}50%{box-shadow:0 0 0 8px rgba(255,54,33,0)}}
.dbx .hero{position:relative;overflow:hidden;border-radius:18px;padding:38px 40px 34px;margin:4px 0 18px;color:#fff;background:linear-gradient(120deg,#1B3139,#22425a,#2a2f6b,#1B3139);background-size:300% 300%;animation:dbxGrad 14s ease infinite,dbxRise .6s both}
.dbx .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:dbxFloat 9s ease-in-out infinite}
.dbx .b1{width:220px;height:220px;background:#FF3621;right:-40px;top:-60px}
.dbx .b2{width:180px;height:180px;background:#7C4DFF;right:160px;bottom:-90px;animation-delay:-3s}
.dbx .b3{width:140px;height:140px;background:#00A3A1;left:-40px;bottom:-50px;animation-delay:-6s}
.dbx .hero-in{position:relative}
.dbx .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#FFC4BA;font-weight:700}
.dbx .hero h1{font-size:34px;line-height:1.15;margin:8px 0 14px;color:#fff;font-weight:800}
.dbx .kicker-inline{display:inline-block;font-size:.5em;vertical-align:middle;background:var(--accent);padding:4px 10px;border-radius:999px;margin-right:10px;letter-spacing:.08em;text-transform:uppercase}
.dbx .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dbx .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px;color:#fff}
.dbx .chip strong{color:#fff}
.dbx .sub{color:#E2E8F0;font-size:16px;margin:0;max-width:820px}
.dbx .sub strong,.dbx .sub b{color:#FFD7CF}
.dbx .sub code{background:rgba(255,255,255,.16);color:#fff}
.dbx .idea{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFF4F1,#FFF);border:1px solid #FFD0C7;border-left:5px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;animation:dbxRise .55s both,dbxPulse 3s ease-in-out 1s 2}
.dbx .idea-icon{font-size:26px;line-height:1}
.dbx .idea b{color:#C62D1A}
.dbx .sec-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;position:relative;padding-bottom:10px}
.dbx .sec-head:after{content:"";position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));animation:dbxLine .9s ease-out both}
.dbx .sec-num{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7a59);padding:5px 10px;border-radius:9px;letter-spacing:.05em}
.dbx .sec-icon{font-size:26px;line-height:1}
.dbx .sec-head h2{margin:0;font-size:25px;color:var(--navy);font-weight:800;border:0}
.dbx h3{color:var(--navy);margin:18px 0 8px}
.dbx p{margin:8px 0}
.dbx a{color:var(--blue)}
.dbx code{background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(27,49,57,.06);margin:12px 0;background:#fff}
.dbx table{border-collapse:collapse;width:100%;font-size:14px}
.dbx th{background:linear-gradient(135deg,#1B3139,#2B4F63);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
.dbx td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.dbx tr:nth-child(even) td{background:#F8FAFC}
.dbx tr:hover td{background:#FFF4F1}
.dbx td:first-child{font-weight:600;color:var(--navy)}
.dbx ul,.dbx ol{padding-left:22px;margin:8px 0}
.dbx li{margin:5px 0}
.dbx li::marker{color:var(--accent)}
.dbx li.bad,.dbx li.good{list-style:none;margin:8px 0 8px -22px;padding:10px 14px;border-radius:10px}
.dbx li.bad{background:#FFF1F0;border:1px solid #FFCDC7}
.dbx li.good{background:#ECFDF3;border:1px solid #B7EBC9}
.dbx blockquote.callout{margin:14px 0;padding:12px 16px 12px 46px;border-radius:12px;background:linear-gradient(135deg,#E8F1FF,#F5F9FF);border:1px solid #C7DBFF;position:relative;color:#1E3A5F}
.dbx blockquote.callout:before{content:"ℹ️";position:absolute;left:14px;top:11px;font-size:18px}
.dbx blockquote.callout p{margin:4px 0}
.dbx .code{border-radius:12px;overflow:hidden;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.18);background:#0D1117}
.dbx .code-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161B22;border-bottom:1px solid #30363D}
.dbx .code-bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57;display:inline-block}
.dbx .code-bar i:nth-child(2){background:#FEBC2E}.dbx .code-bar i:nth-child(3){background:#28C840}
.dbx .lang{margin-left:8px;color:#8B949E;font-size:11px;letter-spacing:.1em;font-weight:700}
.dbx .run{margin-left:auto;color:#3FB950;font-size:11px;font-weight:700}
.dbx .copy{display:none}
.dbx .code pre{margin:0;padding:14px 16px;color:#E6EDF3;font-size:13px;line-height:1.55;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:transparent}
.dbx pre.diagram{background:linear-gradient(135deg,#F8FAFC,#EEF2FF);border:1px dashed #A5B4FC;border-radius:12px;padding:14px 16px;font-size:13px;color:#312E81;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tryit{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ECFDF3,#F0FDFA);border:1px solid #A7F3D0;border-radius:12px;padding:12px 16px;margin:12px 0}
.dbx .tryit b{color:#047857}
.dbx .present{display:flex;gap:16px;align-items:center;border-radius:14px;padding:16px 20px;background:linear-gradient(120deg,#2a2f6b,#7C4DFF);color:#fff;box-shadow:0 10px 30px rgba(124,77,255,.3)}
.dbx .present b{font-size:17px}
.dbx .present span{color:#E9E5FF}
.dbx .present .big{font-size:34px}
.dbx .footer{margin-top:10px;padding:14px 18px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);color:var(--muted);font-size:13px}
:root{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--purple:#7C4DFF;--teal:#00A3A1;--bg:#F4F2EE;--muted:#6B7280;--line:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1F2937;overflow:hidden}
body.embedded{height:760px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--navy);color:#fff;flex:none;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}
.crumb{color:#94A3B8;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}

.hbtn:hover{background:rgba(255,255,255,.1)}
#bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));width:0;transition:width .35s ease;flex:none}
#slides{flex:1;display:flex;flex-direction:column;min-height:0;padding:18px 22px 10px;position:relative}
.stage{flex:1;position:relative;min-height:0;perspective:1400px}
.slide{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(27,49,57,.14);overflow:auto;padding:34px 52px 40px}
.slide.enter-r{animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-l{animation:inL .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px) rotateY(-6deg)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) rotateY(6deg)}to{opacity:1;transform:none}}
.slide .dbx{max-width:none;font-size:18px}
.slide .dbx .sec-head h2{font-size:32px}
.slide .dbx table{font-size:16px}
.slide .dbx .code pre{font-size:14.5px}
.slide .dbx>*{animation:dbxRise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
.slide.title{padding:0;overflow:hidden;background:transparent;box-shadow:0 18px 50px rgba(27,49,57,.25)}
.slide.title .dbx{height:100%;display:flex;flex-direction:column;position:relative}
.slide.title .hero{flex:1;margin:0;border-radius:20px;display:flex;align-items:center;padding:60px 70px 150px}
.slide.title .hero h1{font-size:54px}
.slide.title .sub{font-size:20px}
.slide.title .b1{width:420px;height:420px}.slide.title .b2{width:340px;height:340px}.slide.title .b3{width:300px;height:300px}
.slide.title .idea{position:absolute;left:70px;right:70px;bottom:40px;font-size:18px;background:rgba(255,255,255,.96)}
.slide.title .dbx>:not(.hero):not(.idea){display:none}
.controls{display:flex;align-items:center;gap:12px;padding-top:12px;flex:none}
.controls .nav{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:16px}
.controls .nav:hover{border-color:var(--accent);color:var(--accent)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#CBD5E1;cursor:pointer;padding:0;transition:all .25s}
.dots button.on{background:var(--accent);width:28px;border-radius:6px}
.count{color:var(--muted);font-size:.85em;min-width:60px;text-align:right}
.hint{color:#94A3B8;font-size:.78em;white-space:nowrap}
#overview{position:absolute;inset:0;background:rgba(244,242,238,.97);z-index:4;display:none;overflow:auto;padding:26px}
#overview.on{display:block;animation:dbxRise .3s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:all .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .n{font-size:.75em;color:var(--muted);font-weight:700}
.card .i{font-size:28px;margin:6px 0}
.card .t{font-weight:700;color:var(--navy)}
#doc{flex:1;display:none;min-height:0}
body.docmode #slides{display:none}
body.docmode #doc{display:flex}
#toc{width:270px;flex:none;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:#fff}
#toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;color:#334155;text-decoration:none;font-size:.9em;margin:2px 0}
#toc a:hover{background:#F1F5F9}
#toc a.on{background:#FFF1EE;color:#C62D1A;font-weight:700}
#docScroll{flex:1;overflow:auto;padding:26px 34px 80px}
.dsec{background:#fff;border-radius:18px;padding:26px 32px;margin:0 auto 18px;max-width:1000px;box-shadow:0 4px 18px rgba(27,49,57,.06);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.dsec.seen{opacity:1;transform:none}
.dsec.herosec{padding:0;background:transparent;box-shadow:none}
.dsec .dbx>*{animation:none}
.quiz{max-width:820px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.dbx .code .copy{display:inline-block;margin-left:auto;border:1px solid #30363D;background:#21262D;color:#C9D1D9;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
.dbx .code .run+.copy{margin-left:10px}
@media (max-width:760px){.slide{padding:22px}.slide.title .hero{padding:30px 30px 160px}.slide.title .hero h1{font-size:32px}.slide.title .idea{left:16px;right:16px}#toc{display:none}.crumb{display:none}.hint{display:none}}
@media print{header,.controls,#bar,#toc{display:none}body{overflow:visible}#doc{display:block}#slides{display:none}.dsec{opacity:1;transform:none;box-shadow:none}}
</style>

<script>
function dbxQuiz(root, questions, onDone) {
  if (typeof root === 'string') root = document.getElementById(root);
  var i = 0, score = 0, picked = null, shown = false, done = false;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code style="background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px">$1</code>'); }
  function btn(label, primary) { return '<button style="margin-top:16px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-weight:700;background:' + (primary ? 'linear-gradient(135deg,#FF3621,#7C4DFF)' : '#E5E7EB') + ';color:' + (primary ? '#fff' : '#6B7280') + ';font-size:0.95em;box-shadow:' + (primary ? '0 6px 18px rgba(124,77,255,.3)' : 'none') + '">' + label + '</button>'; }
  var box = 'padding:22px 24px;border-radius:16px;background:#fff;border:1px solid #E5E7EB;box-shadow:0 8px 28px rgba(27,49,57,.08);animation:dbxQ .4s ease both';
  var style = '<style>@keyframes dbxQ{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>';
  function bar() {
    var h = '<div style="display:flex;gap:6px;margin-bottom:14px">';
    for (var k = 0; k < questions.length; k++) h += '<div style="flex:1;height:6px;border-radius:6px;background:' + (k < i ? 'linear-gradient(90deg,#FF3621,#7C4DFF)' : k === i ? '#C4B5FD' : '#E5E7EB') + '"></div>';
    return h + '</div>';
  }
  function render() {
    if (i >= questions.length) {
      var pct = Math.round(score / questions.length * 100), msg = pct === 100 ? 'Perfect! 🎉' : pct >= 60 ? 'Nice work! 💪' : 'Worth another look 📖';
      root.innerHTML = style + '<div style="' + box + ';text-align:center"><div style="font-size:48px">' + (pct === 100 ? '🏆' : pct >= 60 ? '🌟' : '🔁') + '</div><div style="font-size:1.6em;font-weight:800;color:#1B3139">' + score + ' / ' + questions.length + '</div><div style="color:#6B7280;margin-top:4px">' + msg + '</div>' + btn('Retake', true) + '</div>';
      root.querySelector('button').onclick = function () { i = 0; score = 0; picked = null; shown = false; done = false; render(); };
      if (!done && onDone) { done = true; onDone(score, questions.length); }
      return;
    }
    var Q = questions[i], h = style + '<div style="' + box + '">' + bar();
    h += '<div style="color:#7C4DFF;font-size:0.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Question ' + (i + 1) + ' of ' + questions.length + '</div>';
    h += '<div style="font-weight:700;color:#1B3139;margin-bottom:14px;line-height:1.5;font-size:1.05em">' + esc(Q.q) + '</div>';
    Q.o.forEach(function (t, k) {
      var bg = '#fff', bd = '#E5E7EB', mark = String.fromCharCode(65 + k);
      if (shown && k === Q.c) { bg = '#ECFDF3'; bd = '#22C55E'; mark = '✓'; }
      else if (shown && k === picked) { bg = '#FFF1F0'; bd = '#EF4444'; mark = '✗'; }
      else if (!shown && k === picked) { bg = '#F5F3FF'; bd = '#7C4DFF'; }
      h += '<div data-k="' + k + '" style="display:flex;gap:12px;align-items:center;padding:11px 14px;margin:8px 0;border:2px solid ' + bd + ';background:' + bg + ';border-radius:12px;cursor:' + (shown ? 'default' : 'pointer') + ';color:#1F2937;transition:all .15s">' +
        '<span style="flex:none;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;background:' + (bd === '#E5E7EB' ? '#F1F5F9' : bd) + ';color:' + (bd === '#E5E7EB' ? '#64748B' : '#fff') + '">' + mark + '</span><span>' + esc(t) + '</span></div>';
    });
    if (shown) {
      var ok = picked === Q.c;
      h += '<div style="margin-top:14px;padding:14px 16px;border-radius:12px;background:' + (ok ? '#ECFDF3' : '#FFF7ED') + ';border:1px solid ' + (ok ? '#A7F3D0' : '#FED7AA') + ';color:#1F2937;animation:dbxQ .3s both"><strong>' + (ok ? '✅ Correct.' : '💡 Not quite.') + '</strong> ' + esc(Q.e) + '</div>' + btn(i + 1 < questions.length ? 'Next →' : 'See score', true);
    } else {
      h += btn('Submit', picked !== null);
    }
    root.innerHTML = h + '</div>';
    if (!shown) root.querySelectorAll('[data-k]').forEach(function (el) { el.onclick = function () { picked = +el.getAttribute('data-k'); render(); }; });
    root.querySelector('button').onclick = function () {
      if (!shown) { if (picked === null) return; if (picked === Q.c) score++; shown = true; }
      else { i++; picked = null; shown = false; }
      render();
    };
  }
  render();
}
var SLIDES = [{"title": "Recap: DevOps Essentials for Data Engineering", "icon": "🚀", "html": "<div class=\"hero\"><div class=\"blob b1\"><\/div><div class=\"blob b2\"><\/div><div class=\"blob b3\"><\/div><div class=\"hero-in\"><div class=\"kicker\">Data Engineering with Databricks<\/div><h1><span class=\"kicker-inline\">Recap<\/span>DevOps Essentials for Data Engineering<\/h1><div class=\"chips\"><span class=\"chip\">Course 4 of 4<\/span><span class=\"chip\">⏱ ~8 minutes<\/span><\/div><p class=\"sub\">Applying software engineering practices to data work: <strong>modular code, tests, version control, and automated deployment<\/strong> across dev, test and prod.<\/p><\/div><\/div><div class=\"idea\"><span class=\"idea-icon\">💡<\/span><div><b>The one idea to remember:<\/b> treat pipelines as <strong>software<\/strong>. Logic goes in testable modules, everything lives in <strong>Git<\/strong>, and environments are promoted <strong>automatically<\/strong>. Nobody copies notebooks by hand.<\/div><\/div>"}, {"title": "What we covered", "icon": "🗺️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">01<\/span><span class=\"sec-icon\">🗺️<\/span><h2>What we covered<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Key takeaway<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Software engineering &amp; DevOps<\/td>\n<td>Why data teams need versioning, testing, automation and environments<\/td>\n<\/tr>\n<tr>\n<td>CI/CD fundamentals<\/td>\n<td><strong>Continuous integration<\/strong> (merge often, test automatically) and <strong>continuous deployment<\/strong> (release automatically)<\/td>\n<\/tr>\n<tr>\n<td>Modularizing code<\/td>\n<td>Business logic in <strong>functions and modules<\/strong>, notebooks as thin entry points<\/td>\n<\/tr>\n<tr>\n<td>Unit testing<\/td>\n<td><strong>pytest<\/strong> + PySpark testing utilities on small DataFrames<\/td>\n<\/tr>\n<tr>\n<td>Integration testing<\/td>\n<td>Run the real pipeline or job on test data and check the outputs<\/td>\n<\/tr>\n<tr>\n<td>Version control<\/td>\n<td><strong>Databricks Git folders<\/strong>: branch, commit, push, pull, pull request<\/td>\n<\/tr>\n<tr>\n<td>Deploying assets<\/td>\n<td>UI, REST API, SDK, CLI, and <strong>bundles<\/strong>. Automate the deployment in CI<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "DevOps and CI/CD in one picture", "icon": "🚀", "html": "<div class=\"sec-head\"><span class=\"sec-num\">02<\/span><span class=\"sec-icon\">🚀<\/span><h2>DevOps and CI/CD in one picture<\/h2><\/div><pre class=\"diagram\"> feature branch ──► Pull request ──► CI: lint · unit tests · validate · deploy to TEST · integration tests\n                                        │\n merge to main  ──────────────────────► CD: deploy the SAME code to PROD (service principal)<\/pre>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Environment<\/th>\n<th>Purpose<\/th>\n<th>Typical isolation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Dev<\/strong><\/td>\n<td>Each developer experiments safely<\/td>\n<td>Personal schema / catalog, dev workspace<\/td>\n<\/tr>\n<tr>\n<td><strong>Test / Staging<\/strong><\/td>\n<td>Automated tests on realistic data<\/td>\n<td>Separate catalog or workspace<\/td>\n<\/tr>\n<tr>\n<td><strong>Prod<\/strong><\/td>\n<td>Business-facing workloads<\/td>\n<td>Separate workspace, runs as a <strong>service principal<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Code and configuration are the <strong>same<\/strong> everywhere. Only <strong>parameters<\/strong> (catalog, paths, schedules) differ per environment.<\/p>"}, {"title": "Modular code", "icon": "🧱", "html": "<div class=\"sec-head\"><span class=\"sec-num\">03<\/span><span class=\"sec-icon\">🧱<\/span><h2>Modular code<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># src/transforms.py: pure functions, easy to test<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark.sql<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">DataFrame,<\/span> <span style=\"color: #E6EDF3\">functions<\/span> <span style=\"color: #FF7B72\">as<\/span> <span style=\"color: #E6EDF3\">F<\/span>\n\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">clean_orders<\/span><span style=\"color: #E6EDF3\">(df:<\/span> <span style=\"color: #E6EDF3\">DataFrame)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">-&gt;<\/span> <span style=\"color: #E6EDF3\">DataFrame:<\/span>\n    <span style=\"color: #FF7B72\">return<\/span> <span style=\"color: #E6EDF3\">(df<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">filter(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">col(<\/span><span style=\"color: #A5D6FF\">\"amount\"<\/span><span style=\"color: #E6EDF3\">)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">&gt;<\/span> <span style=\"color: #A5D6FF\">0<\/span><span style=\"color: #E6EDF3\">)<\/span>\n              <span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">withColumn(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lower(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">trim(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">))))<\/span>\n\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">add_net_amount<\/span><span style=\"color: #E6EDF3\">(df:<\/span> <span style=\"color: #E6EDF3\">DataFrame,<\/span> <span style=\"color: #E6EDF3\">vat:<\/span> <span style=\"color: #E6EDF3\">float)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">-&gt;<\/span> <span style=\"color: #E6EDF3\">DataFrame:<\/span>\n    <span style=\"color: #FF7B72\">return<\/span> <span style=\"color: #E6EDF3\">df<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">withColumn(<\/span><span style=\"color: #A5D6FF\">\"net_amount\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">round(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">col(<\/span><span style=\"color: #A5D6FF\">\"amount\"<\/span><span style=\"color: #E6EDF3\">)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">/<\/span> <span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">1<\/span> <span style=\"color: #FF7B72; font-weight: bold\">+<\/span> <span style=\"color: #E6EDF3\">vat),<\/span> <span style=\"color: #A5D6FF\">2<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># notebook / job task: thin entry point<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">transforms<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">clean_orders,<\/span> <span style=\"color: #E6EDF3\">add_net_amount<\/span>\n\n<span style=\"color: #E6EDF3\">catalog<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">dbutils<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">widgets<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">get(<\/span><span style=\"color: #A5D6FF\">\"catalog\"<\/span><span style=\"color: #E6EDF3\">)<\/span>                <span style=\"color: #8B949E; font-style: italic\"># environment comes from a parameter<\/span>\n<span style=\"color: #E6EDF3\">raw<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">read<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">table(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"{<\/span><span style=\"color: #E6EDF3\">catalog<\/span><span style=\"color: #A5D6FF\">}.bronze.orders\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">(raw<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">transform(clean_orders)<\/span>\n    <span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">transform(add_net_amount,<\/span> <span style=\"color: #E6EDF3\">vat<\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #A5D6FF\">0.27<\/span><span style=\"color: #E6EDF3\">)<\/span>\n    <span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">write<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">mode(<\/span><span style=\"color: #A5D6FF\">\"overwrite\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">saveAsTable(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"{<\/span><span style=\"color: #E6EDF3\">catalog<\/span><span style=\"color: #A5D6FF\">}.silver.orders\"<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<ul>\n<li>Functions take a DataFrame and return a DataFrame, and chain with <code>.transform()<\/code>.<\/li>\n<li><strong>No hard-coded<\/strong> catalogs, paths or credentials. Use parameters and <strong>secrets<\/strong>.<\/li>\n<li>Notebooks can import <code>.py<\/code> files from the same Git folder (workspace files).<\/li>\n<\/ul>"}, {"title": "Unit tests with pytest", "icon": "🧪", "html": "<div class=\"sec-head\"><span class=\"sec-num\">04<\/span><span class=\"sec-icon\">🧪<\/span><h2>Unit tests with pytest<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># tests/test_transforms.py<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark.testing<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">assertDataFrameEqual<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">transforms<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">clean_orders<\/span>\n\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">test_clean_orders_removes_negative_and_normalizes_email<\/span><span style=\"color: #E6EDF3\">(spark):<\/span>\n    <span style=\"color: #E6EDF3\">src<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">createDataFrame([(<\/span><span style=\"color: #A5D6FF\">1<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">10.0<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\" A@X.COM \"<\/span><span style=\"color: #E6EDF3\">),<\/span> <span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">2<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #FF7B72; font-weight: bold\">-<\/span><span style=\"color: #A5D6FF\">5.0<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"b@x.com\"<\/span><span style=\"color: #E6EDF3\">)],<\/span>\n                                <span style=\"color: #A5D6FF\">\"id INT, amount DOUBLE, email STRING\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n    <span style=\"color: #E6EDF3\">expected<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">createDataFrame([(<\/span><span style=\"color: #A5D6FF\">1<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">10.0<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"a@x.com\"<\/span><span style=\"color: #E6EDF3\">)],<\/span>\n                                     <span style=\"color: #A5D6FF\">\"id INT, amount DOUBLE, email STRING\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n    <span style=\"color: #E6EDF3\">assertDataFrameEqual(clean_orders(src),<\/span> <span style=\"color: #E6EDF3\">expected)<\/span><\/pre><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Test level<\/th>\n<th>What it checks<\/th>\n<th>Where it runs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Unit<\/strong><\/td>\n<td>A single function on tiny in-memory data<\/td>\n<td>pytest locally (Databricks Connect) or in a notebook, and in <strong>CI<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Integration<\/strong><\/td>\n<td>The deployed job or pipeline end-to-end on <strong>test data<\/strong><\/td>\n<td>Test/staging environment, after deployment<\/td>\n<\/tr>\n<tr>\n<td><strong>Data quality<\/strong><\/td>\n<td>Rules on real data: expectations, constraints, row-count checks<\/td>\n<td>In the pipeline, every run<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><code>assertDataFrameEqual<\/code> compares schema and rows (order-insensitive by default). <code>assertSchemaEqual<\/code> compares only the schema.<\/li>\n<li>Don't compare DataFrames with <code>collect() == collect()<\/code>, because it is order-sensitive and ignores the schema.<\/li>\n<\/ul>"}, {"title": "Version control with Git folders", "icon": "🌿", "html": "<div class=\"sec-head\"><span class=\"sec-num\">05<\/span><span class=\"sec-icon\">🌿<\/span><h2>Version control with Git folders<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>In Databricks<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Clone a repo<\/td>\n<td><em>Workspace → Create → <\/em><em>Git folder<\/em>** → repository URL<\/td>\n<\/tr>\n<tr>\n<td>Create / switch branch<\/td>\n<td>Git dialog (click the branch name)<\/td>\n<\/tr>\n<tr>\n<td>Commit &amp; push<\/td>\n<td>Git dialog → select changes → message → <strong>Commit &amp; Push<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Get others' changes<\/td>\n<td><strong>Pull<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Review &amp; merge<\/td>\n<td><strong>Pull request<\/strong> in the Git provider (GitHub, Azure DevOps, GitLab…)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>One Git folder <strong>per developer<\/strong>, with short-lived <strong>feature branches<\/strong>. Never develop on <code>main<\/code>.<\/li>\n<li>Notebooks are stored as source files (<code>.py<\/code> / <code>.sql<\/code>), so diffs and code reviews work.<\/li>\n<li>Production should <strong>not<\/strong> run from someone's personal Git folder.<\/li>\n<\/ul>"}, {"title": "Deploying Databricks assets", "icon": "🚀", "html": "<div class=\"sec-head\"><span class=\"sec-num\">06<\/span><span class=\"sec-icon\">🚀<\/span><h2>Deploying Databricks assets<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Good for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>UI<\/strong><\/td>\n<td>Learning and one-offs. Not repeatable<\/td>\n<\/tr>\n<tr>\n<td><strong>REST API / Python SDK<\/strong><\/td>\n<td>Custom automation and scripts<\/td>\n<\/tr>\n<tr>\n<td><strong>Databricks CLI<\/strong><\/td>\n<td>Scripting from a terminal or CI runner<\/td>\n<\/tr>\n<tr>\n<td><strong>Bundles<\/strong> (Declarative Automation Bundles, formerly <em>Databricks Asset Bundles<\/em>)<\/td>\n<td><strong>Recommended<\/strong>: jobs, pipelines and code described as YAML and deployed per target<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># databricks.yml (minimal)<\/span>\n<span style=\"color: #7EE787\">bundle<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">orders_etl<\/span>\n<span style=\"color: #7EE787\">include<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">resources/*.yml<\/span>\n<span style=\"color: #7EE787\">targets<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">dev<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">mode<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">development<\/span><span style=\"color: #6E7681\">     <\/span><span style=\"color: #8B949E; font-style: italic\"># names prefixed \"[dev user]\", schedules paused<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">default<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">true<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">prod<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">mode<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">production<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">workspace<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">host<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">https://prod.cloud.databricks.com<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">BASH<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre>databricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>validate<span style=\"color: #6E7681\"> <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev\ndatabricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>deploy<span style=\"color: #6E7681\">   <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev\ndatabricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>run<span style=\"color: #6E7681\">      <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev<span style=\"color: #6E7681\"> <\/span>orders_job<\/pre><\/div>\n<blockquote class=\"callout\">\n<p>Bundles are covered in depth in the advanced course <em>Automated Deployment with Databricks Asset Bundles<\/em>.<\/p>\n<\/blockquote>"}, {"title": "Try it: write and test a transformation", "icon": "🧪", "html": "<div class=\"sec-head\"><span class=\"sec-num\">07<\/span><span class=\"sec-icon\">🧪<\/span><h2>Try it: write and test a transformation<\/h2><\/div><blockquote class=\"callout\">\n<p>Runs on in-memory DataFrames, so no data or schema is needed.<\/p>\n<\/blockquote>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Modular, testable transformations: DataFrame in, DataFrame out<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark.sql<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">DataFrame,<\/span> <span style=\"color: #E6EDF3\">Row,<\/span> <span style=\"color: #E6EDF3\">functions<\/span> <span style=\"color: #FF7B72\">as<\/span> <span style=\"color: #E6EDF3\">F<\/span>\n\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">clean_orders<\/span><span style=\"color: #E6EDF3\">(df:<\/span> <span style=\"color: #E6EDF3\">DataFrame)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">-&gt;<\/span> <span style=\"color: #E6EDF3\">DataFrame:<\/span>\n    <span style=\"color: #FF7B72\">return<\/span> <span style=\"color: #E6EDF3\">df<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">filter(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">col(<\/span><span style=\"color: #A5D6FF\">\"amount\"<\/span><span style=\"color: #E6EDF3\">)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">&gt;<\/span> <span style=\"color: #A5D6FF\">0<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">withColumn(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lower(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">trim(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">)))<\/span>\n\n<span style=\"color: #FF7B72\">def<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #D2A8FF; font-weight: bold\">add_net_amount<\/span><span style=\"color: #E6EDF3\">(df:<\/span> <span style=\"color: #E6EDF3\">DataFrame,<\/span> <span style=\"color: #E6EDF3\">vat:<\/span> <span style=\"color: #E6EDF3\">float)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">-&gt;<\/span> <span style=\"color: #E6EDF3\">DataFrame:<\/span>\n    <span style=\"color: #FF7B72\">return<\/span> <span style=\"color: #E6EDF3\">df<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">withColumn(<\/span><span style=\"color: #A5D6FF\">\"net_amount\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">round(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">col(<\/span><span style=\"color: #A5D6FF\">\"amount\"<\/span><span style=\"color: #E6EDF3\">)<\/span> <span style=\"color: #FF7B72; font-weight: bold\">/<\/span> <span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">1<\/span> <span style=\"color: #FF7B72; font-weight: bold\">+<\/span> <span style=\"color: #E6EDF3\">vat),<\/span> <span style=\"color: #A5D6FF\">2<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Unit tests with pyspark.testing. They pass silently<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark.testing<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">assertDataFrameEqual<\/span>\n\n<span style=\"color: #E6EDF3\">src<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">createDataFrame([(<\/span><span style=\"color: #A5D6FF\">1<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">10.0<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\" A@X.COM \"<\/span><span style=\"color: #E6EDF3\">),<\/span> <span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">2<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #FF7B72; font-weight: bold\">-<\/span><span style=\"color: #A5D6FF\">5.0<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"b@x.com\"<\/span><span style=\"color: #E6EDF3\">)],<\/span> <span style=\"color: #A5D6FF\">\"id INT, amount DOUBLE, email STRING\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">expected<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">createDataFrame([(<\/span><span style=\"color: #A5D6FF\">1<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">10.0<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"a@x.com\"<\/span><span style=\"color: #E6EDF3\">)],<\/span> <span style=\"color: #A5D6FF\">\"id INT, amount DOUBLE, email STRING\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n\n<span style=\"color: #E6EDF3\">assertDataFrameEqual(clean_orders(src),<\/span> <span style=\"color: #E6EDF3\">expected)<\/span>\n<span style=\"color: #E6EDF3\">assertDataFrameEqual(src<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">transform(clean_orders)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">transform(add_net_amount,<\/span> <span style=\"color: #E6EDF3\">vat<\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #A5D6FF\">0.25<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">select(<\/span><span style=\"color: #A5D6FF\">\"net_amount\"<\/span><span style=\"color: #E6EDF3\">),<\/span>\n                     <span style=\"color: #E6EDF3\">[Row(net_amount<\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #A5D6FF\">8.0<\/span><span style=\"color: #E6EDF3\">)])<\/span>\n<span style=\"color: #E6EDF3\">print(<\/span><span style=\"color: #A5D6FF\">\"✅ all tests passed\"<\/span><span style=\"color: #E6EDF3\">)<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># A failing test shows exactly which rows differ<\/span>\n<span style=\"color: #FF7B72\">try<\/span><span style=\"color: #E6EDF3\">:<\/span>\n    <span style=\"color: #E6EDF3\">assertDataFrameEqual(clean_orders(src),<\/span>\n                         <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">createDataFrame([(<\/span><span style=\"color: #A5D6FF\">1<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">10.0<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"A@X.COM\"<\/span><span style=\"color: #E6EDF3\">)],<\/span> <span style=\"color: #A5D6FF\">\"id INT, amount DOUBLE, email STRING\"<\/span><span style=\"color: #E6EDF3\">))<\/span>\n<span style=\"color: #FF7B72\">except<\/span> <span style=\"color: #F0883E; font-weight: bold\">AssertionError<\/span> <span style=\"color: #FF7B72\">as<\/span> <span style=\"color: #E6EDF3\">e:<\/span>\n    <span style=\"color: #E6EDF3\">print(<\/span><span style=\"color: #A5D6FF\">\"❌ test failed (as expected):<\/span><span style=\"color: #79C0FF\">\\n<\/span><span style=\"color: #A5D6FF\">\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">str(e)[:<\/span><span style=\"color: #A5D6FF\">900<\/span><span style=\"color: #E6EDF3\">])<\/span><\/pre><\/div>\n<blockquote class=\"callout\">\n<p>In a real project these functions live in <code>src/<\/code>, the tests in <code>tests/test_*.py<\/code>, and CI runs <code>pytest<\/code> on every pull request.<\/p>\n<\/blockquote>"}, {"title": "Decision cheat sheet", "icon": "🧭", "html": "<div class=\"sec-head\"><span class=\"sec-num\">08<\/span><span class=\"sec-icon\">🧭<\/span><h2>Decision cheat sheet<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Choose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Verify a transformation function is correct<\/td>\n<td><strong>Unit test<\/strong> with <code>assertDataFrameEqual<\/code><\/td>\n<\/tr>\n<tr>\n<td>Verify the deployed job works with the real platform<\/td>\n<td><strong>Integration test<\/strong> in a test environment<\/td>\n<\/tr>\n<tr>\n<td>Two engineers changing the same pipeline<\/td>\n<td><strong>Feature branches<\/strong> + <strong>pull requests<\/strong><\/td>\n<\/tr>\n<tr>\n<td>The same job in dev, test and prod with different catalogs<\/td>\n<td><strong>Parameters<\/strong> / bundle <strong>variables<\/strong> per target<\/td>\n<\/tr>\n<tr>\n<td>Repeatable deployment from CI<\/td>\n<td><strong>Bundles<\/strong> + <strong>Databricks CLI<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Who runs production jobs?<\/td>\n<td>A <strong>service principal<\/strong>, not a person<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Common mistakes", "icon": "⚠️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">09<\/span><span class=\"sec-icon\">⚠️<\/span><h2>Common mistakes<\/h2><\/div><ul>\n<li class=\"bad\">❌ All logic inside notebooks, \"tested\" by running them by hand.<\/li>\n<li class=\"bad\">❌ Copying notebooks between workspaces manually to promote code.<\/li>\n<li class=\"bad\">❌ Hard-coded <code>prod<\/code> catalog names or passwords in code.<\/li>\n<li class=\"bad\">❌ Working directly on <code>main<\/code> in a shared Git folder.<\/li>\n<li class=\"bad\">❌ Personal access tokens of a human user in CI. Use a <strong>service principal<\/strong> with OAuth.<\/li>\n<\/ul>\n<p><strong>You finished the Data Engineering path.<\/strong> Next up: <em>Advanced Data Engineering with Databricks<\/em>.<\/p>"}];
var QUIZ = [{"q": "What is the main purpose of continuous integration (CI) for a data engineering team?", "o": ["Deploy every commit to production immediately", "Merge changes frequently and validate them automatically with tests", "Back up notebooks every night", "Run all jobs continuously"], "c": 1, "e": "CI means integrating changes often and running automated checks (lint, unit tests, validation) on every change. Continuous deployment then releases the validated code."}, {"q": "Which is the best way to make a PySpark transformation unit-testable?", "o": ["Keep it in one long notebook cell", "Write it as a function that takes and returns a DataFrame, in a separate module", "Read the source table inside the function using a hard-coded name", "Test it by running the production job"], "c": 1, "e": "Pure DataFrame-in, DataFrame-out functions in modules can be imported by notebooks and jobs, and tested on small in-memory data with pytest."}, {"q": "Which utility compares two DataFrames for both schema and rows in a unit test, ignoring row order by default?", "o": ["`df1.collect() == df2.collect()`", "`assertDataFrameEqual(actual, expected)`", "`df1.exceptAll(df2).count() == 0`", "`assertSchemaEqual(actual, expected)`"], "c": 1, "e": "pyspark.testing.assertDataFrameEqual checks schema and data, ignoring row order by default. assertSchemaEqual checks only the schema."}, {"q": "Two engineers change the same pipeline at the same time. Which workflow keeps this safe?", "o": ["Both edit the same shared Git folder on main", "Each works on a feature branch in their own Git folder and merges through a pull request", "One exports the notebook as DBC and emails it", "Use notebook revision history to undo conflicts"], "c": 1, "e": "Feature branches in personal Git folders and reviewed pull requests isolate changes and make conflicts visible before merging."}, {"q": "The same job must be deployed to dev, test and prod with a different catalog in each. What is the recommended approach?", "o": ["Create the job by hand in each workspace", "Copy the job JSON and edit it per environment", "Define it once in a bundle and use targets with variables", "Hard-code the catalog and change it before each deployment"], "c": 2, "e": "A bundle describes the job once. Targets and variables supply the environment-specific values, and `databricks bundle deploy -t <target>` promotes it."}];

      var sec = document.createElement('div'); sec.className = 'dsec' + (i === 0 ? ' herosec' : ''); sec.id = 'sec-' + i;
      sec.innerHTML = '<div class="dbx">' + s.html + '</div>'; sc.appendChild(sec); wireCopy(sec);
      if (s.quiz) mountQuiz(sec.querySelector('.quiz'));
      var a = document.createElement('a'); a.href = '#sec-' + i; a.innerHTML = '<span>' + s.icon + '</span><span>' + (i === 0 ? 'Overview' : s.title) + '</span>';
      a.onclick = function (e) { e.preventDefault(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; toc.appendChild(a);
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) en.target.classList.add('seen'); }); }, { root: sc, threshold: .05 });
      sc.querySelectorAll('.dsec').forEach(function (s) { io.observe(s); });
    } else sc.querySelectorAll('.dsec').forEach(function (s) { s.classList.add('seen'); });
    sc.addEventListener('scroll', function () {
      var cur = 0;
      sc.querySelectorAll('.dsec').forEach(function (s, i) { if (s.offsetTop - sc.scrollTop < 140) cur = i; });
      toc.querySelectorAll('a').forEach(function (a, i) { a.classList.toggle('on', i === cur); });
      $('bar').style.width = (sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight) * 100) + '%';
    });
  }
  function mode(m) {
    var doc = m === 'doc'; document.body.classList.toggle('docmode', doc);
    $('bDoc').classList.toggle('on', doc); $('bSlides').classList.toggle('on', !doc);
    if (doc) { buildDoc(); $('docScroll').dispatchEvent(new Event('scroll')); } else go(idx, 1);
  }
  $('bDoc').onclick = function () { mode('doc'); };
  $('bSlides').onclick = function () { mode('slides'); };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key, doc = document.body.classList.contains('docmode');
    if (k === 'd' || k === 'D') return mode('doc');
    if (k === 'p' || k === 'P') return mode('slides');
    if (doc) return;
    if (k === 'o' || k === 'O') return overview();
    if (k === 'Escape') return overview(false);
    if (k === 'f' || k === 'F') return $('bFull').click();
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(idx + 1, 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(idx - 1, -1); }
    else if (k === 'Home') go(0, -1); else if (k === 'End') go(SLIDES.length - 1, 1);
  });
  var m = location.hash.match(/^#slide-(\d+)/); if (m) idx = parseInt(m[1], 10) - 1;
  if (location.hash === '#doc') mode('doc'); else go(idx, 1);
})();
</script>
