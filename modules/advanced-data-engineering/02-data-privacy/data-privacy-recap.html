<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap 2: Databricks Data Privacy · dbxhelp</title>
<style>
.dbx{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--teal:#00A3A1;--purple:#7C4DFF;--amber:#FFAB00;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.6;max-width:1100px}
.dbx *{box-sizing:border-box}
.dbx>*{animation:dbxRise .55s cubic-bezier(.2,.7,.2,1) both}
.dbx>*:nth-child(2){animation-delay:.06s}.dbx>*:nth-child(3){animation-delay:.12s}.dbx>*:nth-child(4){animation-delay:.18s}.dbx>*:nth-child(5){animation-delay:.24s}.dbx>*:nth-child(6){animation-delay:.3s}.dbx>*:nth-child(n+7){animation-delay:.36s}
@keyframes dbxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dbxGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes dbxFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@keyframes dbxLine{from{width:0}to{width:100%}}
@keyframes dbxPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,54,33,.25)}50%{box-shadow:0 0 0 8px rgba(255,54,33,0)}}
.dbx .hero{position:relative;overflow:hidden;border-radius:18px;padding:38px 40px 34px;margin:4px 0 18px;color:#fff;background:linear-gradient(120deg,#1B3139,#22425a,#2a2f6b,#1B3139);background-size:300% 300%;animation:dbxGrad 14s ease infinite,dbxRise .6s both}
.dbx .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:dbxFloat 9s ease-in-out infinite}
.dbx .b1{width:220px;height:220px;background:#FF3621;right:-40px;top:-60px}
.dbx .b2{width:180px;height:180px;background:#7C4DFF;right:160px;bottom:-90px;animation-delay:-3s}
.dbx .b3{width:140px;height:140px;background:#00A3A1;left:-40px;bottom:-50px;animation-delay:-6s}
.dbx .hero-in{position:relative}
.dbx .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#FFC4BA;font-weight:700}
.dbx .hero h1{font-size:34px;line-height:1.15;margin:8px 0 14px;color:#fff;font-weight:800}
.dbx .kicker-inline{display:inline-block;font-size:.5em;vertical-align:middle;background:var(--accent);padding:4px 10px;border-radius:999px;margin-right:10px;letter-spacing:.08em;text-transform:uppercase}
.dbx .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dbx .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px;color:#fff}
.dbx .chip strong{color:#fff}
.dbx .sub{color:#E2E8F0;font-size:16px;margin:0;max-width:820px}
.dbx .sub strong,.dbx .sub b{color:#FFD7CF}
.dbx .sub code{background:rgba(255,255,255,.16);color:#fff}
.dbx .idea{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFF4F1,#FFF);border:1px solid #FFD0C7;border-left:5px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;animation:dbxRise .55s both,dbxPulse 3s ease-in-out 1s 2}
.dbx .idea-icon{font-size:26px;line-height:1}
.dbx .idea b{color:#C62D1A}
.dbx .sec-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;position:relative;padding-bottom:10px}
.dbx .sec-head:after{content:"";position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));animation:dbxLine .9s ease-out both}
.dbx .sec-num{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7a59);padding:5px 10px;border-radius:9px;letter-spacing:.05em}
.dbx .sec-icon{font-size:26px;line-height:1}
.dbx .sec-head h2{margin:0;font-size:25px;color:var(--navy);font-weight:800;border:0}
.dbx h3{color:var(--navy);margin:18px 0 8px}
.dbx p{margin:8px 0}
.dbx a{color:var(--blue)}
.dbx code{background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(27,49,57,.06);margin:12px 0;background:#fff}
.dbx table{border-collapse:collapse;width:100%;font-size:14px}
.dbx th{background:linear-gradient(135deg,#1B3139,#2B4F63);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
.dbx td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.dbx tr:nth-child(even) td{background:#F8FAFC}
.dbx tr:hover td{background:#FFF4F1}
.dbx td:first-child{font-weight:600;color:var(--navy)}
.dbx ul,.dbx ol{padding-left:22px;margin:8px 0}
.dbx li{margin:5px 0}
.dbx li::marker{color:var(--accent)}
.dbx li.bad,.dbx li.good{list-style:none;margin:8px 0 8px -22px;padding:10px 14px;border-radius:10px}
.dbx li.bad{background:#FFF1F0;border:1px solid #FFCDC7}
.dbx li.good{background:#ECFDF3;border:1px solid #B7EBC9}
.dbx blockquote.callout{margin:14px 0;padding:12px 16px 12px 46px;border-radius:12px;background:linear-gradient(135deg,#E8F1FF,#F5F9FF);border:1px solid #C7DBFF;position:relative;color:#1E3A5F}
.dbx blockquote.callout:before{content:"ℹ️";position:absolute;left:14px;top:11px;font-size:18px}
.dbx blockquote.callout p{margin:4px 0}
.dbx .code{border-radius:12px;overflow:hidden;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.18);background:#0D1117}
.dbx .code-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161B22;border-bottom:1px solid #30363D}
.dbx .code-bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57;display:inline-block}
.dbx .code-bar i:nth-child(2){background:#FEBC2E}.dbx .code-bar i:nth-child(3){background:#28C840}
.dbx .lang{margin-left:8px;color:#8B949E;font-size:11px;letter-spacing:.1em;font-weight:700}
.dbx .run{margin-left:auto;color:#3FB950;font-size:11px;font-weight:700}
.dbx .copy{display:none}
.dbx .code pre{margin:0;padding:14px 16px;color:#E6EDF3;font-size:13px;line-height:1.55;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:transparent}
.dbx pre.diagram{background:linear-gradient(135deg,#F8FAFC,#EEF2FF);border:1px dashed #A5B4FC;border-radius:12px;padding:14px 16px;font-size:13px;color:#312E81;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tryit{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ECFDF3,#F0FDFA);border:1px solid #A7F3D0;border-radius:12px;padding:12px 16px;margin:12px 0}
.dbx .tryit b{color:#047857}
.dbx .present{display:flex;gap:16px;align-items:center;border-radius:14px;padding:16px 20px;background:linear-gradient(120deg,#2a2f6b,#7C4DFF);color:#fff;box-shadow:0 10px 30px rgba(124,77,255,.3)}
.dbx .present b{font-size:17px}
.dbx .present span{color:#E9E5FF}
.dbx .present .big{font-size:34px}
.dbx .footer{margin-top:10px;padding:14px 18px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);color:var(--muted);font-size:13px}
:root{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--purple:#7C4DFF;--teal:#00A3A1;--bg:#F4F2EE;--muted:#6B7280;--line:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1F2937;overflow:hidden}
body.embedded{height:760px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--navy);color:#fff;flex:none;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}
.crumb{color:#94A3B8;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}

.hbtn:hover{background:rgba(255,255,255,.1)}
#bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));width:0;transition:width .35s ease;flex:none}
#slides{flex:1;display:flex;flex-direction:column;min-height:0;padding:18px 22px 10px;position:relative}
.stage{flex:1;position:relative;min-height:0;perspective:1400px}
.slide{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(27,49,57,.14);overflow:auto;padding:34px 52px 40px}
.slide.enter-r{animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-l{animation:inL .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px) rotateY(-6deg)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) rotateY(6deg)}to{opacity:1;transform:none}}
.slide .dbx{max-width:none;font-size:18px}
.slide .dbx .sec-head h2{font-size:32px}
.slide .dbx table{font-size:16px}
.slide .dbx .code pre{font-size:14.5px}
.slide .dbx>*{animation:dbxRise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
.slide.title{padding:0;overflow:hidden;background:transparent;box-shadow:0 18px 50px rgba(27,49,57,.25)}
.slide.title .dbx{height:100%;display:flex;flex-direction:column;position:relative}
.slide.title .hero{flex:1;margin:0;border-radius:20px;display:flex;align-items:center;padding:60px 70px 150px}
.slide.title .hero h1{font-size:54px}
.slide.title .sub{font-size:20px}
.slide.title .b1{width:420px;height:420px}.slide.title .b2{width:340px;height:340px}.slide.title .b3{width:300px;height:300px}
.slide.title .idea{position:absolute;left:70px;right:70px;bottom:40px;font-size:18px;background:rgba(255,255,255,.96)}
.slide.title .dbx>:not(.hero):not(.idea){display:none}
.controls{display:flex;align-items:center;gap:12px;padding-top:12px;flex:none}
.controls .nav{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:16px}
.controls .nav:hover{border-color:var(--accent);color:var(--accent)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#CBD5E1;cursor:pointer;padding:0;transition:all .25s}
.dots button.on{background:var(--accent);width:28px;border-radius:6px}
.count{color:var(--muted);font-size:.85em;min-width:60px;text-align:right}
.hint{color:#94A3B8;font-size:.78em;white-space:nowrap}
#overview{position:absolute;inset:0;background:rgba(244,242,238,.97);z-index:4;display:none;overflow:auto;padding:26px}
#overview.on{display:block;animation:dbxRise .3s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:all .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .n{font-size:.75em;color:var(--muted);font-weight:700}
.card .i{font-size:28px;margin:6px 0}
.card .t{font-weight:700;color:var(--navy)}
#doc{flex:1;display:none;min-height:0}
body.docmode #slides{display:none}
body.docmode #doc{display:flex}
#toc{width:270px;flex:none;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:#fff}
#toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;color:#334155;text-decoration:none;font-size:.9em;margin:2px 0}
#toc a:hover{background:#F1F5F9}
#toc a.on{background:#FFF1EE;color:#C62D1A;font-weight:700}
#docScroll{flex:1;overflow:auto;padding:26px 34px 80px}
.dsec{background:#fff;border-radius:18px;padding:26px 32px;margin:0 auto 18px;max-width:1000px;box-shadow:0 4px 18px rgba(27,49,57,.06);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.dsec.seen{opacity:1;transform:none}
.dsec.herosec{padding:0;background:transparent;box-shadow:none}
.dsec .dbx>*{animation:none}
.quiz{max-width:820px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.dbx .code .copy{display:inline-block;margin-left:auto;border:1px solid #30363D;background:#21262D;color:#C9D1D9;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
.dbx .code .run+.copy{margin-left:10px}
@media (max-width:760px){.slide{padding:22px}.slide.title .hero{padding:30px 30px 160px}.slide.title .hero h1{font-size:32px}.slide.title .idea{left:16px;right:16px}#toc{display:none}.crumb{display:none}.hint{display:none}}
@media print{header,.controls,#bar,#toc{display:none}body{overflow:visible}#doc{display:block}#slides{display:none}.dsec{opacity:1;transform:none;box-shadow:none}}
</style>

<script>
function dbxQuiz(root, questions, onDone) {
  if (typeof root === 'string') root = document.getElementById(root);
  var i = 0, score = 0, picked = null, shown = false, done = false;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code style="background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px">$1</code>'); }
  function btn(label, primary) { return '<button style="margin-top:16px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-weight:700;background:' + (primary ? 'linear-gradient(135deg,#FF3621,#7C4DFF)' : '#E5E7EB') + ';color:' + (primary ? '#fff' : '#6B7280') + ';font-size:0.95em;box-shadow:' + (primary ? '0 6px 18px rgba(124,77,255,.3)' : 'none') + '">' + label + '</button>'; }
  var box = 'padding:22px 24px;border-radius:16px;background:#fff;border:1px solid #E5E7EB;box-shadow:0 8px 28px rgba(27,49,57,.08);animation:dbxQ .4s ease both';
  var style = '<style>@keyframes dbxQ{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>';
  function bar() {
    var h = '<div style="display:flex;gap:6px;margin-bottom:14px">';
    for (var k = 0; k < questions.length; k++) h += '<div style="flex:1;height:6px;border-radius:6px;background:' + (k < i ? 'linear-gradient(90deg,#FF3621,#7C4DFF)' : k === i ? '#C4B5FD' : '#E5E7EB') + '"></div>';
    return h + '</div>';
  }
  function render() {
    if (i >= questions.length) {
      var pct = Math.round(score / questions.length * 100), msg = pct === 100 ? 'Perfect! 🎉' : pct >= 60 ? 'Nice work! 💪' : 'Worth another look 📖';
      root.innerHTML = style + '<div style="' + box + ';text-align:center"><div style="font-size:48px">' + (pct === 100 ? '🏆' : pct >= 60 ? '🌟' : '🔁') + '</div><div style="font-size:1.6em;font-weight:800;color:#1B3139">' + score + ' / ' + questions.length + '</div><div style="color:#6B7280;margin-top:4px">' + msg + '</div>' + btn('Retake', true) + '</div>';
      root.querySelector('button').onclick = function () { i = 0; score = 0; picked = null; shown = false; done = false; render(); };
      if (!done && onDone) { done = true; onDone(score, questions.length); }
      return;
    }
    var Q = questions[i], h = style + '<div style="' + box + '">' + bar();
    h += '<div style="color:#7C4DFF;font-size:0.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Question ' + (i + 1) + ' of ' + questions.length + '</div>';
    h += '<div style="font-weight:700;color:#1B3139;margin-bottom:14px;line-height:1.5;font-size:1.05em">' + esc(Q.q) + '</div>';
    Q.o.forEach(function (t, k) {
      var bg = '#fff', bd = '#E5E7EB', mark = String.fromCharCode(65 + k);
      if (shown && k === Q.c) { bg = '#ECFDF3'; bd = '#22C55E'; mark = '✓'; }
      else if (shown && k === picked) { bg = '#FFF1F0'; bd = '#EF4444'; mark = '✗'; }
      else if (!shown && k === picked) { bg = '#F5F3FF'; bd = '#7C4DFF'; }
      h += '<div data-k="' + k + '" style="display:flex;gap:12px;align-items:center;padding:11px 14px;margin:8px 0;border:2px solid ' + bd + ';background:' + bg + ';border-radius:12px;cursor:' + (shown ? 'default' : 'pointer') + ';color:#1F2937;transition:all .15s">' +
        '<span style="flex:none;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;background:' + (bd === '#E5E7EB' ? '#F1F5F9' : bd) + ';color:' + (bd === '#E5E7EB' ? '#64748B' : '#fff') + '">' + mark + '</span><span>' + esc(t) + '</span></div>';
    });
    if (shown) {
      var ok = picked === Q.c;
      h += '<div style="margin-top:14px;padding:14px 16px;border-radius:12px;background:' + (ok ? '#ECFDF3' : '#FFF7ED') + ';border:1px solid ' + (ok ? '#A7F3D0' : '#FED7AA') + ';color:#1F2937;animation:dbxQ .3s both"><strong>' + (ok ? '✅ Correct.' : '💡 Not quite.') + '</strong> ' + esc(Q.e) + '</div>' + btn(i + 1 < questions.length ? 'Next →' : 'See score', true);
    } else {
      h += btn('Submit', picked !== null);
    }
    root.innerHTML = h + '</div>';
    if (!shown) root.querySelectorAll('[data-k]').forEach(function (el) { el.onclick = function () { picked = +el.getAttribute('data-k'); render(); }; });
    root.querySelector('button').onclick = function () {
      if (!shown) { if (picked === null) return; if (picked === Q.c) score++; shown = true; }
      else { i++; picked = null; shown = false; }
      render();
    };
  }
  render();
}
var SLIDES = [{"title": "Recap: Databricks Data Privacy", "icon": "🚀", "html": "<div class=\"hero\"><div class=\"blob b1\"><\/div><div class=\"blob b2\"><\/div><div class=\"blob b3\"><\/div><div class=\"hero-in\"><div class=\"kicker\">Advanced Data Engineering with Databricks<\/div><h1><span class=\"kicker-inline\">Recap<\/span>Databricks Data Privacy<\/h1><div class=\"chips\"><span class=\"chip\">Course 2 of 4<\/span><span class=\"chip\">⏱ ~8 minutes<\/span><\/div><p class=\"sub\">Protecting personal data across the lakehouse: <strong>who can see what<\/strong>, how to <strong>de-identify<\/strong> PII, and how to <strong>really delete<\/strong> data when a person asks for it.<\/p><\/div><\/div><div class=\"idea\"><span class=\"idea-icon\">💡<\/span><div><b>The one idea to remember:<\/b> put privacy into the <strong>platform<\/strong>, not into every job. Use Unity Catalog permissions, <strong>row filters and column masks<\/strong> (ideally driven by <strong>tags<\/strong>), de-identify early in the medallion flow, and design deletes that also remove old file versions.<\/div><\/div>"}, {"title": "What we covered", "icon": "🗺️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">01<\/span><span class=\"sec-icon\">🗺️<\/span><h2>What we covered<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Key takeaway<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Governance &amp; regulations<\/td>\n<td>GDPR / CCPA principles: minimization, purpose limitation, the right to be forgotten<\/td>\n<\/tr>\n<tr>\n<td>Securing data in Unity Catalog<\/td>\n<td>Least-privilege grants, groups, service principals, audit logs<\/td>\n<\/tr>\n<tr>\n<td>Fine-grained access<\/td>\n<td><strong>Dynamic views<\/strong>, <strong>row filters<\/strong>, <strong>column masks<\/strong>, ABAC with <strong>governed tags<\/strong><\/td>\n<\/tr>\n<tr>\n<td>De-identification<\/td>\n<td><strong>Pseudonymization<\/strong> (hashing, tokenization) vs <strong>anonymization<\/strong> (generalization, suppression)<\/td>\n<\/tr>\n<tr>\n<td>PII detection<\/td>\n<td><strong>Data classification<\/strong> finds PII columns and tags them automatically<\/td>\n<\/tr>\n<tr>\n<td>Deleting data<\/td>\n<td><code>DELETE<\/code> / <code>MERGE<\/code>, <strong>change data feed<\/strong> for propagation, <code>REORG … PURGE<\/code>, <strong><code>VACUUM<\/code><\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Least privilege in Unity Catalog", "icon": "🔐", "html": "<div class=\"sec-head\"><span class=\"sec-num\">02<\/span><span class=\"sec-icon\">🔐<\/span><h2>Least privilege in Unity Catalog<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">GRANT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">USE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">CATALOG<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">CATALOG<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TO<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">analysts<\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">;<\/span>\n<span style=\"color: #FF7B72\">GRANT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">USE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SCHEMA<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SCHEMA<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.gold<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TO<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">analysts<\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">;<\/span><span style=\"color: #6E7681\">      <\/span><span style=\"color: #8B949E; font-style: italic\">-- gold only, no raw PII<\/span>\n<span style=\"color: #FF7B72\">REVOKE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ALL<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">PRIVILEGES<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SCHEMA<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.bronze<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">analysts<\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">;<\/span>\n<span style=\"color: #FF7B72\">SHOW<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">GRANTS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SCHEMA<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.gold;<\/span><\/pre><\/div>\n<ul>\n<li>Reading a table needs <strong>all three<\/strong>: <code>USE CATALOG<\/code>, <code>USE SCHEMA<\/code> and <code>SELECT<\/code>.<\/li>\n<li>Grant to <strong>groups<\/strong>, run production as <strong>service principals<\/strong>, and keep raw PII in a <strong>restricted<\/strong> bronze schema.<\/li>\n<li>Unity Catalog privileges are <strong>allow-only<\/strong> (there is no <code>DENY<\/code>), so restrict by granting narrowly.<\/li>\n<li><strong>Audit:<\/strong> <code>system.access.audit<\/code> and <strong>lineage<\/strong> show who read PII and where it flowed.<\/li>\n<\/ul>"}, {"title": "Fine-grained access: who sees which rows and columns", "icon": "🔐", "html": "<div class=\"sec-head\"><span class=\"sec-num\">03<\/span><span class=\"sec-icon\">🔐<\/span><h2>Fine-grained access: who sees which rows and columns<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\">-- Column mask: only pii_readers see the full email<\/span>\n<span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">FUNCTION<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.sec.mask_email(email<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STRING)<\/span>\n<span style=\"color: #FF7B72\">RETURN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">CASE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">WHEN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">is_account_group_member(<\/span><span style=\"color: #A5D6FF\">'pii_readers'<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">THEN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">email<\/span>\n<span style=\"color: #6E7681\">            <\/span><span style=\"color: #FF7B72\">ELSE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">regexp_replace(email,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'^[^@]+'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'***'<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">END<\/span><span style=\"color: #E6EDF3\">;<\/span>\n<span style=\"color: #FF7B72\">ALTER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.silver.customers<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ALTER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">COLUMN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">email<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SET<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">MASK<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.sec.mask_email;<\/span>\n\n<span style=\"color: #8B949E; font-style: italic\">-- Row filter: EU analysts see EU rows only<\/span>\n<span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">FUNCTION<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.sec.eu_only(region<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">STRING)<\/span>\n<span style=\"color: #FF7B72\">RETURN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">is_account_group_member(<\/span><span style=\"color: #A5D6FF\">'admins'<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">OR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">region<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'EU'<\/span><span style=\"color: #E6EDF3\">;<\/span>\n<span style=\"color: #FF7B72\">ALTER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.silver.customers<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SET<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ROW<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">FILTER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.sec.eu_only<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(region);<\/span><\/pre><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Technique<\/th>\n<th>How<\/th>\n<th>Best for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Dynamic view<\/strong><\/td>\n<td>A view with <code>CASE WHEN is_account_group_member(...)<\/code><\/td>\n<td>Classic approach. Users must query the <strong>view<\/strong>, not the table<\/td>\n<\/tr>\n<tr>\n<td><strong>Row filter / column mask<\/strong><\/td>\n<td>A function attached <strong>to the table<\/strong><\/td>\n<td>The policy travels with the table: batch, streaming, MVs<\/td>\n<\/tr>\n<tr>\n<td><strong>ABAC policy + governed tags<\/strong><\/td>\n<td>One policy on a catalog or schema for every column tagged e.g. <code>pii = email<\/code><\/td>\n<td>Scale: new tables are protected <strong>without code changes<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">ALTER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.silver.customers<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ALTER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">COLUMN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">email<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">SET<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">TAGS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">'pii'<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'email'<\/span><span style=\"color: #E6EDF3\">);<\/span>\n\n<span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">POLICY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">mask_pii_email<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">CATALOG<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod<\/span>\n<span style=\"color: #FF7B72\">COLUMN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">MASK<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.sec.mask_email<\/span>\n<span style=\"color: #FF7B72\">TO<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">account<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">users<\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">EXCEPT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span><span style=\"color: #E6EDF3\">pii_readers<\/span><span style=\"color: #FF7B72; font-weight: bold\">`<\/span>\n<span style=\"color: #FF7B72\">FOR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">TABLES<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">MATCH<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">COLUMNS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">has_tag_value(<\/span><span style=\"color: #A5D6FF\">'pii'<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'email'<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">AS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">c<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">COLUMN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">c<\/span><span style=\"color: #E6EDF3\">;<\/span><\/pre><\/div>"}, {"title": "De-identification methods", "icon": "🎭", "html": "<div class=\"sec-head\"><span class=\"sec-num\">04<\/span><span class=\"sec-icon\">🎭<\/span><h2>De-identification methods<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Example<\/th>\n<th>Reversible?<\/th>\n<th>Still joinable?<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Hashing<\/strong> (salted / keyed)<\/td>\n<td><code>sha2(concat(email, secret('pii','salt')), 256)<\/code><\/td>\n<td>No<\/td>\n<td><strong>Yes<\/strong><\/td>\n<td>Pseudonymized<\/td>\n<\/tr>\n<tr>\n<td><strong>Tokenization<\/strong><\/td>\n<td>Random token, mapping kept in a locked <strong>vault table<\/strong><\/td>\n<td><strong>Yes<\/strong>, with vault access<\/td>\n<td>Yes<\/td>\n<td>Pseudonymized<\/td>\n<\/tr>\n<tr>\n<td><strong>Generalization<\/strong><\/td>\n<td>Age → <code>30-39<\/code>, ZIP → first 3 digits, date → month<\/td>\n<td>No<\/td>\n<td>Partly<\/td>\n<td>Anonymized<\/td>\n<\/tr>\n<tr>\n<td><strong>Suppression<\/strong><\/td>\n<td>Drop or NULL the column<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>Anonymized<\/td>\n<\/tr>\n<tr>\n<td><strong>Masking<\/strong><\/td>\n<td><code>***-**-1234<\/code> at query time<\/td>\n<td>Original still stored<\/td>\n<td>—<\/td>\n<td>Access control<\/td>\n<\/tr>\n<tr>\n<td>Text masking<\/td>\n<td><code>ai_mask(comment, ARRAY('email', 'phone'))<\/code><\/td>\n<td>No<\/td>\n<td>—<\/td>\n<td>PII in free text<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Pseudonymized<\/strong> data is still <strong>personal data<\/strong> under GDPR, because re-identification is possible.<\/li>\n<li><strong>Anonymized<\/strong> data (generalized, suppressed, aggregated) is no longer personal data, provided nobody can be re-identified. Think about <strong>k-anonymity<\/strong>: every combination of attributes should match at least <em>k<\/em> people.<\/li>\n<li>Keep salts and keys in <strong>secrets<\/strong>. A plain <code>sha2(email)<\/code> is guessable.<\/li>\n<\/ul>"}, {"title": "A privacy-aware medallion flow", "icon": "🔐", "html": "<div class=\"sec-head\"><span class=\"sec-num\">05<\/span><span class=\"sec-icon\">🔐<\/span><h2>A privacy-aware medallion flow<\/h2><\/div><pre class=\"diagram\">landing ─► bronze   raw data incl. PII        restricted schema, very few principals\n        ─► silver   hashed / tokenized IDs, PII columns tagged → masks via ABAC\n        ─► gold     aggregated / generalized, no direct identifiers → broad access<\/pre>\n<ol>\n<li><strong>Data classification<\/strong> scans tables, detects PII (emails, phone numbers, IBANs, names…) and applies <strong>governed tags<\/strong> automatically.<\/li>\n<li><strong>Tags + ABAC<\/strong> mask everything tagged, including columns added later.<\/li>\n<li>De-identify in the <strong>bronze → silver<\/strong> step, e.g. with pipeline code or a UDF.<\/li>\n<li>Put <strong>expectations<\/strong> on silver, so the pipeline fails if PII-looking values appear where they shouldn't.<\/li>\n<\/ol>"}, {"title": "The right to be forgotten", "icon": "🧹", "html": "<div class=\"sec-head\"><span class=\"sec-num\">06<\/span><span class=\"sec-icon\">🧹<\/span><h2>The right to be forgotten<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\">-- 1) delete everyone in the request table, starting at bronze<\/span>\n<span style=\"color: #E6EDF3\">MERGE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">INTO<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.bronze.customers<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">t<\/span>\n<span style=\"color: #FF7B72\">USING<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #FF7B72\">SELECT<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">customer_id<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">FROM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.ops.gdpr_requests<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">WHERE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">status<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">'pending'<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">r<\/span>\n<span style=\"color: #FF7B72\">ON<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">t.customer_id<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">=<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">r.customer_id<\/span>\n<span style=\"color: #FF7B72\">WHEN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">MATCHED<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">THEN<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">DELETE<\/span><span style=\"color: #E6EDF3\">;<\/span>\n\n<span style=\"color: #8B949E; font-style: italic\">-- 2) propagate to silver/gold: DELETE / MERGE, or apply deletes read from the change data feed<\/span>\n<span style=\"color: #8B949E; font-style: italic\">-- 3) deletion vectors only *mark* rows → rewrite the files<\/span>\n<span style=\"color: #E6EDF3\">REORG<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.bronze.customers<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">APPLY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(PURGE);<\/span>\n<span style=\"color: #8B949E; font-style: italic\">-- 4) remove old file versions after the retention period (default 7 days)<\/span>\n<span style=\"color: #FF7B72\">VACUUM<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">prod.bronze.customers;<\/span><\/pre><\/div>\n<ul>\n<li>Until <code>VACUUM<\/code>, deleted rows are still readable with <strong>time travel<\/strong> (<code>VERSION AS OF<\/code>).<\/li>\n<li><strong>Downstream streaming tables<\/strong> fail on deletes in their source. Use <code>skipChangeCommits<\/code> plus DML on the target, or the <strong>change data feed<\/strong>.<\/li>\n<li><strong>Upstream copies<\/strong> (landing files, Kafka, source systems) must be deleted too, or the data comes back on reprocessing.<\/li>\n<li><strong>Design for deletion:<\/strong> keep PII in a separate table keyed by a surrogate ID, so an erasure touches only one small table.<\/li>\n<li><strong>Retention rules:<\/strong> e.g. auto TTL (<code>DELETE ROWS 365 DAYS AFTER event_ts<\/code>) on managed tables with predictive optimization.<\/li>\n<\/ul>"}, {"title": "Try it: de-identify, mask, filter, forget", "icon": "🧪", "html": "<div class=\"sec-head\"><span class=\"sec-num\">07<\/span><span class=\"sec-icon\">🧪<\/span><h2>Try it: de-identify, mask, filter, forget<\/h2><\/div><blockquote class=\"callout\">\n<p>Uses the synthetic <strong>retail<\/strong> customers, which include a fake <code>email<\/code>, <code>birth_year<\/code> and <code>postal_code<\/code>. Everything runs in your own schema.<\/p>\n<\/blockquote>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># ✏️ FILL IN: the catalog.schema you can write to<\/span>\n<span style=\"color: #E6EDF3\">WORK_SCHEMA<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #A5D6FF\">\"FILL_IN\"<\/span>   <span style=\"color: #8B949E; font-style: italic\"># e.g. \"dbacademy.labuser1234567_1700000000\"<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Load the retail tables from GitHub<\/span>\n<span style=\"color: #FF7B72\">import<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">urllib.request<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">as<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">u<\/span><span style=\"color: #E6EDF3\">;<\/span> <span style=\"color: #E6EDF3\">exec(u<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">urlopen(<\/span><span style=\"color: #A5D6FF\">\"https://raw.githubusercontent.com/misrori/dbxhelp/main/dbxdata.py\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">read()<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">decode())<\/span>\n<span style=\"color: #E6EDF3\">S<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">load_dataset(<\/span><span style=\"color: #A5D6FF\">\"retail\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">WORK_SCHEMA)<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Pseudonymize + generalize: hash the email, bucket the birth year, truncate the postal code<\/span>\n<span style=\"color: #E6EDF3\">display(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"\"\"<\/span>\n<span style=\"color: #A5D6FF\">SELECT customer_id,<\/span>\n<span style=\"color: #A5D6FF\">       sha2(concat(email, 'demo-salt-keep-real-ones-in-secrets'), 256) AS email_hash,    -- pseudonymized, joinable<\/span>\n<span style=\"color: #A5D6FF\">       concat(CAST(floor(birth_year / 10) * 10 AS STRING), 's')       AS birth_decade,  -- generalized<\/span>\n<span style=\"color: #A5D6FF\">       concat(left(postal_code, 2), '**')                             AS postal_area,   -- generalized<\/span>\n<span style=\"color: #A5D6FF\">       region, segment<\/span>\n<span style=\"color: #A5D6FF\">FROM dim_customer<\/span>\n<span style=\"color: #A5D6FF\">LIMIT 10<\/span>\n<span style=\"color: #A5D6FF\">\"\"\"<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Column mask: only members of 'pii_readers' see full emails<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"\"\"<\/span>\n<span style=\"color: #A5D6FF\">CREATE OR REPLACE FUNCTION {<\/span><span style=\"color: #E6EDF3\">S<\/span><span style=\"color: #A5D6FF\">}.mask_email(email STRING)<\/span>\n<span style=\"color: #A5D6FF\">RETURN CASE WHEN is_account_group_member('pii_readers') THEN email<\/span>\n<span style=\"color: #A5D6FF\">            ELSE regexp_replace(email, '^[^@]+', '***') END<\/span>\n<span style=\"color: #A5D6FF\">\"\"\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"ALTER TABLE dim_customer ALTER COLUMN email SET MASK {<\/span><span style=\"color: #E6EDF3\">S<\/span><span style=\"color: #A5D6FF\">}.mask_email\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">display(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"SELECT customer_id, email, region FROM dim_customer LIMIT 5\"<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Row filter: non-admins see EMEA customers only<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"\"\"<\/span>\n<span style=\"color: #A5D6FF\">CREATE OR REPLACE FUNCTION {<\/span><span style=\"color: #E6EDF3\">S<\/span><span style=\"color: #A5D6FF\">}.emea_only(region STRING)<\/span>\n<span style=\"color: #A5D6FF\">RETURN is_account_group_member('admins') OR region = 'EMEA'<\/span>\n<span style=\"color: #A5D6FF\">\"\"\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"ALTER TABLE dim_customer SET ROW FILTER {<\/span><span style=\"color: #E6EDF3\">S<\/span><span style=\"color: #A5D6FF\">}.emea_only ON (region)\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">display(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"SELECT region, count(*) AS customers FROM dim_customer GROUP BY ALL\"<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Remove the policies again<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"ALTER TABLE dim_customer DROP ROW FILTER\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"ALTER TABLE dim_customer ALTER COLUMN email DROP MASK\"<\/span><span style=\"color: #E6EDF3\">)<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Right to be forgotten: after DELETE, time travel still shows the row<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"DELETE FROM dim_customer WHERE customer_id = 42\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">before<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"DESCRIBE HISTORY dim_customer\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">filter(<\/span><span style=\"color: #A5D6FF\">\"operation = 'DELETE'\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">first()[<\/span><span style=\"color: #A5D6FF\">\"version\"<\/span><span style=\"color: #E6EDF3\">]<\/span> <span style=\"color: #FF7B72; font-weight: bold\">-<\/span> <span style=\"color: #A5D6FF\">1<\/span>\n<span style=\"color: #E6EDF3\">display(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"SELECT customer_id, email FROM dim_customer VERSION AS OF {<\/span><span style=\"color: #E6EDF3\">before<\/span><span style=\"color: #A5D6FF\">} WHERE customer_id = 42\"<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Physically remove it: purge deletion vectors, then VACUUM (removes files older than the retention, default 7 days)<\/span>\n<span style=\"color: #E6EDF3\">display(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"REORG TABLE dim_customer APPLY (PURGE)\"<\/span><span style=\"color: #E6EDF3\">))<\/span>\n<span style=\"color: #E6EDF3\">display(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"VACUUM dim_customer\"<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>"}, {"title": "Decision cheat sheet", "icon": "🧭", "html": "<div class=\"sec-head\"><span class=\"sec-num\">08<\/span><span class=\"sec-icon\">🧭<\/span><h2>Decision cheat sheet<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Requirement<\/th>\n<th>Choose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Analysts may count unique customers but not see emails<\/td>\n<td><strong>Salted hashing<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Support must re-identify a customer in rare cases<\/td>\n<td><strong>Tokenization<\/strong> + vault table<\/td>\n<\/tr>\n<tr>\n<td>Public / partner dataset<\/td>\n<td><strong>Generalization + suppression<\/strong> (anonymization)<\/td>\n<\/tr>\n<tr>\n<td>Different people see different detail on the same table<\/td>\n<td><strong>Column mask<\/strong> / row filter<\/td>\n<\/tr>\n<tr>\n<td>Hundreds of tables with PII, new ones added weekly<\/td>\n<td><strong>Data classification + governed tags + ABAC<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Customer asks to be forgotten<\/td>\n<td><code>DELETE<\/code>/<code>MERGE<\/code> in every layer → <code>REORG … PURGE<\/code> → <code>VACUUM<\/code><\/td>\n<\/tr>\n<tr>\n<td>Propagate deletes from silver to gold<\/td>\n<td><strong>Change data feed<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Common mistakes", "icon": "⚠️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">09<\/span><span class=\"sec-icon\">⚠️<\/span><h2>Common mistakes<\/h2><\/div><ul>\n<li class=\"bad\">❌ Calling unsalted <code>sha2(email)<\/code> \"anonymization\". It is guessable pseudonymization.<\/li>\n<li class=\"bad\">❌ Running <code>DELETE<\/code> only. Old versions remain via time travel until <code>VACUUM<\/code>, and deletion vectors need <code>REORG … PURGE<\/code> first.<\/li>\n<li class=\"bad\">❌ Forgetting downstream streaming tables and upstream raw files.<\/li>\n<li class=\"bad\">❌ Copy-pasting masking logic into every job instead of attaching <strong>policies<\/strong> to tables and tags.<\/li>\n<li class=\"bad\">❌ Granting <code>ALL PRIVILEGES<\/code> to make access \"just work\".<\/li>\n<\/ul>\n<p><strong>Next course:<\/strong> <em>Databricks Performance Optimization<\/em>.<\/p>"}];
var QUIZ = [{"q": "Analysts must count distinct customers and join datasets by customer, but must never see email addresses. Which technique fits best?", "o": ["Suppression (drop the email column)", "Salted (keyed) hashing of the email", "Generalization of the email domain", "Plain sha2(email) without a salt"], "c": 1, "e": "Salted hashing keeps a stable, joinable identifier without exposing the value. Unsalted hashes of guessable values can be brute-forced, and suppression removes the join key."}, {"q": "Is pseudonymized data (hashed or tokenized identifiers) still personal data under GDPR?", "o": ["No, hashing makes it anonymous", "Yes, because re-identification is possible with additional information", "Only if the hash is SHA-1", "Only for tokenization, not for hashing"], "c": 1, "e": "Pseudonymization reduces risk, but the data can still be linked back to a person. Only properly anonymized data (e.g. generalized or aggregated) falls outside GDPR."}, {"q": "New tables with PII columns are added every week, and all of them must be masked automatically. What scales best?", "o": ["A dynamic view per table", "ALTER TABLE ... SET MASK on every new table", "Data classification + governed tags + an ABAC column-mask policy on the catalog", "Masking logic inside every pipeline"], "c": 2, "e": "Classification tags PII columns, and an ABAC policy on the catalog masks every matching column, now and in the future, without code changes."}, {"q": "A table uses deletion vectors. After deleting a customer for a GDPR request, what must happen before VACUUM physically removes the data?", "o": ["OPTIMIZE ZORDER BY customer_id", "REORG TABLE ... APPLY (PURGE)", "ANALYZE TABLE", "Nothing, DELETE rewrites the files immediately"], "c": 1, "e": "With deletion vectors, DELETE only marks rows. REORG ... APPLY (PURGE) rewrites the files, and VACUUM then removes the old files after the retention period."}, {"q": "After deleting rows in a silver table, the downstream streaming table that reads it starts failing. What is a correct fix?", "o": ["Delete the streaming table's checkpoint", "Use skipChangeCommits (and delete in the target with DML), or read the change data feed", "Switch the source to complete output mode", "Disable deletion vectors"], "c": 1, "e": "A plain streaming read only supports appends. skipChangeCommits ignores non-append commits, so you apply the delete downstream yourself. The change data feed delivers the deletes as rows you can process."}];
(function () {
  if (window.self !== window.top) document.body.classList.add('embedded');
  if (QUIZ && QUIZ.length) SLIDES.push({ title: 'Check yourself', icon: '🎯', quiz: true,
    html: '<div class="sec-head"><span class="sec-num">' + String(SLIDES.length).padStart(2, '0') + '</span><span class="sec-icon">🎯</span><h2>Check yourself</h2></div><div class="quiz"></div>' });
  var idx = 0, stage = document.getElementById('stage'), dots = document.getElementById('dots');
  var $ = function (id) { return document.getElementById(id); };

  function wireCopy(root) {
    root.querySelectorAll('.code').forEach(function (c) {
      var b = c.querySelector('.copy'); if (!b) return;
      b.onclick = function () {
        var t = c.querySelector('pre').innerText;
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'copied ✓'; setTimeout(function () { b.textContent = 'copy'; }, 1400); }, function () {});
      };
    });
  }
  function confetti() {
    var e = ['🎉', '✨', '🎊', '⭐', '🧡', '💜'];
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('div'); s.className = 'confetti'; s.textContent = e[i % e.length];
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .8 + 's'; document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 3600);
    }
  }
  function mountQuiz(el) { dbxQuiz(el, QUIZ, function (score, total) { if (score === total) confetti(); }); }

  SLIDES.forEach(function (s, i) {
    var d = document.createElement('button'); d.title = (i + 1) + '. ' + s.title; d.onclick = function () { go(i); }; dots.appendChild(d);
    var c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<div class="n">' + String(i + 1).padStart(2, '0') + '</div><div class="i">' + s.icon + '</div><div class="t">' + s.title + '</div>';
    c.onclick = function () { overview(false); go(i); }; $('grid').appendChild(c);
  });
  function go(n, dir) {
    var prev = idx; idx = Math.max(0, Math.min(SLIDES.length - 1, n));
    var s = SLIDES[idx], el = document.createElement('div');
    el.className = 'slide ' + (idx === 0 ? 'title ' : '') + ((dir || (idx >= prev ? 1 : -1)) > 0 ? 'enter-r' : 'enter-l');
    el.innerHTML = '<div class="dbx">' + s.html + '</div>';
    Array.prototype.forEach.call(el.firstChild.children, function (ch, k) { ch.style.setProperty('--i', k); });
    stage.innerHTML = ''; stage.appendChild(el); wireCopy(el);
    if (s.quiz) mountQuiz(el.querySelector('.quiz'));
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === idx); });
    $('count').textContent = (idx + 1) + ' / ' + SLIDES.length;
    $('bar').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
    try { history.replaceState(null, '', '#slide-' + (idx + 1)); } catch (e) {}
  }
  function overview(on) { var o = $('overview'); o.classList.toggle('on', on === undefined ? !o.classList.contains('on') : on); }
  $('prev').onclick = function () { go(idx - 1, -1); };
  $('next').onclick = function () { go(idx + 1, 1); };
  $('bOver').onclick = function () { mode('slides'); overview(); };
  $('bFull').onclick = function () {
    var r = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (r.requestFullscreen) r.requestFullscreen().catch(function () {});
  };
  var tx = null;
  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) { if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1)); tx = null; });

  var docBuilt = false;
  function buildDoc() {
    if (docBuilt) return; docBuilt = true;
    var toc = $('toc'), sc = $('docScroll');
    SLIDES.forEach(function (s, i) {
      var sec = document.createElement('div'); sec.className = 'dsec' + (i === 0 ? ' herosec' : ''); sec.id = 'sec-' + i;
      sec.innerHTML = '<div class="dbx">' + s.html + '</div>'; sc.appendChild(sec); wireCopy(sec);
      if (s.quiz) mountQuiz(sec.querySelector('.quiz'));
      var a = document.createElement('a'); a.href = '#sec-' + i; a.innerHTML = '<span>' + s.icon + '</span><span>' + (i === 0 ? 'Overview' : s.title) + '</span>';
      a.onclick = function (e) { e.preventDefault(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; toc.appendChild(a);
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) en.target.classList.add('seen'); }); }, { root: sc, threshold: .05 });
      sc.querySelectorAll('.dsec').forEach(function (s) { io.observe(s); });
    } else sc.querySelectorAll('.dsec').forEach(function (s) { s.classList.add('seen'); });
    sc.addEventListener('scroll', function () {
      var cur = 0;
      sc.querySelectorAll('.dsec').forEach(function (s, i) { if (s.offsetTop - sc.scrollTop < 140) cur = i; });
      toc.querySelectorAll('a').forEach(function (a, i) { a.classList.toggle('on', i === cur); });
      $('bar').style.width = (sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight) * 100) + '%';
    });
  }
  function mode(m) {
    var doc = m === 'doc'; document.body.classList.toggle('docmode', doc);
    $('bDoc').classList.toggle('on', doc); $('bSlides').classList.toggle('on', !doc);
    if (doc) { buildDoc(); $('docScroll').dispatchEvent(new Event('scroll')); } else go(idx, 1);
  }
  $('bDoc').onclick = function () { mode('doc'); };
  $('bSlides').onclick = function () { mode('slides'); };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key, doc = document.body.classList.contains('docmode');
    if (k === 'd' || k === 'D') return mode('doc');
    if (k === 'p' || k === 'P') return mode('slides');
    if (doc) return;
    if (k === 'o' || k === 'O') return overview();
    if (k === 'Escape') return overview(false);
    if (k === 'f' || k === 'F') return $('bFull').click();
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(idx + 1, 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(idx - 1, -1); }
    else if (k === 'Home') go(0, -1); else if (k === 'End') go(SLIDES.length - 1, 1);
  });
  var m = location.hash.match(/^#slide-(\d+)/); if (m) idx = parseInt(m[1], 10) - 1;
  if (location.hash === '#doc') mode('doc'); else go(idx, 1);
})();
