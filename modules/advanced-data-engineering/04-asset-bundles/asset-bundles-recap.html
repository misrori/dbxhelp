<style>
.dbx{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--teal:#00A3A1;--purple:#7C4DFF;--amber:#FFAB00;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.6;max-width:1100px}
.dbx *{box-sizing:border-box}
.dbx>*{animation:dbxRise .55s cubic-bezier(.2,.7,.2,1) both}
.dbx>*:nth-child(2){animation-delay:.06s}.dbx>*:nth-child(3){animation-delay:.12s}.dbx>*:nth-child(4){animation-delay:.18s}.dbx>*:nth-child(5){animation-delay:.24s}.dbx>*:nth-child(6){animation-delay:.3s}.dbx>*:nth-child(n+7){animation-delay:.36s}
@keyframes dbxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dbxGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes dbxFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@keyframes dbxLine{from{width:0}to{width:100%}}
@keyframes dbxPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,54,33,.25)}50%{box-shadow:0 0 0 8px rgba(255,54,33,0)}}
.dbx .hero{position:relative;overflow:hidden;border-radius:18px;padding:38px 40px 34px;margin:4px 0 18px;color:#fff;background:linear-gradient(120deg,#1B3139,#22425a,#2a2f6b,#1B3139);background-size:300% 300%;animation:dbxGrad 14s ease infinite,dbxRise .6s both}
.dbx .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:dbxFloat 9s ease-in-out infinite}
.dbx .b1{width:220px;height:220px;background:#FF3621;right:-40px;top:-60px}
.dbx .b2{width:180px;height:180px;background:#7C4DFF;right:160px;bottom:-90px;animation-delay:-3s}
.dbx .b3{width:140px;height:140px;background:#00A3A1;left:-40px;bottom:-50px;animation-delay:-6s}
.dbx .hero-in{position:relative}
.dbx .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#FFC4BA;font-weight:700}
.dbx .hero h1{font-size:34px;line-height:1.15;margin:8px 0 14px;color:#fff;font-weight:800}
.dbx .kicker-inline{display:inline-block;font-size:.5em;vertical-align:middle;background:var(--accent);padding:4px 10px;border-radius:999px;margin-right:10px;letter-spacing:.08em;text-transform:uppercase}
.dbx .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dbx .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px;color:#fff}
.dbx .chip strong{color:#fff}
.dbx .sub{color:#E2E8F0;font-size:16px;margin:0;max-width:820px}
.dbx .sub strong,.dbx .sub b{color:#FFD7CF}
.dbx .sub code{background:rgba(255,255,255,.16);color:#fff}
.dbx .idea{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFF4F1,#FFF);border:1px solid #FFD0C7;border-left:5px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;animation:dbxRise .55s both,dbxPulse 3s ease-in-out 1s 2}
.dbx .idea-icon{font-size:26px;line-height:1}
.dbx .idea b{color:#C62D1A}
.dbx .sec-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;position:relative;padding-bottom:10px}
.dbx .sec-head:after{content:"";position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));animation:dbxLine .9s ease-out both}
.dbx .sec-num{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7a59);padding:5px 10px;border-radius:9px;letter-spacing:.05em}
.dbx .sec-icon{font-size:26px;line-height:1}
.dbx .sec-head h2{margin:0;font-size:25px;color:var(--navy);font-weight:800;border:0}
.dbx h3{color:var(--navy);margin:18px 0 8px}
.dbx p{margin:8px 0}
.dbx a{color:var(--blue)}
.dbx code{background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(27,49,57,.06);margin:12px 0;background:#fff}
.dbx table{border-collapse:collapse;width:100%;font-size:14px}
.dbx th{background:linear-gradient(135deg,#1B3139,#2B4F63);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
.dbx td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.dbx tr:nth-child(even) td{background:#F8FAFC}
.dbx tr:hover td{background:#FFF4F1}
.dbx td:first-child{font-weight:600;color:var(--navy)}
.dbx ul,.dbx ol{padding-left:22px;margin:8px 0}
.dbx li{margin:5px 0}
.dbx li::marker{color:var(--accent)}
.dbx li.bad,.dbx li.good{list-style:none;margin:8px 0 8px -22px;padding:10px 14px;border-radius:10px}
.dbx li.bad{background:#FFF1F0;border:1px solid #FFCDC7}
.dbx li.good{background:#ECFDF3;border:1px solid #B7EBC9}
.dbx blockquote.callout{margin:14px 0;padding:12px 16px 12px 46px;border-radius:12px;background:linear-gradient(135deg,#E8F1FF,#F5F9FF);border:1px solid #C7DBFF;position:relative;color:#1E3A5F}
.dbx blockquote.callout:before{content:"ℹ️";position:absolute;left:14px;top:11px;font-size:18px}
.dbx blockquote.callout p{margin:4px 0}
.dbx .code{border-radius:12px;overflow:hidden;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.18);background:#0D1117}
.dbx .code-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161B22;border-bottom:1px solid #30363D}
.dbx .code-bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57;display:inline-block}
.dbx .code-bar i:nth-child(2){background:#FEBC2E}.dbx .code-bar i:nth-child(3){background:#28C840}
.dbx .lang{margin-left:8px;color:#8B949E;font-size:11px;letter-spacing:.1em;font-weight:700}
.dbx .run{margin-left:auto;color:#3FB950;font-size:11px;font-weight:700}
.dbx .copy{display:none}
.dbx .code pre{margin:0;padding:14px 16px;color:#E6EDF3;font-size:13px;line-height:1.55;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:transparent}
.dbx pre.diagram{background:linear-gradient(135deg,#F8FAFC,#EEF2FF);border:1px dashed #A5B4FC;border-radius:12px;padding:14px 16px;font-size:13px;color:#312E81;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tryit{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ECFDF3,#F0FDFA);border:1px solid #A7F3D0;border-radius:12px;padding:12px 16px;margin:12px 0}
.dbx .tryit b{color:#047857}
.dbx .present{display:flex;gap:16px;align-items:center;border-radius:14px;padding:16px 20px;background:linear-gradient(120deg,#2a2f6b,#7C4DFF);color:#fff;box-shadow:0 10px 30px rgba(124,77,255,.3)}
.dbx .present b{font-size:17px}
.dbx .present span{color:#E9E5FF}
.dbx .present .big{font-size:34px}
.dbx .footer{margin-top:10px;padding:14px 18px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);color:var(--muted);font-size:13px}
:root{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--purple:#7C4DFF;--teal:#00A3A1;--bg:#F4F2EE;--muted:#6B7280;--line:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1F2937;overflow:hidden}

.slide{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(27,49,57,.14);overflow:auto;padding:34px 52px 40px}
.slide.enter-r{animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-l{animation:inL .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px) rotateY(-6deg)}to{opacity:1;transform:none}}

.slide .dbx table{font-size:16px}
.slide .dbx .code pre{font-size:14.5px}
.slide .dbx>*{animation:dbxRise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
.slide.title{padding:0;overflow:hidden;background:transparent;box-shadow:0 18px 50px rgba(27,49,57,.25)}
.slide.title .dbx{height:100%;display:flex;flex-direction:column;position:relative}
.slide.title .hero{flex:1;margin:0;border-radius:20px;display:flex;align-items:center;padding:60px 70px 150px}

.slide.title .b1{width:420px;height:420px}.slide.title .b2{width:340px;height:340px}.slide.title .b3{width:300px;height:300px}
.slide.title .idea{position:absolute;left:70px;right:70px;bottom:40px;font-size:18px;background:rgba(255,255,255,.96)}

.controls{display:flex;align-items:center;gap:12px;padding-top:12px;flex:none}

.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#CBD5E1;cursor:pointer;padding:0;transition:all .25s}
.dots button.on{background:var(--accent);width:28px;border-radius:6px}
.count{color:var(--muted);font-size:.85em;min-width:60px;text-align:right}

#overview{position:absolute;inset:0;background:rgba(244,242,238,.97);z-index:4;display:none;overflow:auto;padding:26px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:all .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .n{font-size:.75em;color:var(--muted);font-weight:700}
.card .i{font-size:28px;margin:6px 0}
.card .t{font-weight:700;color:var(--navy)}
#doc{flex:1;display:none;min-height:0}
body.docmode #slides{display:none}
body.docmode #doc{display:flex}
#toc{width:270px;flex:none;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:#fff}
#toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;color:#334155;text-decoration:none;font-size:.9em;margin:2px 0}
#toc a:hover{background:#F1F5F9}
#toc a.on{background:#FFF1EE;color:#C62D1A;font-weight:700}
#docScroll{flex:1;overflow:auto;padding:26px 34px 80px}
.dsec{background:#fff;border-radius:18px;padding:26px 32px;margin:0 auto 18px;max-width:1000px;box-shadow:0 4px 18px rgba(27,49,57,.06);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.dsec.seen{opacity:1;transform:none}
.dsec.herosec{padding:0;background:transparent;box-shadow:none}
.dsec .dbx>*{animation:none}
.quiz{max-width:820px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.dbx .code .copy{display:inline-block;margin-left:auto;border:1px solid #30363D;background:#21262D;color:#C9D1D9;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
.dbx .code .run+.copy{margin-left:10px}
@media (max-width:760px){.slide{padding:22px}.slide.title .hero{padding:30px 30px 160px}.slide.title .hero h1{font-size:32px}.slide.title .idea{left:16px;right:16px}#toc{display:none}.crumb{display:none}.hint{display:none}}
@media print{header,.controls,#bar,#toc{display:none}body{overflow:visible}#doc{display:block}#slides{display:none}.dsec{opacity:1;transform:none;box-shadow:none}}
</style>

<script>
function dbxQuiz(root, questions, onDone) {
  if (typeof root === 'string') root = document.getElementById(root);
  var i = 0, score = 0, picked = null, shown = false, done = false;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code style="background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px">$1</code>'); }
  function btn(label, primary) { return '<button style="margin-top:16px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-weight:700;background:' + (primary ? 'linear-gradient(135deg,#FF3621,#7C4DFF)' : '#E5E7EB') + ';color:' + (primary ? '#fff' : '#6B7280') + ';font-size:0.95em;box-shadow:' + (primary ? '0 6px 18px rgba(124,77,255,.3)' : 'none') + '">' + label + '</button>'; }
  var box = 'padding:22px 24px;border-radius:16px;background:#fff;border:1px solid #E5E7EB;box-shadow:0 8px 28px rgba(27,49,57,.08);animation:dbxQ .4s ease both';
  var style = '<style>@keyframes dbxQ{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>';
  function bar() {
    var h = '<div style="display:flex;gap:6px;margin-bottom:14px">';
    for (var k = 0; k < questions.length; k++) h += '<div style="flex:1;height:6px;border-radius:6px;background:' + (k < i ? 'linear-gradient(90deg,#FF3621,#7C4DFF)' : k === i ? '#C4B5FD' : '#E5E7EB') + '"></div>';
    return h + '</div>';
  }
  function render() {
    if (i >= questions.length) {
      var pct = Math.round(score / questions.length * 100), msg = pct === 100 ? 'Perfect! 🎉' : pct >= 60 ? 'Nice work! 💪' : 'Worth another look 📖';
      root.innerHTML = style + '<div style="' + box + ';text-align:center"><div style="font-size:48px">' + (pct === 100 ? '🏆' : pct >= 60 ? '🌟' : '🔁') + '</div><div style="font-size:1.6em;font-weight:800;color:#1B3139">' + score + ' / ' + questions.length + '</div><div style="color:#6B7280;margin-top:4px">' + msg + '</div>' + btn('Retake', true) + '</div>';
      root.querySelector('button').onclick = function () { i = 0; score = 0; picked = null; shown = false; done = false; render(); };
      if (!done && onDone) { done = true; onDone(score, questions.length); }
      return;
    }
    var Q = questions[i], h = style + '<div style="' + box + '">' + bar();
    h += '<div style="color:#7C4DFF;font-size:0.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Question ' + (i + 1) + ' of ' + questions.length + '</div>';
    h += '<div style="font-weight:700;color:#1B3139;margin-bottom:14px;line-height:1.5;font-size:1.05em">' + esc(Q.q) + '</div>';
    Q.o.forEach(function (t, k) {
      var bg = '#fff', bd = '#E5E7EB', mark = String.fromCharCode(65 + k);
      if (shown && k === Q.c) { bg = '#ECFDF3'; bd = '#22C55E'; mark = '✓'; }
      else if (shown && k === picked) { bg = '#FFF1F0'; bd = '#EF4444'; mark = '✗'; }
      else if (!shown && k === picked) { bg = '#F5F3FF'; bd = '#7C4DFF'; }
      h += '<div data-k="' + k + '" style="display:flex;gap:12px;align-items:center;padding:11px 14px;margin:8px 0;border:2px solid ' + bd + ';background:' + bg + ';border-radius:12px;cursor:' + (shown ? 'default' : 'pointer') + ';color:#1F2937;transition:all .15s">' +
        '<span style="flex:none;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;background:' + (bd === '#E5E7EB' ? '#F1F5F9' : bd) + ';color:' + (bd === '#E5E7EB' ? '#64748B' : '#fff') + '">' + mark + '</span><span>' + esc(t) + '</span></div>';
    });
    if (shown) {
      var ok = picked === Q.c;
      h += '<div style="margin-top:14px;padding:14px 16px;border-radius:12px;background:' + (ok ? '#ECFDF3' : '#FFF7ED') + ';border:1px solid ' + (ok ? '#A7F3D0' : '#FED7AA') + ';color:#1F2937;animation:dbxQ .3s both"><strong>' + (ok ? '✅ Correct.' : '💡 Not quite.') + '</strong> ' + esc(Q.e) + '</div>' + btn(i + 1 < questions.length ? 'Next →' : 'See score', true);
    } else {
      h += btn('Submit', picked !== null);
    }
    root.innerHTML = h + '</div>';
    if (!shown) root.querySelectorAll('[data-k]').forEach(function (el) { el.onclick = function () { picked = +el.getAttribute('data-k'); render(); }; });
    root.querySelector('button').onclick = function () {
      if (!shown) { if (picked === null) return; if (picked === Q.c) score++; shown = true; }
      else { i++; picked = null; shown = false; }
      render();
    };
  }
  render();
}
var SLIDES = [{"title": "Recap: Automated Deployment with Databricks Asset Bundles", "icon": "🚀", "html": "<div class=\"hero\"><div class=\"blob b1\"><\/div><div class=\"blob b2\"><\/div><div class=\"blob b3\"><\/div><div class=\"hero-in\"><div class=\"kicker\">Advanced Data Engineering with Databricks<\/div><h1><span class=\"kicker-inline\">Recap<\/span>Automated Deployment with Databricks Asset Bundles<\/h1><div class=\"chips\"><span class=\"chip\">Course 4 of 4<\/span><span class=\"chip\">⏱ ~9 minutes<\/span><\/div><p class=\"sub\">Describing jobs, pipelines and code <strong>as YAML in Git<\/strong>, and deploying the <strong>same project<\/strong> to dev, test and prod with the Databricks CLI and a CI/CD pipeline. (Bundles are now also called <em>Declarative Automation Bundles<\/em>.)<\/p><\/div><\/div><div class=\"idea\"><span class=\"idea-icon\">💡<\/span><div><b>The one idea to remember:<\/b> one bundle, many <strong>targets<\/strong>. The code and resource definitions never change between environments, only <strong>variables and target overrides<\/strong> do. CI runs <code>validate<\/code> → <code>deploy<\/code> → <code>run<\/code> for you.<\/div><\/div>"}, {"title": "What we covered", "icon": "🗺️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">01<\/span><span class=\"sec-icon\">🗺️<\/span><h2>What we covered<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Key takeaway<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DevOps &amp; CI/CD review<\/td>\n<td>Why manual UI deployments don't scale<\/td>\n<\/tr>\n<tr>\n<td>What a bundle is<\/td>\n<td>A project folder with <code>databricks.yml<\/code>: <strong>resources<\/strong> + <strong>targets<\/strong> + <strong>variables<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Bundle configuration<\/td>\n<td><code>include<\/code>, resource YAML files, substitutions, <strong>deployment modes<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Deploying with the CLI<\/td>\n<td><code>bundle init<\/code> · <code>validate<\/code> · <code>deploy<\/code> · <code>run<\/code> · <code>summary<\/code> · <code>destroy<\/code><\/td>\n<\/tr>\n<tr>\n<td>Templates &amp; project structure<\/td>\n<td><code>src/<\/code>, <code>resources/<\/code>, <code>tests/<\/code>, building <strong>wheels<\/strong> as artifacts<\/td>\n<\/tr>\n<tr>\n<td>CI/CD automation<\/td>\n<td>GitHub Actions running tests and bundle commands as a <strong>service principal<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Bundle anatomy", "icon": "📦", "html": "<div class=\"sec-head\"><span class=\"sec-num\">02<\/span><span class=\"sec-icon\">📦<\/span><h2>Bundle anatomy<\/h2><\/div><pre class=\"diagram\">orders_etl/\n├── databricks.yml            # bundle name, includes, variables, targets\n├── resources/\n│   ├── orders.job.yml        # one file per job / pipeline\n│   └── orders.pipeline.yml\n├── src/                      # notebooks, pipeline sources, Python package\n├── tests/                    # pytest unit tests\n└── pyproject.toml            # optional: build a wheel<\/pre>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># databricks.yml<\/span>\n<span style=\"color: #7EE787\">bundle<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">orders_etl<\/span>\n\n<span style=\"color: #7EE787\">include<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">resources/*.yml<\/span>\n\n<span style=\"color: #7EE787\">variables<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">catalog<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">description<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">Target catalog<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">default<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">dev<\/span>\n\n<span style=\"color: #7EE787\">targets<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">dev<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">mode<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">development<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">default<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">true<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">workspace<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">host<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">https://dev.cloud.databricks.com<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">prod<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">mode<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">production<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">workspace<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">host<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">https://prod.cloud.databricks.com<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">variables<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">catalog<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">prod<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">run_as<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">service_principal_name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">6f1c0000-aaaa-bbbb-cccc-000000000000<\/span><\/pre><\/div>"}, {"title": "Resources: jobs and pipelines as YAML", "icon": "📝", "html": "<div class=\"sec-head\"><span class=\"sec-num\">03<\/span><span class=\"sec-icon\">📝<\/span><h2>Resources: jobs and pipelines as YAML<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># resources/orders.job.yml<\/span>\n<span style=\"color: #7EE787\">resources<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">jobs<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">orders_job<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">name<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">orders-etl-${bundle.target}<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">tasks<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">        <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">task_key<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">ingest<\/span>\n<span style=\"color: #6E7681\">          <\/span><span style=\"color: #7EE787\">notebook_task<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">            <\/span><span style=\"color: #7EE787\">notebook_path<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">../src/ingest.py<\/span>\n<span style=\"color: #6E7681\">            <\/span><span style=\"color: #7EE787\">base_parameters<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">              <\/span><span style=\"color: #7EE787\">catalog<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">${var.catalog}<\/span>\n<span style=\"color: #6E7681\">        <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">task_key<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">transform<\/span>\n<span style=\"color: #6E7681\">          <\/span><span style=\"color: #7EE787\">depends_on<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">[{<\/span><span style=\"color: #7EE787\"> task_key<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #79C0FF\">ingest<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">}]<\/span>\n<span style=\"color: #6E7681\">          <\/span><span style=\"color: #7EE787\">pipeline_task<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">            <\/span><span style=\"color: #7EE787\">pipeline_id<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">${resources.pipelines.orders_pipeline.id}<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">schedule<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">        <\/span><span style=\"color: #7EE787\">quartz_cron_expression<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">\"0<\/span><span style=\"color: #79C0FF\"> <\/span><span style=\"color: #A5D6FF\">0<\/span><span style=\"color: #79C0FF\"> <\/span><span style=\"color: #A5D6FF\">2<\/span><span style=\"color: #79C0FF\"> <\/span><span style=\"color: #A5D6FF\">*<\/span><span style=\"color: #79C0FF\"> <\/span><span style=\"color: #A5D6FF\">*<\/span><span style=\"color: #79C0FF\"> <\/span><span style=\"color: #A5D6FF\">?\"<\/span>\n<span style=\"color: #6E7681\">        <\/span><span style=\"color: #7EE787\">timezone_id<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">UTC<\/span><\/pre><\/div>\n<ul>\n<li><strong>Resource types:<\/strong> jobs, pipelines, dashboards, schemas, volumes, models, serving endpoints, apps…<\/li>\n<li><strong>Substitutions:<\/strong> <code>${var.catalog}<\/code>, <code>${bundle.target}<\/code>, <code>${workspace.current_user.userName}<\/code>, <code>${resources.pipelines.orders_pipeline.id}<\/code>.<\/li>\n<li><strong>Existing UI job → YAML:<\/strong> <code>databricks bundle generate job --existing-job-id 123<\/code>.<\/li>\n<\/ul>"}, {"title": "Variables and overrides", "icon": "🎛️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">04<\/span><span class=\"sec-icon\">🎛️<\/span><h2>Variables and overrides<\/h2><\/div><p>The value of a variable is resolved in this order of precedence (highest first):<\/p>\n<ol>\n<li><code>--var=\"catalog=prod\"<\/code> on the CLI<\/li>\n<li><code>BUNDLE_VAR_catalog<\/code> environment variable (great for CI secrets)<\/li>\n<li><code>targets.&lt;target&gt;.variables<\/code><\/li>\n<li>The variable's <code>default<\/code><\/li>\n<\/ol>\n<ul>\n<li>A variable can be a <strong>lookup<\/strong>, which resolves an ID by name: <code>lookup: { warehouse: \"Shared SQL\" }<\/code>.<\/li>\n<li><strong>Never<\/strong> put credentials in <code>databricks.yml<\/code>. Inject them through <code>BUNDLE_VAR_…<\/code>, or use secret scopes.<\/li>\n<li>Bundle variables are <strong>deployment-time<\/strong> values. Values that change <strong>per run<\/strong> belong in <strong>job parameters<\/strong>.<\/li>\n<\/ul>"}, {"title": "Deployment modes", "icon": "🚀", "html": "<div class=\"sec-head\"><span class=\"sec-num\">05<\/span><span class=\"sec-icon\">🚀<\/span><h2>Deployment modes<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><code>mode: development<\/code><\/th>\n<th><code>mode: production<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Resource names prefixed <strong><code>[dev &lt;user&gt;]<\/code><\/strong>, so each developer gets an isolated copy<\/td>\n<td>Names as written<\/td>\n<\/tr>\n<tr>\n<td><strong>Schedules and triggers paused<\/strong><\/td>\n<td>Schedules active<\/td>\n<\/tr>\n<tr>\n<td>Concurrent runs allowed, deployment lock off<\/td>\n<td>Validates <code>run_as<\/code>, permissions, and that pipelines are not in development mode<\/td>\n<\/tr>\n<tr>\n<td>Fast iteration (e.g. <code>--cluster-id<\/code> override)<\/td>\n<td>Cluster overrides not allowed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "The CLI lifecycle", "icon": "⌨️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">06<\/span><span class=\"sec-icon\">⌨️<\/span><h2>The CLI lifecycle<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">BASH<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre>databricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>init<span style=\"color: #6E7681\"> <\/span>default-python<span style=\"color: #6E7681\">      <\/span><span style=\"color: #8B949E; font-style: italic\"># start from a template<\/span>\ndatabricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>validate<span style=\"color: #6E7681\"> <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev<span style=\"color: #6E7681\">          <\/span><span style=\"color: #8B949E; font-style: italic\"># check syntax, references, variables<\/span>\ndatabricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>deploy<span style=\"color: #6E7681\">   <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev<span style=\"color: #6E7681\">          <\/span><span style=\"color: #8B949E; font-style: italic\"># upload files + create/update resources (idempotent)<\/span>\ndatabricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>run<span style=\"color: #6E7681\">      <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev<span style=\"color: #6E7681\"> <\/span>orders_job\ndatabricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>summary<span style=\"color: #6E7681\">  <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev<span style=\"color: #6E7681\">          <\/span><span style=\"color: #8B949E; font-style: italic\"># what is deployed, with URLs<\/span>\ndatabricks<span style=\"color: #6E7681\"> <\/span>bundle<span style=\"color: #6E7681\"> <\/span>destroy<span style=\"color: #6E7681\">  <\/span>-t<span style=\"color: #6E7681\"> <\/span>dev<span style=\"color: #6E7681\">          <\/span><span style=\"color: #8B949E; font-style: italic\"># remove everything this bundle deployed to dev<\/span><\/pre><\/div>\n<ul>\n<li>Deploys are <strong>declarative<\/strong>: a resource removed from the YAML is removed from the workspace on the next deploy, and manual UI edits are overwritten.<\/li>\n<li><strong>Artifacts:<\/strong> the bundle can build a <strong>wheel<\/strong> (<code>artifacts:<\/code> with <code>build: uv build --wheel<\/code>) and attach it to tasks, so prod runs exactly the tested version.<\/li>\n<\/ul>"}, {"title": "CI/CD with GitHub Actions", "icon": "🚀", "html": "<div class=\"sec-head\"><span class=\"sec-num\">07<\/span><span class=\"sec-icon\">🚀<\/span><h2>CI/CD with GitHub Actions<\/h2><\/div><div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">YAML<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># .github/workflows/deploy.yml (simplified)<\/span>\n<span style=\"color: #7EE787\">on<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">pull_request<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">push<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">branches<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">[<\/span><span style=\"color: #79C0FF\">main<\/span><span style=\"color: #E6EDF3\">]<\/span>\n<span style=\"color: #7EE787\">jobs<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">  <\/span><span style=\"color: #7EE787\">deploy<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">runs-on<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">ubuntu-latest<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">env<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">DATABRICKS_HOST<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">${{ secrets.DATABRICKS_HOST }}<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">DATABRICKS_CLIENT_ID<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">${{ secrets.SP_CLIENT_ID }}<\/span><span style=\"color: #6E7681\">          <\/span><span style=\"color: #8B949E; font-style: italic\"># service principal (OAuth M2M)<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #7EE787\">DATABRICKS_CLIENT_SECRET<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">${{ secrets.SP_CLIENT_SECRET }}<\/span>\n<span style=\"color: #6E7681\">    <\/span><span style=\"color: #7EE787\">steps<\/span><span style=\"color: #E6EDF3\">:<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">uses<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">actions/checkout@v4<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">uses<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">databricks/setup-cli@main<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">run<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">pip install pytest pyspark &amp;&amp; pytest tests/<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">run<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">databricks bundle validate -t staging<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">run<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">databricks bundle deploy -t staging &amp;&amp; databricks bundle run -t staging integration_tests<\/span>\n<span style=\"color: #6E7681\">      <\/span><span style=\"color: #E6EDF3\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #7EE787\">if<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">github.ref == 'refs/heads/main'<\/span>\n<span style=\"color: #6E7681\">        <\/span><span style=\"color: #7EE787\">run<\/span><span style=\"color: #E6EDF3\">:<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #A5D6FF\">databricks bundle deploy -t prod<\/span><\/pre><\/div>\n<ul>\n<li><strong>Pull request:<\/strong> unit tests, <code>validate<\/code>, deploy to <strong>staging<\/strong>, integration tests.<\/li>\n<li><strong>Merge to main:<\/strong> deploy the <strong>same commit<\/strong> to <strong>prod<\/strong>.<\/li>\n<li>Authenticate CI as a <strong>service principal<\/strong> with OAuth, or with workload identity federation. Don't use a person's PAT.<\/li>\n<\/ul>"}, {"title": "Decision cheat sheet", "icon": "🧭", "html": "<div class=\"sec-head\"><span class=\"sec-num\">08<\/span><span class=\"sec-icon\">🧭<\/span><h2>Decision cheat sheet<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Choose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Same job in dev, staging and prod with different catalogs<\/td>\n<td>One bundle, <strong>targets<\/strong> + <strong>variables<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Developers must not overwrite each other's jobs<\/td>\n<td><strong><code>mode: development<\/code><\/strong> (user-prefixed copies)<\/td>\n<\/tr>\n<tr>\n<td>A prod job must not run as the engineer who deployed it<\/td>\n<td><strong><code>run_as<\/code><\/strong> service principal<\/td>\n<\/tr>\n<tr>\n<td>A job already exists in the UI<\/td>\n<td><code>bundle generate job<\/code><\/td>\n<\/tr>\n<tr>\n<td>A password is needed at deploy time<\/td>\n<td><code>BUNDLE_VAR_…<\/code> from the CI secret store<\/td>\n<\/tr>\n<tr>\n<td>Prod must run exactly the tested code<\/td>\n<td>Build a <strong>wheel artifact<\/strong> in the bundle<\/td>\n<\/tr>\n<tr>\n<td>Catch config errors before deploying<\/td>\n<td><code>bundle validate<\/code> in CI<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Common mistakes", "icon": "⚠️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">09<\/span><span class=\"sec-icon\">⚠️<\/span><h2>Common mistakes<\/h2><\/div><ul>\n<li class=\"bad\">❌ Recreating jobs by hand in each workspace, or copying job JSON between them.<\/li>\n<li class=\"bad\">❌ Hard-coded catalog names in code instead of <code>${var.catalog}<\/code>.<\/li>\n<li class=\"bad\">❌ Expecting a dev deployment to run on schedule. Development mode <strong>pauses<\/strong> schedules.<\/li>\n<li class=\"bad\">❌ <code>mode: development<\/code> on the prod target (prefixed names, paused schedules).<\/li>\n<li class=\"bad\">❌ Editing a bundle-managed job in the UI. The next deploy overwrites it.<\/li>\n<li class=\"bad\">❌ CI authenticated with a human's personal access token.<\/li>\n<\/ul>\n<p><strong>You finished the Advanced Data Engineering path.<\/strong><\/p>"}];
var QUIZ = [{"q": "Which file defines a bundle's name, included resource files, variables and targets?", "o": ["bundle.json", "databricks.yml", "pyproject.toml", "requirements.txt"], "c": 1, "e": "databricks.yml at the project root is the bundle configuration. Resources are usually split into files under resources/ and pulled in with include."}, {"q": "After `databricks bundle deploy -t dev`, the scheduled job doesn't start on its schedule. Why?", "o": ["The deploy failed silently", "Development mode pauses schedules and triggers", "Schedules only work with job clusters", "The job must be run with bundle run first"], "c": 1, "e": "mode: development prefixes resource names with [dev user] and pauses schedules, so dev copies don't run on their own."}, {"q": "A CI pipeline must pass a database password to the bundle at deploy time without storing it in Git. What do you use?", "o": ["Write it into databricks.yml under the prod target", "Set it as the BUNDLE_VAR_<name> environment variable from the CI secret store", "Hard-code it in the notebook", "Put it in the variable's default value"], "c": 1, "e": "BUNDLE_VAR_<name> environment variables override bundle variables, and their values can come from the CI system's secret store."}, {"q": "Production jobs must not run with the identity of the engineer who deployed them. Which bundle setting handles this?", "o": ["`mode: development`", "`run_as` with a service principal on the prod target", "`permissions: CAN_VIEW`", "`--force` on deploy"], "c": 1, "e": "run_as sets the identity that jobs and pipelines run with. Production mode validates it, and a service principal is the recommended choice."}, {"q": "In which order should a CI/CD pipeline typically run the bundle commands for a staging deployment?", "o": ["deploy → validate → run", "run → deploy → validate", "validate → deploy → run", "destroy → deploy → validate"], "c": 2, "e": "validate catches configuration errors, deploy creates or updates the resources, and run executes the job, e.g. integration tests, against the deployed version."}];
(function () {
  if (window.self !== window.top) document.body.classList.add('embedded');
  if (QUIZ && QUIZ.length) SLIDES.push({ title: 'Check yourself', icon: '🎯', quiz: true,
    html: '<div class="sec-head"><span class="sec-num">' + String(SLIDES.length).padStart(2, '0') + '</span><span class="sec-icon">🎯</span><h2>Check yourself</h2></div><div class="quiz"></div>' });
  var idx = 0, stage = document.getElementById('stage'), dots = document.getElementById('dots');
  var $ = function (id) { return document.getElementById(id); };

  function wireCopy(root) {
    root.querySelectorAll('.code').forEach(function (c) {
      var b = c.querySelector('.copy'); if (!b) return;
      b.onclick = function () {
        var t = c.querySelector('pre').innerText;
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'copied ✓'; setTimeout(function () { b.textContent = 'copy'; }, 1400); }, function () {});
      };
    });
  }
  function confetti() {
    var e = ['🎉', '✨', '🎊', '⭐', '🧡', '💜'];
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('div'); s.className = 'confetti'; s.textContent = e[i % e.length];
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .8 + 's'; document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 3600);
    }
  }
  function mountQuiz(el) { dbxQuiz(el, QUIZ, function (score, total) { if (score === total) confetti(); }); }

  SLIDES.forEach(function (s, i) {
    var d = document.createElement('button'); d.title = (i + 1) + '. ' + s.title; d.onclick = function () { go(i); }; dots.appendChild(d);
    var c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<div class="n">' + String(i + 1).padStart(2, '0') + '</div><div class="i">' + s.icon + '</div><div class="t">' + s.title + '</div>';
    c.onclick = function () { overview(false); go(i); }; $('grid').appendChild(c);
  });
  function go(n, dir) {
    var prev = idx; idx = Math.max(0, Math.min(SLIDES.length - 1, n));
    var s = SLIDES[idx], el = document.createElement('div');
    el.className = 'slide ' + (idx === 0 ? 'title ' : '') + ((dir || (idx >= prev ? 1 : -1)) > 0 ? 'enter-r' : 'enter-l');
    el.innerHTML = '<div class="dbx">' + s.html + '</div>';
    Array.prototype.forEach.call(el.firstChild.children, function (ch, k) { ch.style.setProperty('--i', k); });
    stage.innerHTML = ''; stage.appendChild(el); wireCopy(el);
    if (s.quiz) mountQuiz(el.querySelector('.quiz'));
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === idx); });
    $('count').textContent = (idx + 1) + ' / ' + SLIDES.length;
    $('bar').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
    try { history.replaceState(null, '', '#slide-' + (idx + 1)); } catch (e) {}
  }
  function overview(on) { var o = $('overview'); o.classList.toggle('on', on === undefined ? !o.classList.contains('on') : on); }
  $('prev').onclick = function () { go(idx - 1, -1); };
  $('next').onclick = function () { go(idx + 1, 1); };
  $('bOver').onclick = function () { mode('slides'); overview(); };
  $('bFull').onclick = function () {
    var r = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (r.requestFullscreen) r.requestFullscreen().catch(function () {});
  };
  var tx = null;
  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) { if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1)); tx = null; });

  var docBuilt = false;
  function buildDoc() {
    if (docBuilt) return; docBuilt = true;
    var toc = $('toc'), sc = $('docScroll');
    SLIDES.forEach(function (s, i) {
      var sec = document.createElement('div'); sec.className = 'dsec' + (i === 0 ? ' herosec' : ''); sec.id = 'sec-' + i;
      sec.innerHTML = '<div class="dbx">' + s.html + '</div>'; sc.appendChild(sec); wireCopy(sec);
      if (s.quiz) mountQuiz(sec.querySelector('.quiz'));
      var a = document.createElement('a'); a.href = '#sec-' + i; a.innerHTML = '<span>' + s.icon + '</span><span>' + (i === 0 ? 'Overview' : s.title) + '</span>';
      a.onclick = function (e) { e.preventDefault(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; toc.appendChild(a);
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) en.target.classList.add('seen'); }); }, { root: sc, threshold: .05 });
      sc.querySelectorAll('.dsec').forEach(function (s) { io.observe(s); });
    } else sc.querySelectorAll('.dsec').forEach(function (s) { s.classList.add('seen'); });
    sc.addEventListener('scroll', function () {
      var cur = 0;
      sc.querySelectorAll('.dsec').forEach(function (s, i) { if (s.offsetTop - sc.scrollTop < 140) cur = i; });
      toc.querySelectorAll('a').forEach(function (a, i) { a.classList.toggle('on', i === cur); });
      $('bar').style.width = (sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight) * 100) + '%';
    });
  }
  function mode(m) {
    var doc = m === 'doc'; document.body.classList.toggle('docmode', doc);
    $('bDoc').classList.toggle('on', doc); $('bSlides').classList.toggle('on', !doc);
    if (doc) { buildDoc(); $('docScroll').dispatchEvent(new Event('scroll')); } else go(idx, 1);
  }
  $('bDoc').onclick = function () { mode('doc'); };
  $('bSlides').onclick = function () { mode('slides'); };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key, doc = document.body.classList.contains('docmode');
    if (k === 'd' || k === 'D') return mode('doc');
    if (k === 'p' || k === 'P') return mode('slides');
    if (doc) return;
    if (k === 'o' || k === 'O') return overview();
    if (k === 'Escape') return overview(false);
    if (k === 'f' || k === 'F') return $('bFull').click();
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(idx + 1, 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(idx - 1, -1); }
    else if (k === 'Home') go(0, -1); else if (k === 'End') go(SLIDES.length - 1, 1);
  });
  var m = location.hash.match(/^#slide-(\d+)/); if (m) idx = parseInt(m[1], 10) - 1;
  if (location.hash === '#doc') mode('doc'); else go(idx, 1);
})();
</script>
