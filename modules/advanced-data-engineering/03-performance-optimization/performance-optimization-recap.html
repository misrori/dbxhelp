<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap 3: Databricks Performance Optimization · dbxhelp</title>
<style>
.dbx{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--teal:#00A3A1;--purple:#7C4DFF;--amber:#FFAB00;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.6;max-width:1100px}
.dbx *{box-sizing:border-box}
.dbx>*{animation:dbxRise .55s cubic-bezier(.2,.7,.2,1) both}
.dbx>*:nth-child(2){animation-delay:.06s}.dbx>*:nth-child(3){animation-delay:.12s}.dbx>*:nth-child(4){animation-delay:.18s}.dbx>*:nth-child(5){animation-delay:.24s}.dbx>*:nth-child(6){animation-delay:.3s}.dbx>*:nth-child(n+7){animation-delay:.36s}
@keyframes dbxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dbxGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes dbxFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@keyframes dbxLine{from{width:0}to{width:100%}}
@keyframes dbxPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,54,33,.25)}50%{box-shadow:0 0 0 8px rgba(255,54,33,0)}}
.dbx .hero{position:relative;overflow:hidden;border-radius:18px;padding:38px 40px 34px;margin:4px 0 18px;color:#fff;background:linear-gradient(120deg,#1B3139,#22425a,#2a2f6b,#1B3139);background-size:300% 300%;animation:dbxGrad 14s ease infinite,dbxRise .6s both}
.dbx .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:dbxFloat 9s ease-in-out infinite}
.dbx .b1{width:220px;height:220px;background:#FF3621;right:-40px;top:-60px}
.dbx .b2{width:180px;height:180px;background:#7C4DFF;right:160px;bottom:-90px;animation-delay:-3s}
.dbx .b3{width:140px;height:140px;background:#00A3A1;left:-40px;bottom:-50px;animation-delay:-6s}
.dbx .hero-in{position:relative}
.dbx .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#FFC4BA;font-weight:700}
.dbx .hero h1{font-size:34px;line-height:1.15;margin:8px 0 14px;color:#fff;font-weight:800}
.dbx .kicker-inline{display:inline-block;font-size:.5em;vertical-align:middle;background:var(--accent);padding:4px 10px;border-radius:999px;margin-right:10px;letter-spacing:.08em;text-transform:uppercase}
.dbx .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dbx .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px;color:#fff}
.dbx .chip strong{color:#fff}
.dbx .sub{color:#E2E8F0;font-size:16px;margin:0;max-width:820px}
.dbx .sub strong,.dbx .sub b{color:#FFD7CF}
.dbx .sub code{background:rgba(255,255,255,.16);color:#fff}
.dbx .idea{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFF4F1,#FFF);border:1px solid #FFD0C7;border-left:5px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;animation:dbxRise .55s both,dbxPulse 3s ease-in-out 1s 2}
.dbx .idea-icon{font-size:26px;line-height:1}
.dbx .idea b{color:#C62D1A}
.dbx .sec-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;position:relative;padding-bottom:10px}
.dbx .sec-head:after{content:"";position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));animation:dbxLine .9s ease-out both}
.dbx .sec-num{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7a59);padding:5px 10px;border-radius:9px;letter-spacing:.05em}
.dbx .sec-icon{font-size:26px;line-height:1}
.dbx .sec-head h2{margin:0;font-size:25px;color:var(--navy);font-weight:800;border:0}
.dbx h3{color:var(--navy);margin:18px 0 8px}
.dbx p{margin:8px 0}
.dbx a{color:var(--blue)}
.dbx code{background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(27,49,57,.06);margin:12px 0;background:#fff}
.dbx table{border-collapse:collapse;width:100%;font-size:14px}
.dbx th{background:linear-gradient(135deg,#1B3139,#2B4F63);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
.dbx td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.dbx tr:nth-child(even) td{background:#F8FAFC}
.dbx tr:hover td{background:#FFF4F1}
.dbx td:first-child{font-weight:600;color:var(--navy)}
.dbx ul,.dbx ol{padding-left:22px;margin:8px 0}
.dbx li{margin:5px 0}
.dbx li::marker{color:var(--accent)}
.dbx li.bad,.dbx li.good{list-style:none;margin:8px 0 8px -22px;padding:10px 14px;border-radius:10px}
.dbx li.bad{background:#FFF1F0;border:1px solid #FFCDC7}
.dbx li.good{background:#ECFDF3;border:1px solid #B7EBC9}
.dbx blockquote.callout{margin:14px 0;padding:12px 16px 12px 46px;border-radius:12px;background:linear-gradient(135deg,#E8F1FF,#F5F9FF);border:1px solid #C7DBFF;position:relative;color:#1E3A5F}
.dbx blockquote.callout:before{content:"ℹ️";position:absolute;left:14px;top:11px;font-size:18px}
.dbx blockquote.callout p{margin:4px 0}
.dbx .code{border-radius:12px;overflow:hidden;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.18);background:#0D1117}
.dbx .code-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161B22;border-bottom:1px solid #30363D}
.dbx .code-bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57;display:inline-block}
.dbx .code-bar i:nth-child(2){background:#FEBC2E}.dbx .code-bar i:nth-child(3){background:#28C840}
.dbx .lang{margin-left:8px;color:#8B949E;font-size:11px;letter-spacing:.1em;font-weight:700}
.dbx .run{margin-left:auto;color:#3FB950;font-size:11px;font-weight:700}
.dbx .copy{display:none}
.dbx .code pre{margin:0;padding:14px 16px;color:#E6EDF3;font-size:13px;line-height:1.55;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:transparent}
.dbx pre.diagram{background:linear-gradient(135deg,#F8FAFC,#EEF2FF);border:1px dashed #A5B4FC;border-radius:12px;padding:14px 16px;font-size:13px;color:#312E81;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dbx .tryit{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ECFDF3,#F0FDFA);border:1px solid #A7F3D0;border-radius:12px;padding:12px 16px;margin:12px 0}
.dbx .tryit b{color:#047857}
.dbx .present{display:flex;gap:16px;align-items:center;border-radius:14px;padding:16px 20px;background:linear-gradient(120deg,#2a2f6b,#7C4DFF);color:#fff;box-shadow:0 10px 30px rgba(124,77,255,.3)}
.dbx .present b{font-size:17px}
.dbx .present span{color:#E9E5FF}
.dbx .present .big{font-size:34px}
.dbx .footer{margin-top:10px;padding:14px 18px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);color:var(--muted);font-size:13px}
:root{--navy:#1B3139;--accent:#FF3621;--blue:#2272B4;--purple:#7C4DFF;--teal:#00A3A1;--bg:#F4F2EE;--muted:#6B7280;--line:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1F2937;overflow:hidden}
body.embedded{height:760px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--navy);color:#fff;flex:none;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}
.crumb{color:#94A3B8;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}

.hbtn{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E2E8F0;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85em;font-family:inherit}
.hbtn:hover{background:rgba(255,255,255,.1)}
#bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--teal));width:0;transition:width .35s ease;flex:none}
#slides{flex:1;display:flex;flex-direction:column;min-height:0;padding:18px 22px 10px;position:relative}
.stage{flex:1;position:relative;min-height:0;perspective:1400px}
.slide{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(27,49,57,.14);overflow:auto;padding:34px 52px 40px}
.slide.enter-r{animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-l{animation:inL .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px) rotateY(-6deg)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) rotateY(6deg)}to{opacity:1;transform:none}}
.slide .dbx{max-width:none;font-size:18px}
.slide .dbx .sec-head h2{font-size:32px}
.slide .dbx table{font-size:16px}
.slide .dbx .code pre{font-size:14.5px}
.slide .dbx>*{animation:dbxRise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
.slide.title{padding:0;overflow:hidden;background:transparent;box-shadow:0 18px 50px rgba(27,49,57,.25)}
.slide.title .dbx{height:100%;display:flex;flex-direction:column;position:relative}
.slide.title .hero{flex:1;margin:0;border-radius:20px;display:flex;align-items:center;padding:60px 70px 150px}
.slide.title .hero h1{font-size:54px}
.slide.title .sub{font-size:20px}
.slide.title .b1{width:420px;height:420px}.slide.title .b2{width:340px;height:340px}.slide.title .b3{width:300px;height:300px}
.slide.title .idea{position:absolute;left:70px;right:70px;bottom:40px;font-size:18px;background:rgba(255,255,255,.96)}
.slide.title .dbx>:not(.hero):not(.idea){display:none}
.controls{display:flex;align-items:center;gap:12px;padding-top:12px;flex:none}
.controls .nav{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:16px}
.controls .nav:hover{border-color:var(--accent);color:var(--accent)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#CBD5E1;cursor:pointer;padding:0;transition:all .25s}
.dots button.on{background:var(--accent);width:28px;border-radius:6px}
.count{color:var(--muted);font-size:.85em;min-width:60px;text-align:right}
.hint{color:#94A3B8;font-size:.78em;white-space:nowrap}
#overview{position:absolute;inset:0;background:rgba(244,242,238,.97);z-index:4;display:none;overflow:auto;padding:26px}
#overview.on{display:block;animation:dbxRise .3s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:all .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .n{font-size:.75em;color:var(--muted);font-weight:700}
.card .i{font-size:28px;margin:6px 0}
.card .t{font-weight:700;color:var(--navy)}
#doc{flex:1;display:none;min-height:0}
body.docmode #slides{display:none}
body.docmode #doc{display:flex}
#toc{width:270px;flex:none;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:#fff}
#toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;color:#334155;text-decoration:none;font-size:.9em;margin:2px 0}
#toc a:hover{background:#F1F5F9}
#toc a.on{background:#FFF1EE;color:#C62D1A;font-weight:700}
#docScroll{flex:1;overflow:auto;padding:26px 34px 80px}
.dsec{background:#fff;border-radius:18px;padding:26px 32px;margin:0 auto 18px;max-width:1000px;box-shadow:0 4px 18px rgba(27,49,57,.06);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.dsec.seen{opacity:1;transform:none}
.dsec.herosec{padding:0;background:transparent;box-shadow:none}
.dsec .dbx>*{animation:none}
.quiz{max-width:820px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.dbx .code .copy{display:inline-block;margin-left:auto;border:1px solid #30363D;background:#21262D;color:#C9D1D9;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
.dbx .code .run+.copy{margin-left:10px}
@media (max-width:760px){.slide{padding:22px}.slide.title .hero{padding:30px 30px 160px}.slide.title .hero h1{font-size:32px}.slide.title .idea{left:16px;right:16px}#toc{display:none}.crumb{display:none}.hint{display:none}}
@media print{header,.controls,#bar,#toc{display:none}body{overflow:visible}#doc{display:block}#slides{display:none}.dsec{opacity:1;transform:none;box-shadow:none}}
</style>

<script>
function dbxQuiz(root, questions, onDone) {
  if (typeof root === 'string') root = document.getElementById(root);
  var i = 0, score = 0, picked = null, shown = false, done = false;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code style="background:#EEF2FF;color:#3730A3;padding:1px 6px;border-radius:6px">$1</code>'); }
  function btn(label, primary) { return '<button style="margin-top:16px;padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-weight:700;background:' + (primary ? 'linear-gradient(135deg,#FF3621,#7C4DFF)' : '#E5E7EB') + ';color:' + (primary ? '#fff' : '#6B7280') + ';font-size:0.95em;box-shadow:' + (primary ? '0 6px 18px rgba(124,77,255,.3)' : 'none') + '">' + label + '</button>'; }
  var box = 'padding:22px 24px;border-radius:16px;background:#fff;border:1px solid #E5E7EB;box-shadow:0 8px 28px rgba(27,49,57,.08);animation:dbxQ .4s ease both';
  var style = '<style>@keyframes dbxQ{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>';
  function bar() {
    var h = '<div style="display:flex;gap:6px;margin-bottom:14px">';
    for (var k = 0; k < questions.length; k++) h += '<div style="flex:1;height:6px;border-radius:6px;background:' + (k < i ? 'linear-gradient(90deg,#FF3621,#7C4DFF)' : k === i ? '#C4B5FD' : '#E5E7EB') + '"></div>';
    return h + '</div>';
  }
  function render() {
    if (i >= questions.length) {
      var pct = Math.round(score / questions.length * 100), msg = pct === 100 ? 'Perfect! 🎉' : pct >= 60 ? 'Nice work! 💪' : 'Worth another look 📖';
      root.innerHTML = style + '<div style="' + box + ';text-align:center"><div style="font-size:48px">' + (pct === 100 ? '🏆' : pct >= 60 ? '🌟' : '🔁') + '</div><div style="font-size:1.6em;font-weight:800;color:#1B3139">' + score + ' / ' + questions.length + '</div><div style="color:#6B7280;margin-top:4px">' + msg + '</div>' + btn('Retake', true) + '</div>';
      root.querySelector('button').onclick = function () { i = 0; score = 0; picked = null; shown = false; done = false; render(); };
      if (!done && onDone) { done = true; onDone(score, questions.length); }
      return;
    }
    var Q = questions[i], h = style + '<div style="' + box + '">' + bar();
    h += '<div style="color:#7C4DFF;font-size:0.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Question ' + (i + 1) + ' of ' + questions.length + '</div>';
    h += '<div style="font-weight:700;color:#1B3139;margin-bottom:14px;line-height:1.5;font-size:1.05em">' + esc(Q.q) + '</div>';
    Q.o.forEach(function (t, k) {
      var bg = '#fff', bd = '#E5E7EB', mark = String.fromCharCode(65 + k);
      if (shown && k === Q.c) { bg = '#ECFDF3'; bd = '#22C55E'; mark = '✓'; }
      else if (shown && k === picked) { bg = '#FFF1F0'; bd = '#EF4444'; mark = '✗'; }
      else if (!shown && k === picked) { bg = '#F5F3FF'; bd = '#7C4DFF'; }
      h += '<div data-k="' + k + '" style="display:flex;gap:12px;align-items:center;padding:11px 14px;margin:8px 0;border:2px solid ' + bd + ';background:' + bg + ';border-radius:12px;cursor:' + (shown ? 'default' : 'pointer') + ';color:#1F2937;transition:all .15s">' +
        '<span style="flex:none;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;background:' + (bd === '#E5E7EB' ? '#F1F5F9' : bd) + ';color:' + (bd === '#E5E7EB' ? '#64748B' : '#fff') + '">' + mark + '</span><span>' + esc(t) + '</span></div>';
    });
    if (shown) {
      var ok = picked === Q.c;
      h += '<div style="margin-top:14px;padding:14px 16px;border-radius:12px;background:' + (ok ? '#ECFDF3' : '#FFF7ED') + ';border:1px solid ' + (ok ? '#A7F3D0' : '#FED7AA') + ';color:#1F2937;animation:dbxQ .3s both"><strong>' + (ok ? '✅ Correct.' : '💡 Not quite.') + '</strong> ' + esc(Q.e) + '</div>' + btn(i + 1 < questions.length ? 'Next →' : 'See score', true);
    } else {
      h += btn('Submit', picked !== null);
    }
    root.innerHTML = h + '</div>';
    if (!shown) root.querySelectorAll('[data-k]').forEach(function (el) { el.onclick = function () { picked = +el.getAttribute('data-k'); render(); }; });
    root.querySelector('button').onclick = function () {
      if (!shown) { if (picked === null) return; if (picked === Q.c) score++; shown = true; }
      else { i++; picked = null; shown = false; }
      render();
    };
  }
  render();
}
var SLIDES = [{"title": "Recap: Databricks Performance Optimization", "icon": "🚀", "html": "<div class=\"hero\"><div class=\"blob b1\"><\/div><div class=\"blob b2\"><\/div><div class=\"blob b3\"><\/div><div class=\"hero-in\"><div class=\"kicker\">Advanced Data Engineering with Databricks<\/div><h1><span class=\"kicker-inline\">Recap<\/span>Databricks Performance Optimization<\/h1><div class=\"chips\"><span class=\"chip\">Course 3 of 4<\/span><span class=\"chip\">⏱ ~9 minutes<\/span><\/div><p class=\"sub\">Why queries are slow and what to do about it: <strong>file layout and data skipping<\/strong>, the classic Spark problems (<strong>skew, shuffle, spill, serialization<\/strong>), and choosing <strong>compute<\/strong>.<\/p><\/div><\/div><div class=\"idea\"><span class=\"idea-icon\">💡<\/span><div><b>The one idea to remember:<\/b> first <strong>read less data<\/strong> (good layout, data skipping), then <strong>move less data<\/strong> (avoid shuffles, broadcast small sides), and only then <strong>add hardware<\/strong>. The query profile and the Spark UI tell you which problem you have.<\/div><\/div>"}, {"title": "What we covered", "icon": "🗺️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">01<\/span><span class=\"sec-icon\">🗺️<\/span><h2>What we covered<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Key takeaway<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Spark architecture<\/td>\n<td>Driver, executors, <strong>jobs → stages → tasks<\/strong>. Shuffles create stage boundaries<\/td>\n<\/tr>\n<tr>\n<td>File layout<\/td>\n<td>Small files, <strong>data skipping<\/strong> with file statistics, partitioning vs Z-order vs <strong>liquid clustering<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Managed maintenance<\/td>\n<td><code>OPTIMIZE<\/code>, <code>VACUUM<\/code>, optimized writes, auto compaction, <strong>predictive optimization<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Skew<\/td>\n<td>One task takes much longer than the rest. Fix it with AQE, salting, or filtering hot keys<\/td>\n<\/tr>\n<tr>\n<td>Shuffle<\/td>\n<td>Wide transformations move data across the network. Broadcast joins avoid it<\/td>\n<\/tr>\n<tr>\n<td>Spill<\/td>\n<td>Not enough memory per task, so data goes to disk. Fix it with more or smaller partitions or bigger nodes<\/td>\n<\/tr>\n<tr>\n<td>Serialization<\/td>\n<td>Python UDFs are slow. Prefer <strong>built-in functions<\/strong>, then pandas UDFs<\/td>\n<\/tr>\n<tr>\n<td>Compute &amp; diagnostics<\/td>\n<td>Cluster sizing, <strong>Photon<\/strong>, serverless, <strong>query profile<\/strong>, <strong>Spark UI<\/strong>, caching<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "How Spark executes a query", "icon": "⚙️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">02<\/span><span class=\"sec-icon\">⚙️<\/span><h2>How Spark executes a query<\/h2><\/div><pre class=\"diagram\">Query ─► Job ─► Stage 1 (scan, filter, project)  ─┐ shuffle (exchange)\n                                                  ├► Stage 2 (join / aggregate) ─► write\n                                                  │\n         one task per partition, run in parallel on executor cores<\/pre>\n<ul>\n<li><strong>Narrow<\/strong> transformations (<code>filter<\/code>, <code>select<\/code>, <code>withColumn<\/code>) stay in the same stage.<\/li>\n<li><strong>Wide<\/strong> transformations (<code>groupBy<\/code>, <code>join<\/code>, <code>distinct<\/code>, <code>orderBy<\/code>) need a <strong>shuffle<\/strong>, which starts a new stage.<\/li>\n<li><strong>Adaptive Query Execution (AQE)<\/strong>, on by default, re-plans at stage boundaries using real data sizes:<\/li>\n<li>switches to a <strong>broadcast join<\/strong>;<\/li>\n<li><strong>coalesces<\/strong> small partitions;<\/li>\n<li>splits <strong>skewed<\/strong> partitions.<\/li>\n<\/ul>"}, {"title": "File layout and data skipping", "icon": "🗂️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">03<\/span><span class=\"sec-icon\">🗂️<\/span><h2>File layout and data skipping<\/h2><\/div><p>Delta stores <strong>min/max statistics<\/strong> per file, so a selective filter can <strong>skip files<\/strong>. That only works when similar values sit in the same files.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Technique<\/th>\n<th>Use when<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Liquid clustering<\/strong> <code>CLUSTER BY (cols)<\/code><\/td>\n<td><strong>Default for new tables<\/strong>. Filter or join on 1–4 columns, any cardinality<\/td>\n<td>Incremental, and keys can be changed without a rewrite<\/td>\n<\/tr>\n<tr>\n<td><strong><code>CLUSTER BY AUTO<\/code><\/strong><\/td>\n<td>Managed tables with unknown or changing query patterns<\/td>\n<td>Databricks picks the keys (needs predictive optimization)<\/td>\n<\/tr>\n<tr>\n<td><strong>Partitioning<\/strong><\/td>\n<td>Very large tables (many TB) with a <strong>low-cardinality<\/strong> column used for lifecycle (e.g. date), partitions ≥ ~1 GB<\/td>\n<td>Over-partitioning leads to millions of small files<\/td>\n<\/tr>\n<tr>\n<td><strong>Z-order<\/strong> (legacy)<\/td>\n<td>Existing partitioned tables<\/td>\n<td>Not incremental. Must be re-run on all data<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">SQL<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">CREATE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">sales<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(sale_ts<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TIMESTAMP<\/span><span style=\"color: #E6EDF3\">,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">customer_id<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">BIGINT,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">store_id<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">INT,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">amount<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">DOUBLE)<\/span>\n<span style=\"color: #FF7B72\">CLUSTER<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">BY<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">(customer_id,<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">sale_ts);<\/span>\n\n<span style=\"color: #E6EDF3\">OPTIMIZE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">sales;<\/span><span style=\"color: #6E7681\">                     <\/span><span style=\"color: #8B949E; font-style: italic\">-- compacts small files and clusters new data<\/span>\n<span style=\"color: #FF7B72\">ANALYZE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">TABLE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">sales<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">COMPUTE<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">STATISTICS<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">FOR<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">ALL<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">COLUMNS;<\/span><\/pre><\/div>\n<ul>\n<li><strong>Small-file problem:<\/strong> many tiny files from streaming or over-partitioning mean slow listing and slow scans. Fix it with <code>OPTIMIZE<\/code>, auto compaction and optimized writes.<\/li>\n<li><strong>Predictive optimization<\/strong> on UC managed tables runs <code>OPTIMIZE<\/code>, <code>VACUUM<\/code> and <code>ANALYZE<\/code> for you.<\/li>\n<li>Write predicates on the column itself (<code>sale_ts &gt;= '2026-01-01'<\/code>), not on a function of it (<code>date(sale_ts) = …<\/code>), so that skipping works.<\/li>\n<\/ul>"}, {"title": "The four classic problems", "icon": "🔥", "html": "<div class=\"sec-head\"><span class=\"sec-num\">04<\/span><span class=\"sec-icon\">🔥<\/span><h2>The four classic problems<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Symptom in Spark UI / query profile<\/th>\n<th>Fixes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Skew<\/strong><\/td>\n<td>One task runs far longer than the median. Rows per task are very uneven<\/td>\n<td>AQE skew join (on by default), <strong>salting<\/strong> hot keys, filtering or handling NULL / \"unknown\" keys separately<\/td>\n<\/tr>\n<tr>\n<td><strong>Shuffle<\/strong><\/td>\n<td>Large <em>shuffle read/write<\/em> bytes, many exchanges<\/td>\n<td><strong>Broadcast<\/strong> the small side, filter and select early, pre-aggregate, cluster on join keys<\/td>\n<\/tr>\n<tr>\n<td><strong>Spill<\/strong><\/td>\n<td><em>Spill (memory/disk)<\/em> &gt; 0 in sort, aggregate or join stages<\/td>\n<td>More partitions (smaller tasks), memory-optimized nodes, less data per key<\/td>\n<\/tr>\n<tr>\n<td><strong>Serialization<\/strong><\/td>\n<td>Slow Python UDF stages, Photon falls back<\/td>\n<td>Replace UDFs with <strong>built-in functions<\/strong>. Otherwise use <strong>pandas (vectorized) UDFs<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark.sql<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">functions<\/span> <span style=\"color: #FF7B72\">as<\/span> <span style=\"color: #E6EDF3\">F<\/span>\n\n<span style=\"color: #8B949E; font-style: italic\"># ❌ row-by-row Python UDF: data shipped to Python one row at a time<\/span>\n<span style=\"color: #8B949E; font-style: italic\"># clean = F.udf(lambda s: s.strip().lower())<\/span>\n\n<span style=\"color: #8B949E; font-style: italic\"># ✅ built-in, runs in the JVM / Photon<\/span>\n<span style=\"color: #E6EDF3\">df<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">df<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">withColumn(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lower(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">trim(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">)))<\/span>\n\n<span style=\"color: #8B949E; font-style: italic\"># ✅ broadcast a small dimension to avoid shuffling the big fact table<\/span>\n<span style=\"color: #E6EDF3\">result<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">facts<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">join(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">broadcast(stores),<\/span> <span style=\"color: #A5D6FF\">\"store_id\"<\/span><span style=\"color: #E6EDF3\">)<\/span><\/pre><\/div>"}, {"title": "Joins and shuffle partitions", "icon": "🔗", "html": "<div class=\"sec-head\"><span class=\"sec-num\">05<\/span><span class=\"sec-icon\">🔗<\/span><h2>Joins and shuffle partitions<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Join strategy<\/th>\n<th>When<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Broadcast hash join<\/strong><\/td>\n<td>One side is small (under <code>spark.sql.autoBroadcastJoinThreshold<\/code>, or AQE decides at runtime)<\/td>\n<td><strong>No shuffle<\/strong> of the big side, the fastest option<\/td>\n<\/tr>\n<tr>\n<td>Shuffle hash join<\/td>\n<td>Medium side fits in memory per partition<\/td>\n<td>One shuffle<\/td>\n<\/tr>\n<tr>\n<td><strong>Sort-merge join<\/strong><\/td>\n<td>Both sides large<\/td>\n<td>Shuffle <strong>and<\/strong> sort on both sides<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><code>spark.sql.shuffle.partitions<\/code> (default 200): with AQE, set it high (or <code>auto<\/code>) and let coalescing shrink it.<\/li>\n<li>Too few partitions give huge tasks and spill. Too many give scheduling overhead and tiny output files.<\/li>\n<li>Missing statistics can hide a broadcast opportunity. Run <code>ANALYZE TABLE<\/code>, or add a <code>/*+ BROADCAST(dim) */<\/code> hint.<\/li>\n<\/ul>"}, {"title": "Compute choices", "icon": "🖥️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">06<\/span><span class=\"sec-icon\">🖥️<\/span><h2>Compute choices<\/h2><\/div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Choice<\/th>\n<th>Guidance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Serverless<\/strong><\/td>\n<td>Default for jobs, pipelines and SQL: fast start, auto-scaling, no tuning<\/td>\n<\/tr>\n<tr>\n<td><strong>Photon<\/strong><\/td>\n<td>Vectorized engine for SQL and DataFrame workloads. Big gains on scans, joins, aggregations and Delta writes<\/td>\n<\/tr>\n<tr>\n<td>Node type<\/td>\n<td>Memory-optimized for large shuffles, joins and caching. Compute-optimized for CPU-heavy transforms. Storage-optimized (local SSD) for the <strong>disk cache<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Autoscaling<\/td>\n<td>Good for variable load. Fixed size for steady streaming workloads<\/td>\n<\/tr>\n<tr>\n<td>Job clusters<\/td>\n<td>Production jobs. All-purpose clusters are for interactive work<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Caching:<\/strong>\n- <strong>Disk cache<\/strong>: automatic on SSD-backed nodes and SQL warehouses, and always consistent.\n- <strong>Spark cache<\/strong> (<code>df.cache()<\/code>): manual, uses executor memory, and can go stale.\n- <strong>Query result cache<\/strong>: repeated identical SQL queries.<\/p>"}, {"title": "Diagnosing a slow query", "icon": "🩺", "html": "<div class=\"sec-head\"><span class=\"sec-num\">07<\/span><span class=\"sec-icon\">🩺<\/span><h2>Diagnosing a slow query<\/h2><\/div><ol>\n<li>Open the <strong>query profile<\/strong> (SQL / serverless) or the <strong>Spark UI<\/strong> (classic).<\/li>\n<li><strong>Files pruned ≈ 0<\/strong> on a selective filter? → layout problem: clustering, statistics, predicate.<\/li>\n<li><strong>Sort-merge join<\/strong> with a small side? → broadcast / statistics.<\/li>\n<li><strong>Shuffle bytes<\/strong> huge? → filter early, broadcast, pre-aggregate.<\/li>\n<li><strong>Max task time ≫ median<\/strong>? → skew.<\/li>\n<li><strong>Spill<\/strong> &gt; 0? → partitions or memory.<\/li>\n<li>Only then: bigger compute, or Photon if it isn't on yet.<\/li>\n<\/ol>"}, {"title": "Try it: layout, join strategy, serialization", "icon": "🧪", "html": "<div class=\"sec-head\"><span class=\"sec-num\">08<\/span><span class=\"sec-icon\">🧪<\/span><h2>Try it: layout, join strategy, serialization<\/h2><\/div><blockquote class=\"callout\">\n<p>Uses the synthetic <strong>retail<\/strong> tables, plus 5 million generated rows for the UDF comparison.<\/p>\n<\/blockquote>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># ✏️ FILL IN: the catalog.schema you can write to<\/span>\n<span style=\"color: #E6EDF3\">WORK_SCHEMA<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #A5D6FF\">\"FILL_IN\"<\/span>   <span style=\"color: #8B949E; font-style: italic\"># e.g. \"dbacademy.labuser1234567_1700000000\"<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Load the retail tables from GitHub<\/span>\n<span style=\"color: #FF7B72\">import<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">urllib.request<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">as<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">u<\/span><span style=\"color: #E6EDF3\">;<\/span> <span style=\"color: #E6EDF3\">exec(u<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">urlopen(<\/span><span style=\"color: #A5D6FF\">\"https://raw.githubusercontent.com/misrori/dbxhelp/main/dbxdata.py\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">read()<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">decode())<\/span>\n<span style=\"color: #E6EDF3\">S<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">load_dataset(<\/span><span style=\"color: #A5D6FF\">\"retail\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">WORK_SCHEMA)<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Liquid clustering: create a clustered copy and inspect its layout<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"CREATE OR REPLACE TABLE orders_clustered CLUSTER BY (customer_id, order_date) AS SELECT * FROM fact_orders\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"OPTIMIZE orders_clustered\"<\/span><span style=\"color: #E6EDF3\">)<\/span>\n<span style=\"color: #E6EDF3\">display(spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"DESCRIBE DETAIL orders_clustered\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">select(<\/span><span style=\"color: #A5D6FF\">\"clusteringColumns\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"numFiles\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #A5D6FF\">\"sizeInBytes\"<\/span><span style=\"color: #E6EDF3\">))<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Join strategy: look for BroadcastHashJoin. The small dimension is broadcast, so the fact table isn't shuffled<\/span>\n<span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sql(<\/span><span style=\"color: #A5D6FF\">\"\"\"<\/span>\n<span style=\"color: #A5D6FF\">SELECT p.category, sum(f.quantity * p.unit_price) AS revenue<\/span>\n<span style=\"color: #A5D6FF\">FROM fact_orders f JOIN dim_product p ON f.product_id = p.product_id<\/span>\n<span style=\"color: #A5D6FF\">GROUP BY ALL<\/span>\n<span style=\"color: #A5D6FF\">\"\"\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">explain()<\/span><\/pre><\/div>\n<div class=\"code\"><div class=\"code-bar\"><i><\/i><i><\/i><i><\/i><span class=\"lang\">PYTHON<\/span><span class=\"run\">▶ runs in the notebook<\/span><button class=\"copy\" type=\"button\">copy<\/button><\/div><pre><span style=\"color: #8B949E; font-style: italic\"># Serialization: a row-by-row Python UDF vs built-in functions on 5 million rows<\/span>\n<span style=\"color: #FF7B72\">import<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">time<\/span>\n<span style=\"color: #FF7B72\">from<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">pyspark.sql<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72\">import<\/span> <span style=\"color: #E6EDF3\">functions<\/span> <span style=\"color: #FF7B72\">as<\/span> <span style=\"color: #E6EDF3\">F<\/span>\n\n<span style=\"color: #E6EDF3\">df<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">spark<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">range(<\/span><span style=\"color: #A5D6FF\">5_000_000<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">withColumn(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">concat(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lit(<\/span><span style=\"color: #A5D6FF\">\"  User\"<\/span><span style=\"color: #E6EDF3\">),<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">col(<\/span><span style=\"color: #A5D6FF\">\"id\"<\/span><span style=\"color: #E6EDF3\">)<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">cast(<\/span><span style=\"color: #A5D6FF\">\"string\"<\/span><span style=\"color: #E6EDF3\">),<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lit(<\/span><span style=\"color: #A5D6FF\">\"@Example.COM \"<\/span><span style=\"color: #E6EDF3\">)))<\/span>\n<span style=\"color: #E6EDF3\">clean_udf<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">udf(<\/span><span style=\"color: #FF7B72\">lambda<\/span> <span style=\"color: #E6EDF3\">s:<\/span> <span style=\"color: #E6EDF3\">s<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">strip()<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lower())<\/span>\n\n<span style=\"color: #FF7B72\">for<\/span> <span style=\"color: #E6EDF3\">name,<\/span> <span style=\"color: #E6EDF3\">col<\/span> <span style=\"color: #FF7B72; font-weight: bold\">in<\/span> <span style=\"color: #E6EDF3\">[(<\/span><span style=\"color: #A5D6FF\">\"Python UDF\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">clean_udf(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">)),<\/span> <span style=\"color: #E6EDF3\">(<\/span><span style=\"color: #A5D6FF\">\"built-in\"<\/span><span style=\"color: #E6EDF3\">,<\/span> <span style=\"color: #E6EDF3\">F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">lower(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">trim(<\/span><span style=\"color: #A5D6FF\">\"email\"<\/span><span style=\"color: #E6EDF3\">)))]:<\/span>\n    <span style=\"color: #E6EDF3\">start<\/span> <span style=\"color: #FF7B72; font-weight: bold\">=<\/span> <span style=\"color: #E6EDF3\">time<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">time()<\/span>\n    <span style=\"color: #E6EDF3\">df<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">select(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">sum(F<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">length(col)))<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">collect()<\/span>\n    <span style=\"color: #E6EDF3\">print(<\/span><span style=\"color: #79C0FF\">f<\/span><span style=\"color: #A5D6FF\">\"{<\/span><span style=\"color: #E6EDF3\">name<\/span><span style=\"color: #A5D6FF\">:&lt;11} {<\/span><span style=\"color: #E6EDF3\">time<\/span><span style=\"color: #FF7B72; font-weight: bold\">.<\/span><span style=\"color: #E6EDF3\">time()<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #FF7B72; font-weight: bold\">-<\/span><span style=\"color: #6E7681\"> <\/span><span style=\"color: #E6EDF3\">start<\/span><span style=\"color: #A5D6FF\">:5.1f} s\"<\/span><span style=\"color: #E6EDF3\">)<\/span><\/pre><\/div>"}, {"title": "Common mistakes", "icon": "⚠️", "html": "<div class=\"sec-head\"><span class=\"sec-num\">09<\/span><span class=\"sec-icon\">⚠️<\/span><h2>Common mistakes<\/h2><\/div><ul>\n<li class=\"bad\">❌ Scaling up the cluster when the profile shows <strong>no data skipping<\/strong>. Fix the layout first.<\/li>\n<li class=\"bad\">❌ Partitioning a 200 GB table, or partitioning by a high-cardinality column. Use <strong>liquid clustering<\/strong>.<\/li>\n<li class=\"bad\">❌ Scheduling <code>ZORDER<\/code> jobs on managed tables with liquid clustering and predictive optimization.<\/li>\n<li class=\"bad\">❌ Row-by-row Python UDFs for logic that built-in functions already cover.<\/li>\n<li class=\"bad\">❌ Forcing <code>spark.sql.shuffle.partitions = 2000<\/code> everywhere instead of letting AQE coalesce.<\/li>\n<li class=\"bad\">❌ <code>df.cache()<\/code> for a dashboard read by many users. Rely on the disk cache or result cache.<\/li>\n<\/ul>\n<p><strong>Next course:<\/strong> <em>Automated Deployment with Databricks Asset Bundles<\/em>.<\/p>"}];
var QUIZ = [{"q": "A query filters a 5 TB table on customer_id, and the query profile shows almost no files pruned. What is the best first step?", "o": ["Double the cluster size", "Partition the table by customer_id", "Use liquid clustering on customer_id (then OPTIMIZE)", "Cache the table with df.cache()"], "c": 2, "e": "No pruning means a layout problem. Liquid clustering co-locates customer_id values so file statistics can skip files. Partitioning by a high-cardinality column creates millions of tiny files."}, {"q": "In the Spark UI, one task of a stage runs for 25 minutes while the median task takes 20 seconds. What is the most likely cause?", "o": ["Data skew on the join or grouping key", "Too many executors", "Missing Photon", "Disk cache disabled"], "c": 0, "e": "A single task far slower than the median is the classic sign of skew: one key holds much more data. AQE skew handling, salting, or treating hot keys separately helps."}, {"q": "A 2 TB fact table is joined to a 20 MB store dimension, and the plan shows a sort-merge join with a large shuffle. What do you do?", "o": ["Increase spark.sql.shuffle.partitions to 5000", "Broadcast the small dimension (fresh statistics or a BROADCAST hint)", "Convert the dimension to CSV", "Repartition the fact table by store_id before every query"], "c": 1, "e": "A broadcast hash join ships the small table to every executor, so the large side never needs to be shuffled."}, {"q": "A transformation trims and lower-cases emails using a Python UDF and is slow. What is the best fix?", "o": ["Rewrite it with built-in functions: lower(trim(email))", "Increase driver memory", "Cache the DataFrame before the UDF", "Run it on a single-node cluster"], "c": 0, "e": "Python UDFs serialize rows between the JVM and Python and block Photon. Built-in functions run natively and are much faster."}, {"q": "Stage metrics show large 'spill (disk)' values during an aggregation. Which change addresses spill directly?", "o": ["Fewer, larger shuffle
